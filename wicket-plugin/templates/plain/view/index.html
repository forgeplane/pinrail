<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>__TITLE__</title>
<link rel="stylesheet" href="/sdk/v1/wicket-plugin.css">
<style>
  /* The tokens, the base and every class below come from the SDK stylesheet;
     these rules are all this view needs of its own. */
  .choice { display: flex; gap: 8px; margin: 14px 0 10px; }
  .choice .btn { display: inline-flex; align-items: center; gap: 6px; }
  #comment { width: 100%; max-width: 420px; }
  .errors { min-height: 16px; margin-top: 10px; }
</style>
</head>
<body>
<script src="/sdk/v1/wicket-plugin.js"></script>
<script>
// __TITLE__: one question, yes or no, with an optional comment. The answer
// is held here; the app's hand-over button (or ⌘/Ctrl+Enter) sends `collect`
// and this view submits. Replace render() and handOver() with your own.
"use strict";
const view = Wicket.layout();
view.content.className = "plugin-content dim";
view.content.textContent = "waiting for the shell…";
let choice = null;

const plugin = Wicket.connect({
  onInit({ draft }) {
    choice = draft && typeof draft.ok === "boolean" ? draft.ok : null;
    render(draft);
  },
  onSubmitted() { render(); },
  onViolations(errors) {
    document.getElementById("errors").textContent = errors.map((e) => `${e.path || "/"}: ${e.message}`).join("\n");
  },
  onCollect() { handOver(); },
});

const comment = () => document.getElementById("comment").value.trim();

function handOver() {
  if (choice === null) {
    document.getElementById("errors").textContent = "Choose yes or no first.";
    return;
  }
  const note = comment();
  plugin.submit(note ? { ok: choice, comment: note } : { ok: choice });
}

function pick(value) {
  choice = choice === value ? null : value;
  plugin.draft({ ok: choice, comment: comment() }, { flush: true });
  render({ ok: choice, comment: comment() });
}

function render(draft) {
  const gate = plugin.gate;
  const decided = gate.decision && gate.decision.data;
  view.content.className = "plugin-content";
  view.content.innerHTML = Wicket.markdown(gate.payload.message) + (plugin.readonly
    ? `<p class="dim">Decided: <b>${decided && decided.ok ? "yes" : "no"}</b>${decided && decided.comment ? " — " + Wicket.escape(decided.comment) : ""}</p>`
    : `<div class="choice">
         <button type="button" class="btn" id="yes" aria-pressed="${choice === true}">${Wicket.icon("check")} Yes</button>
         <button type="button" class="btn" id="no" aria-pressed="${choice === false}">${Wicket.icon("x")} No</button>
       </div>
       <input class="field" id="comment" placeholder="comment (optional)" aria-label="comment" value="${Wicket.escape((draft && draft.comment) || "")}">
       <div id="errors" class="errors"></div>`);
  if (plugin.readonly) return;
  document.getElementById("comment").oninput = () => plugin.draft({ ok: choice, comment: comment() });
  document.getElementById("yes").onclick = () => pick(true);
  document.getElementById("no").onclick = () => pick(false);
  plugin.status({ label: choice === null ? "Hand over" : `Hand over: ${choice ? "yes" : "no"}` });
}
</script>
</body>
</html>
