<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>wicket plugin harness</title></head>
<body style="margin:0;background:#101216">
<iframe id="plugin-frame" sandbox="allow-scripts" style="display:block;width:100%;height:600px;border:0"></iframe>
<script>
// A stand-in for the wicket shell, implementing the shell side of the
// protocol from plugins/README.md so a plugin can be exercised alone. It
// records every message the plugin posts and lets a test send any message.
"use strict";
const frame = document.getElementById("plugin-frame");
const log = [];
let pending = null; // init to send once the plugin is ready
let ready = false;
let lastDraft = null;
let lastStatus = null;
let lastOpen = null;
let lastSettingsSet = null;
let pinnedHeight = null;

function send(msg) { frame.contentWindow.postMessage(Object.assign({ wicket: 1 }, msg), "*"); }
// "cmd+shift+m" -> the fields of the key message the app sends
function keyMessage(combo) {
  const parts = String(combo).toLowerCase().split("+").map((p) => p.trim());
  const name = parts.pop();
  const mods = new Set(parts);
  const shift = mods.has("shift");
  const special = { enter: ["Enter", "Enter"], escape: ["Escape", "Escape"], space: [" ", "Space"], tab: ["Tab", "Tab"], arrowup: ["ArrowUp", "ArrowUp"], arrowdown: ["ArrowDown", "ArrowDown"], arrowleft: ["ArrowLeft", "ArrowLeft"], arrowright: ["ArrowRight", "ArrowRight"], "/": [shift ? "?" : "/", "Slash"], "[": ["[", "BracketLeft"], "]": ["]", "BracketRight"], ",": [",", "Comma"], ".": [".", "Period"] };
  const [key, code] = special[name] || (name.length === 1 && /[a-z]/.test(name) ? [shift ? name.toUpperCase() : name, "Key" + name.toUpperCase()] : name.length === 1 && /[0-9]/.test(name) ? [name, "Digit" + name] : [name, name]);
  return { key, code, metaKey: mods.has("cmd") || mods.has("meta") || mods.has("super") || mods.has("command"), ctrlKey: mods.has("ctrl") || mods.has("control"), altKey: mods.has("alt") || mods.has("option"), shiftKey: shift };
}
function sendInit(init) { send(Object.assign({ type: "init", shell_origin: location.origin }, init)); }

window.__shell = {
  init(init) { pending = init; if (ready) sendInit(init); },
  reinit(overrides) { pending = Object.assign({}, pending, { draft: lastDraft }, overrides || {}); if (ready) sendInit(pending); },
  send,
  messages: () => log.slice(),
  lastDraft: () => lastDraft,
  lastStatus: () => lastStatus,
  lastOpen: () => lastOpen,
  lastSettingsSet: () => lastSettingsSet,
  /* the plugin's settings changed in the app: the values as they stand */
  settings(values) { send({ type: "settings", settings: values }); },
  /* a declared shortcut pressed while the shell had focus, as "cmd+shift+m" or "j" */
  sendKey(combo) { send(Object.assign({ type: "key" }, keyMessage(combo))); },
  // Hold the frame at a height so a test can make the view scroll; the real
  // shell caps it against the page, the harness otherwise grows to fit.
  setFrameHeight(px) { pinnedHeight = px; frame.style.height = px + "px"; },
  reload() { ready = false; frame.src = frame.src; },
};

// The real shell puts its theme on the frame's URL; mirror that, so a test can
// mount a plugin in either theme and see what it paints before any message.
const theme = new URLSearchParams(location.search).get("theme") === "light" ? "light" : "dark";
document.body.style.background = theme === "light" ? "#ffffff" : "#101216";

window.addEventListener("message", (event) => {
  if (event.source !== frame.contentWindow) return;
  const msg = event.data;
  if (!msg || msg.wicket !== 1) return;
  log.push(msg);
  switch (msg.type) {
    case "settings_set": lastSettingsSet = msg.patch; break;
    case "ready": ready = true; if (pending) sendInit(pending); break;
    case "resize":
      if (pinnedHeight === null) frame.style.height = (msg.height === "fill" ? 800 : Math.max(200, Math.ceil(msg.height))) + "px";
      break;
    case "draft": lastDraft = msg.data; break;
    case "status": lastStatus = msg.label; break;
    // the shell opens it; here it is only recorded
    case "open": lastOpen = msg.url; break;
  }
});
// the view is whatever the manifest names as its entry; index.html by default
const entry = new URLSearchParams(location.search).get("entry") || "index.html";
frame.src = "/" + entry + "#wicket-theme=" + theme;
</script>
</body>
</html>
