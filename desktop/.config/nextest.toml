# A test that runs past a minute is reported as slow, and one that runs
# past five minutes is stopped, so that a hung test fails the run.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }

# The test of a host with many terminals starts as many console hosts on
# Windows, which leaves the other tests too little of the computer to
# answer in time: there it runs alone.
[[profile.default.overrides]]
platform = 'cfg(windows)'
filter = 'package(pinrail-host) & binary(many)'
threads-required = 'num-test-threads'
