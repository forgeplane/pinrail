[package]
name = "pinrail-core"
description = "The pinrail review server as a library: storage, plugins, validation and the HTTP API"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# The docs' reference pages, rendered from the tables the core reads:
# `cargo run -p pinrail-core --features docs --bin pinrail-docs -- settings`.
# Only the docs build turns it on.
docs = []

[[bin]]
name = "pinrail-docs"
path = "src/bin/pinrail-docs.rs"
required-features = ["docs"]

[dependencies]
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
include_dir = "0.7"
jsonschema = { version = "0.56", default-features = false }
mime_guess = "2"
minijinja = { version = "2", features = ["fuel"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "net", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["cors"] }
ureq = { version = "3", features = ["json"] }
zip = { version = "4", default-features = false, features = ["deflate"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
