<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pinrail review preview</title>
<link rel="stylesheet" href="/sdk/v1/pinrail-plugin.css">
<style>
  /* A review as the app shows it, in a browser: the header, the plugin's
     view, the hand-over. The SDK stylesheet gives the tokens and the base. */
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: var(--pinrail-bg); color: var(--pinrail-text); }
  header { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 12px 18px; border-bottom: 1px solid var(--pinrail-border); }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; }
  header .meta { color: var(--pinrail-dim); font-size: 12px; }
  header .about { flex-basis: 100%; color: var(--pinrail-faint); font-size: 12px; }
  main { flex: 1; min-height: 0; overflow: auto; }
  main { display: flex; }
  iframe { display: block; flex: 1; width: 100%; border: 0; }
  footer { display: flex; align-items: center; gap: 10px; padding: 10px 18px; border-top: 1px solid var(--pinrail-border); }
  footer textarea { flex: 1; min-height: 34px; resize: vertical; font: inherit; font-size: 13px; padding: 7px 10px; border: 1px solid var(--pinrail-border); border-radius: 6px; background: var(--pinrail-bg-raised, var(--pinrail-bg)); color: var(--pinrail-text); }
  footer button { padding: 8px 14px; border: 0; border-radius: 6px; background: var(--pinrail-accent); color: #fff; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
  footer button:disabled { opacity: 0.5; cursor: default; }
  .decided { color: var(--pinrail-dim); font-size: 13px; }
  header a { color: var(--pinrail-accent); }
  #result { padding: 10px 18px 0; border-top: 1px solid var(--pinrail-border); font-size: 13px; }
  #result p { margin: 0 0 6px; }
  #result.ok p { color: var(--pinrail-success, #2a7); }
  #result pre { max-height: 180px; margin: 0; padding: 8px 10px; overflow: auto; border: 1px solid var(--pinrail-border); border-radius: 6px; font-size: 12px; }
  footer .hint { flex: 1; color: var(--pinrail-faint); font-size: 12px; }
  .error { padding: 24px 18px; color: var(--pinrail-danger, #c33); }
</style>
</head>
<body>
<header>
  <h1 id="title">Loading…</h1>
  <span class="meta" id="meta"></span>
  <span class="about">A preview: handing it over here checks the decision against the plugin's schema, and decides nothing. <a id="app" href="#">Decide it in Pinrail</a>.</span>
</header>
<main><iframe id="view" sandbox="allow-scripts" title="The plugin's view"></iframe></main>
<section id="result" hidden aria-live="polite"><p></p><pre></pre></section>
<footer id="foot">
  <span class="hint">⌘/Ctrl+Enter presses it too.</span>
  <button type="button" id="handover" disabled>Check the hand-over</button>
</footer>
<script type="module">
// The app's side of the protocol from the SDK's host module, as the app runs
// it, with a hand-over that checks the decision and stores nothing.
import { connectFrame } from "/preview/host.js";

const id = decodeURIComponent(location.pathname.split("/").pop());
const frame = document.getElementById("view");
const button = document.getElementById("handover");
let review = null, previous = null, settings = {};

// a link a view asks for opens out in the world, never back to this machine
const followable = (url) => {
  try {
    const { protocol, hostname } = new URL(url);
    return /^(https?|mailto):$/.test(protocol) && !/^(localhost|.+\.localhost|127(\.\d{1,3}){3}|0\.0\.0\.0|\[::1?\])$/i.test(hostname);
  } catch {
    return false;
  }
};
const theme = () => (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
const json = async (path, options) => {
  const response = await fetch(path, { ...options, headers: { "content-type": "application/json", ...(options && options.headers) } });
  const body = response.status === 204 ? null : await response.json().catch(() => null);
  return { ok: response.ok, status: response.status, body };
};
const readonly = () => !review || review.status !== "pending";

function showDecided() {
  const foot = document.getElementById("foot");
  foot.innerHTML = "";
  const line = document.createElement("span");
  line.className = "decided";
  line.textContent = review.status === "decided" ? "Decided." : `This review is ${review.status}.`;
  foot.append(line);
}

/** What the result area says: a decision that passes, and what the agent would get. */
function result(ok, text, data) {
  const area = document.getElementById("result");
  area.hidden = false;
  area.className = ok ? "ok" : "";
  area.querySelector("p").textContent = text;
  const pre = area.querySelector("pre");
  pre.hidden = data === undefined;
  pre.textContent = data === undefined ? "" : JSON.stringify(data, null, 2);
}

const host = connectFrame(frame, {
  origin: location.origin,
  review: () => review,
  previous: () => previous,
  readonly,
  settings: () => settings,
  theme,
  label: (text) => (button.textContent = `Check: ${text}`),
  open: (url) => {
    if (followable(url)) window.open(url, "_blank", "noreferrer");
  },
  file: async (from, listed) => {
    const response = await fetch(`/api/v1/reviews/${encodeURIComponent(from.id)}/attachments/${encodeURIComponent(listed.name)}`);
    if (!response.ok) throw new Error(`could not fetch ${listed.name}`);
    return response.arrayBuffer();
  },
  // The view's decision, checked and never stored: it passes, and the page
  // shows what the agent would get; or it fails, and the view gets the
  // violations, as in the app. Either way the view can go on editing.
  handOver: async (data) => {
    button.disabled = true;
    try {
      const { ok, body } = await json(`/api/v1/reviews/${encodeURIComponent(id)}/decision?dry_run=true`, { method: "POST", body: JSON.stringify({ data }) });
      if (ok) {
        result(true, "The decision passes. Decided in Pinrail, this is what the agent would get:", data);
        return { ok: false, violations: [] };
      }
      const errors = (body && body.violations) || [{ path: "", message: (body && body.message) || "The decision was refused." }];
      result(false, `The decision fails the plugin's schema: ${errors.length === 1 ? "1 violation" : errors.length + " violations"}, sent back to the view.`);
      return { ok: false, violations: errors };
    } finally {
      if (!readonly()) button.disabled = false;
    }
  },
});

button.addEventListener("click", () => host.collect());
window.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
    e.preventDefault();
    host.collect();
  }
});
matchMedia("(prefers-color-scheme: light)").addEventListener("change", () => {
  document.documentElement.dataset.theme = theme();
  host.appearance(theme());
});

(async () => {
  document.documentElement.dataset.theme = theme();
  const found = await json(`/api/v1/reviews/${encodeURIComponent(id)}`);
  if (!found.ok) {
    document.querySelector("main").innerHTML = "";
    const error = document.createElement("p");
    error.className = "error";
    error.textContent = `No review ${id}.`;
    document.querySelector("main").append(error);
    document.getElementById("title").textContent = "Not found";
    return;
  }
  review = found.body;
  document.getElementById("app").href = `pinrail://reviews/${encodeURIComponent(id)}`;
  if (review.revises) {
    const earlier = await json(`/api/v1/reviews/${encodeURIComponent(review.revises)}`);
    previous = earlier.ok ? earlier.body : null;
  }
  // the review opened, on the version of its plugin it renders with now,
  // and the plugin's settings as they stand
  const view = await json(`/api/v1/reviews/${encodeURIComponent(id)}/view`, { method: "POST" });
  if (view.ok && view.body.review) review = view.body.review;
  const listed = await json("/api/v1/plugins");
  const installed = ((listed.body && listed.body.plugins) || []).find((p) => p.name === review.plugin) || {};
  settings = installed.settings || {};
  document.title = `${review.title} · Pinrail`;
  document.getElementById("title").textContent = review.title;
  document.getElementById("meta").textContent = `${review.plugin} ${review.plugin_version} · ${review.status}`;
  if (readonly()) showDecided();
  else button.disabled = false;
  if (view.ok) frame.src = view.body.url;
})();
</script>
</body>
</html>
