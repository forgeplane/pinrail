[package]
name = "pinrail-runtime"
description = "What Pinrail knows about each coding agent, shared by the app and the CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# a stand-in agent for the core's tests
stand-in = []

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
shlex = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# reading a process's parent, name, start and arguments, and ending it
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Wdk_System_Threading",
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
