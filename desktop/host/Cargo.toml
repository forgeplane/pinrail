[package]
name = "pinrail-host"
description = "The terminal host: a process that runs agents in terminals and outlives the app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["server"]
# the host process itself, which links libghostty-vt; without it, the
# crate is the client side the core uses: framing, registration, launch
server = ["dep:pinrail-screen"]

[[bin]]
name = "pinrail-host"
required-features = ["server"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
getrandom = "0.3"
pinrail-runtime = { path = "../runtime" }
pinrail-screen = { path = "../screen", optional = true }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# the performance budgets: mise run bench:host
[[bench]]
name = "host"
harness = false
required-features = ["server"]

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
