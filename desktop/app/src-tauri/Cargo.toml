[package]
name = "pinrail-desktop"
description = "The pinrail desktop app: the review server with a menu-bar shell"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "pinrail_desktop"
# desktop only: the mobile targets would need staticlib and cdylib
crate-type = ["rlib"]

# macOS names the running process after its executable, so the binary
# carries the product name.
[[bin]]
name = "Pinrail"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.10"

[dependencies]
ureq = { version = "3", features = ["json"] }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
tokio = { version = "1", features = ["rt-multi-thread", "signal", "sync", "time"] }
pinrail-core = { path = "../../core" }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSDictionary", "NSError", "NSBundle", "NSValue", "NSArray", "NSEnumerator"] }
objc2-user-notifications = { version = "0.3", features = ["UNUserNotificationCenter", "UNNotificationRequest", "UNNotificationContent", "UNNotification", "UNNotificationResponse", "UNNotificationSound", "UNNotificationSettings", "block2"] }

[target.'cfg(target_os = "linux")'.dependencies]
# notifications with a default action, so a click opens the review
notify-rust = "4.18"

[target.'cfg(unix)'.dependencies]
# the user's id, to find their login shell when SHELL is not set
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
