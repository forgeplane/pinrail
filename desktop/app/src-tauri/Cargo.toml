[package]
name = "wicket-desktop"
description = "The wicket desktop app: the review server with a menu-bar shell"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "wicket_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

# macOS names the running process after its executable, so the binary
# carries the product name.
[[bin]]
name = "Wicket"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-window-state = "2"
tokio = { version = "1", features = ["rt-multi-thread", "signal", "sync"] }
wicket-core = { path = "../../core" }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSDictionary", "NSError", "NSBundle", "NSValue", "NSArray", "NSEnumerator"] }
objc2-user-notifications = { version = "0.3", features = ["UNUserNotificationCenter", "UNNotificationRequest", "UNNotificationContent", "UNNotification", "UNNotificationResponse", "UNNotificationSound", "UNNotificationSettings", "block2"] }
