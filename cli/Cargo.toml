[package]
name = "pinrail"
version = "0.1.2"
edition = "2024"
rust-version = "1.98"
description = "The command that agents use to ask a person through the Pinrail app before they act"
license = "Apache-2.0"
# it embeds files from elsewhere in the repository, so it is built from here only
publish = false

# CI turns warnings into errors
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[[bin]]
name = "pinrail"
path = "src/main.rs"

[features]
# `pinrail --markdown-help`: the docs' CLI reference, rendered from the clap
# definition. Only the docs build turns it on.
docs = []

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
# the plugin format, to check a plugin folder without the app
pinrail-format = { path = "../desktop/format" }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["json"] }

[profile.release]
strip = true
lto = true
