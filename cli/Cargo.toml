[package]
name = "pinrail"
version = "0.1.0"
edition = "2024"
# the toolchain mise.toml pins and CI builds with
rust-version = "1.98"
description = "CLI for pinrail, the approval-gate service for agent workflows"
license = "Apache-2.0"
# it embeds files from elsewhere in the repository, so it is built from here only
publish = false

[[bin]]
name = "pinrail"
path = "src/main.rs"

[features]
# `pinrail --markdown-help`: the docs' CLI reference, rendered from the clap
# definition. Only the docs build turns it on.
docs = []

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["json"] }

[profile.release]
strip = true
lto = true
