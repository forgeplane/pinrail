[package]
name = "pinrail"
version = "0.6.0"
edition = "2024"
rust-version = "1.98"
description = "The command that agents use to ask a person through the Pinrail app before they act"
license = "Apache-2.0"
# it embeds files from elsewhere in the repository, so it is built from here only
publish = false

# CI turns warnings into errors. Unsafe code is refused, except where a
# function allows it and says why.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[[bin]]
name = "pinrail"
path = "src/main.rs"

[features]
# `pinrail --markdown-help`: the docs' CLI reference, rendered from the clap
# definition. Only the docs build turns it on.
docs = []

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
# the plugin format, to check a plugin folder without the app
pinrail-format = { path = "../desktop/format" }
pinrail-runtime = { path = "../desktop/runtime" }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
ureq = { version = "3", default-features = false, features = ["json"] }

# to stop quietly, as other command-line tools do, when the reader of its
# output goes away
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# to keep the CLI's own output out of the server it starts, the console
# and the socket that pinrail attach waits on, the terminal's size and the
# browser on Windows
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Networking_WinSock",
  # the keyboard reader's event, which CreateEventW makes
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_IO",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# a pseudo console for the attach test, and the program it starts
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_System_Pipes"] }

# attachments are hashed with SHA-256, which is slow unoptimised
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
strip = true
lto = true
