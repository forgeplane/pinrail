[package]
name = "wicket"
version = "0.1.0"
edition = "2024"
description = "CLI for wicket, the approval-gate service for agent workflows"
license = "Apache-2.0"

[[bin]]
name = "wicket"
path = "src/main.rs"

[features]
# `wicket --markdown-help`: the docs' CLI reference, rendered from the clap
# definition. Only the docs build turns it on.
docs = []

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "3", features = ["json"] }

[profile.release]
strip = true
lto = true
