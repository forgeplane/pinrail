<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>review gate</title>
<link rel="stylesheet" href="/sdk/v1/pinrail-plugin.css">
<style>
/* Tokens, base, code.inl, .eyebrow, .meta and the scrollbars come from the
   SDK stylesheet. What is left is this view's own: a workbench needs more
   controls than a list does. */
html, body { height: 100%; }
:root { --ui: 13px; --code-size: 12.5px; }
#app { font-family: var(--sans); font-size: var(--ui); color: var(--text); background: var(--bg); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

button.ghost { all: unset; display: inline-flex; align-items: center; gap: 5px; cursor: pointer; font-size: 11.5px; color: var(--dim); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; white-space: nowrap; }
button.ghost:hover { color: var(--text); border-color: var(--border-strong); }
button.bare { all: unset; cursor: pointer; }
button.link { all: unset; display: inline-flex; align-items: center; gap: 5px; cursor: pointer; color: var(--accent); font-size: 12px; padding: 3px 7px; border-radius: 5px; }
button.link:hover { background: var(--bg-hover); }
button.primary { all: unset; cursor: pointer; font-weight: 600; font-size: 12.5px; color: oklch(0.99 0 0); background: var(--accent); border-radius: 6px; padding: 5px 16px; white-space: nowrap; }
button.primary:hover { filter: brightness(1.1); }
button.accept-btn { all: unset; flex: none; box-sizing: border-box; display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 9px 0 7px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 11.5px; color: var(--ok); background: color-mix(in oklab, var(--ok) 13%, transparent); }
button.accept-btn:hover { background: color-mix(in oklab, var(--ok) 22%, transparent); }
button.reject-btn { all: unset; flex: none; box-sizing: border-box; display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 9px 0 7px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 11.5px; color: var(--danger); background: color-mix(in oklab, var(--danger) 11%, transparent); }
button.reject-btn:hover { background: color-mix(in oklab, var(--danger) 20%, transparent); }
button.undo-btn { all: unset; cursor: pointer; color: var(--dim); font-size: 12px; padding: 2px 8px; border: 1px solid var(--border); border-radius: 5px; }
button.undo-btn:hover { border-color: var(--border-strong); color: var(--text); }
button.save-btn { all: unset; cursor: pointer; font-weight: 600; font-size: 12px; color: var(--accent); border: 1px solid color-mix(in oklab, var(--accent) 45%, transparent); padding: 6px 12px; border-radius: 6px; }
button.save-btn:hover { background: var(--accent-bg); }
button.dim-btn { all: unset; cursor: pointer; font-size: 12px; color: var(--dim); padding: 6px 8px; }
button.dim-btn:hover { color: var(--text); }
button.tiny { all: unset; cursor: pointer; font-size: 11.5px; color: var(--dim); flex: none; }
button.tiny:hover { color: var(--text); }
button.tiny.danger:hover { color: var(--danger); }
button.seg { all: unset; display: inline-flex; align-items: center; gap: 5px; cursor: pointer; font-size: 11.5px; padding: 4px 10px; color: var(--faint); }
button.seg.on { color: var(--text); background: var(--bg-hover); }
button.toggle { all: unset; display: inline-flex; align-items: center; gap: 5px; cursor: pointer; font-size: 11.5px; padding: 4px 8px; border: 1px solid var(--border); border-radius: 6px; color: var(--dim); white-space: nowrap; }
button.toggle:hover { color: var(--text); border-color: var(--border-strong); }
button.toggle.on { color: var(--accent); background: var(--accent-bg); border-color: color-mix(in oklab, var(--accent) 40%, transparent); }
/* the rail: files, and each file's findings under it with where they stand */
.rail { width: 284px; flex: none; display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--border); background: var(--bg-panel); }
.rail-head { flex: none; box-sizing: border-box; display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; border-bottom: 1px solid var(--border); }
.pane { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.diff-bar { flex: none; box-sizing: border-box; display: flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 20px 0 24px; border-bottom: 1px solid var(--border); background: var(--bg); }
.rail-head .eyebrow { white-space: nowrap; }
.rail-body { flex: 1; overflow-y: auto; padding: 8px 8px 24px; }
.grow { flex: 1; }
.tree-row { all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; gap: 7px; width: 100%; padding: 5px 8px; border-radius: 6px; }
.tree-row:hover { background: var(--bg-hover); }
.tree-dir { margin-top: 6px; font-size: 11.5px; color: var(--faint); }
.tree-dir { gap: 5px; }
.tree-dir .caret { flex: none; display: inline-flex; color: var(--faint); transition: transform 0.12s ease; }
.tree-dir .caret.open { transform: rotate(90deg); }
.tree-dir > .wi { flex: none; color: var(--faint); }
.tree-dir:hover, .tree-dir:hover .caret, .tree-dir:hover > .wi { color: var(--dim); }
.tree-loose { cursor: default; } .tree-loose:hover { background: none; }
.tree-loose > .wi { flex: none; margin-left: 15px; }
.tree-dir .path { font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tree-file { padding-left: 20px; }
.tree-file .name { min-width: 0; font: 12px var(--mono); color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tree-file.quiet .name { color: var(--faint); }
.tree-file.on .name { color: var(--accent); font-weight: 600; }
.tree-file .count { flex: none; padding: 0 6px; border-radius: 99px; font: 600 10.5px var(--mono); color: var(--dim); background: var(--bg-hover); }
.tree-file .count.done { color: var(--ok); background: color-mix(in oklab, var(--ok) 14%, transparent); }
.tree-file .churn { flex: none; font: 10.5px var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tree-file .plus { color: var(--ok); } .tree-file .minus { color: var(--danger); }
.tree-finding { all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; gap: 8px; width: 100%; padding: 3px 8px 3px 30px; border-radius: 6px; font-size: 12px; color: var(--dim); }
.tree-finding:hover { background: var(--bg-hover); color: var(--text); }
.tree-finding.focus { background: var(--accent-bg); color: var(--text); }
.tree-finding .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tree-finding .n { flex: none; font: 10.5px var(--mono); color: var(--faint); }
.tree-finding.mine-row > .wi { flex: none; color: var(--accent); }
.tree-finding.mine-row .t { color: var(--text); }
.tree-finding .has-note { flex: none; display: inline-flex; color: var(--accent); }
.tree-finding .dot { flex: none; width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--sev-nit); }
.tree-finding .dot.is-blocker { border-color: var(--sev-blocker); } .tree-finding .dot.is-major { border-color: var(--sev-major); } .tree-finding .dot.is-minor { border-color: var(--sev-minor); }
.tree-finding.accepted .dot { border-color: var(--ok); background: var(--ok); }
.tree-finding.rejected .dot { border-color: var(--danger); background: var(--danger); }
.tree-finding.accepted .t, .tree-finding.rejected .t { color: var(--faint); }
.tree-finding.rejected .t { text-decoration: line-through; }
textarea.ta { flex: 1; resize: vertical; background: var(--bg); border: 1px solid var(--border-strong); border-radius: 6px; padding: 7px 10px; font-size: 12.5px; outline: none; min-height: 20px; color: var(--text); }
textarea.ta:focus { border-color: var(--accent); }
/* diff rows: one class each, so three thousand rows cost bytes, not kilobytes */
.diff-row { display: grid; }
.diff-row.inline { grid-template-columns: 44px 44px 18px 1fr; }
.diff-row.split { grid-template-columns: 40px 1fr 40px 1fr; }
.diff-row.inline.add { background: var(--rv-add); }
.diff-row.inline.del { background: var(--rv-del); }
.diff-row .ln { text-align: right; padding: 0 8px 0 4px; color: color-mix(in oklab, var(--faint) 85%, transparent); user-select: none; position: relative; font-variant-numeric: tabular-nums; }
.diff-row.inline.add .ln, .diff-row.split .ln.add { color: color-mix(in oklab, var(--ok) 72%, transparent); }
.diff-row.inline.del .ln, .diff-row.split .ln.del { color: color-mix(in oklab, var(--danger) 72%, transparent); }
.diff-row .sign { text-align: center; user-select: none; }
.diff-row.add .sign { color: var(--ok); }
.diff-row.del .sign { color: var(--danger); }
.diff-row .code { white-space: pre-wrap; word-break: break-word; padding-right: 12px; color: var(--text); }
/* a wrapped line carries on two characters in, so it never reads as a new one */
.diff-row .code { tab-size: 4; }
.diff-row.inline .code { padding-left: calc((var(--i, 0) + 2) * 1ch); text-indent: calc((var(--i, 0) + 2) * -1ch); }
.diff-row.split .code { padding: 0 12px 0 calc(24px + (var(--i, 0) + 2) * 1ch); text-indent: calc((var(--i, 0) + 2) * -1ch); }
/* no sign column side by side: the + sits in the room before the code */
.diff-row.split .addbtn { transform: translateX(3px); }
.diff-row.split .addbtn:hover { transform: translateX(3px) scale(1.12); }
.diff-row.split .code.l { border-right: 1px solid var(--border); }
.diff-row.split .code.add, .diff-row.split .ln.add { background: var(--rv-add); }
.diff-row.split .code.del, .diff-row.split .ln.del { background: var(--rv-del); }
.hunk { padding: 2px 12px 2px 106px; font-size: 11px; color: var(--faint); background: color-mix(in oklab, var(--accent) 5%, var(--bg-panel)); }
.hunk:not(:first-child) { border-top: 1px solid var(--border); }
.hunk.split { padding-left: 52px; }
/* each file section is laid out and painted on its own, and skipped while
   off screen: a change in one file never costs the others, and scrolling
   twenty files costs what the two on screen do */
[data-filesec] { content-visibility: auto; contain: content; }
.diff-row .addbtn { opacity: 0; transition: opacity 0.08s; pointer-events: none; }
.diff-row:hover .addbtn, .addbtn:focus-visible { opacity: 1; pointer-events: auto; }
.addbtn { all: unset; box-sizing: border-box; position: absolute; left: 100%; top: 1.5px; transform: translateX(1px); z-index: 2; display: grid; place-items: center; width: 17px; height: 17px; border-radius: 5px; background: var(--accent); color: oklch(0.99 0 0); cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,0.25); }
.addbtn:hover { transform: translateX(1px) scale(1.12); }
/* your own comment on a line, and the box you write it in */
.mine { font: var(--ui) var(--sans); padding: 9px 16px 11px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); background: var(--bg-raised); box-shadow: inset 3px 0 0 var(--accent); }
.mine-head { display: flex; align-items: center; gap: 7px; min-height: 26px; color: var(--accent); }
.mine-label { font: 600 10px var(--mono); letter-spacing: 0.07em; }
.mine-at { font: 11px var(--mono); color: var(--dim); }
.mine-for, .mine-hint { font-size: 11px; color: var(--faint); }
.mine-text, button.mine-text { display: block; width: 100%; box-sizing: border-box; text-align: left; cursor: text; margin-top: 2px; line-height: 1.55; white-space: pre-wrap; color: var(--text); }
.mine.editing { background: color-mix(in oklab, var(--accent) 5%, var(--bg-raised)); }
.mine.editing textarea.note-ta { margin-top: 4px; font-size: 13px; }
button.icon-btn.ok { color: var(--accent); }
/* a finding: what the agent would post, and your call on it */
.card { font-size: var(--ui); background: var(--bg-raised); overflow: hidden; }
.card.boxed { border: 1px solid var(--border); border-radius: 10px; }
.card.flush { border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
/* the bar down a finding's left edge says where it stands; focus is a tint */
.card { --bar: var(--border-strong); box-shadow: inset 3px 0 0 var(--bar); }
.card.accepted { --bar: var(--ok); }
.card.rejected { --bar: var(--danger); }
/* the finding the keys act on: an accent ring round it, over its decision bar */
.card.focused { position: relative; z-index: 1; background: color-mix(in oklab, var(--accent) 8%, var(--bg-raised)); box-shadow: inset 3px 0 0 var(--bar), inset 0 0 0 2px var(--accent), 0 4px 18px -8px color-mix(in oklab, var(--accent) 45%, transparent); }
.card.boxed.focused { border-color: var(--accent); }
.card .grow { flex: 1; }
.card .id { flex: none; font: 11px var(--mono); color: var(--faint); }
.sev { flex: none; padding: 2px 8px; border-radius: 99px; font-size: 10px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--sev-nit); background: color-mix(in oklab, var(--sev-nit) 16%, transparent); }
.sev.is-blocker { color: var(--sev-blocker); background: color-mix(in oklab, var(--sev-blocker) 16%, transparent); }
.sev.is-major { color: var(--sev-major); background: color-mix(in oklab, var(--sev-major) 16%, transparent); }
.sev.is-minor { color: var(--sev-minor); background: color-mix(in oklab, var(--sev-minor) 16%, transparent); }
button.icon-btn { all: unset; flex: none; display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 6px; color: var(--dim); cursor: pointer; }
button.icon-btn:hover { color: var(--text); background: var(--bg-hover); }
button.icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button.file-fold { display: inline-flex; color: var(--faint); transition: transform 0.12s ease; }
button.file-fold.open { transform: rotate(90deg); }
button.file-fold:hover { color: var(--text); }
.card-head { display: flex; align-items: center; gap: 8px; min-height: 26px; padding: 10px 16px 0; }
.card.folded .card-head { padding-bottom: 10px; }
.card-name, button.card-toggle { display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; }
button.card-toggle { cursor: pointer; border-radius: 6px; margin: -3px -6px; padding: 3px 6px; }
button.card-toggle:hover { background: var(--bg-hover); }
button.card-toggle .caret { display: inline-flex; color: var(--faint); transition: transform 0.12s ease; }
button.card-toggle .caret.open { transform: rotate(90deg); }
.card.rejected .card-title { color: var(--dim); }
.card.rejected.folded .card-title { text-decoration: line-through; }
.card-title { min-width: 0; font-weight: 600; font-size: 13.5px; color: var(--text); }
.card .tag { flex: none; padding: 1px 8px; border-radius: 99px; font-size: 10px; font-weight: 600; letter-spacing: 0.05em; color: var(--accent); border: 1px solid color-mix(in oklab, var(--accent) 40%, transparent); }
.card .resolves { flex: none; font-size: 11px; color: var(--ok); }
.verdict { flex: none; padding: 2px 9px; border-radius: 99px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.05em; white-space: nowrap; }
.verdict.accept { color: var(--ok); background: color-mix(in oklab, var(--ok) 14%, transparent); }
.verdict.reject { color: var(--danger); background: color-mix(in oklab, var(--danger) 13%, transparent); }
.verdict.none { color: var(--sev-major); background: color-mix(in oklab, var(--sev-major) 14%, transparent); }
.card-body { display: flex; flex-direction: column; gap: 9px; margin: 8px 16px 14px; line-height: 1.6; color: var(--text); }
.card.rejected .card-body { color: var(--dim); }
.card-body p { margin: 0; }
.code-block { margin: 0; padding: 9px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); font: var(--code-size)/1.55 var(--mono); white-space: pre-wrap; overflow-x: auto; color: var(--text); }
.sugg { border: 1px solid var(--border-strong); border-radius: 7px; overflow: hidden; }
.sugg-head { display: flex; align-items: center; gap: 8px; padding: 5px 12px; border-bottom: 1px solid var(--border); background: var(--bg); font-size: 10.5px; font-weight: 600; letter-spacing: 0.05em; color: var(--dim); }
.sugg-row { display: grid; grid-template-columns: 40px 18px 1fr; font: var(--code-size)/1.6 var(--mono); }
.sugg-row.add { background: var(--add-bg); } .sugg-row.del { background: var(--del-bg); }
.sugg-row .ln { text-align: right; padding: 0 8px 0 4px; color: var(--faint); user-select: none; font-variant-numeric: tabular-nums; }
.sugg-row.add .ln { background: var(--add-gut); } .sugg-row.del .ln { background: var(--del-gut); }
.sugg-row .sign { text-align: center; user-select: none; }
.sugg-row.add .sign { color: var(--ok); } .sugg-row.del .sign { color: var(--danger); }
.sugg-row .code { white-space: pre-wrap; word-break: break-word; padding-right: 12px; color: var(--text); }
.note { display: flex; align-items: flex-start; gap: 6px; margin: 0 16px 12px; padding: 7px 10px; border-radius: 7px; background: var(--bg); border: 1px solid var(--border); }
.note.accept { background: var(--accent-bg); border-color: color-mix(in oklab, var(--accent) 25%, transparent); }
.note.reject { background: color-mix(in oklab, var(--danger) 7%, var(--bg)); border-color: color-mix(in oklab, var(--danger) 22%, transparent); }
.note-text, button.note-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; line-height: 1.55; color: var(--text); text-align: left; cursor: text; }
.note-text .line { display: block; }
.note-label { font: 600 9.5px var(--mono); letter-spacing: 0.08em; color: var(--faint); }
.note.accept .note-label { color: var(--accent); } .note.reject .note-label { color: var(--danger); }
button.note.editing { border-color: color-mix(in oklab, var(--accent) 55%, transparent); box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 12%, transparent); }
.note-label { display: flex; align-items: baseline; gap: 10px; }
.note-hint { margin-left: auto; font: 11px var(--sans); letter-spacing: 0; color: var(--faint); text-transform: none; }
textarea.note-ta { all: unset; display: block; width: 100%; box-sizing: border-box; min-height: 21px; resize: none; overflow: hidden; font-size: 12.5px; line-height: 1.55; color: var(--text); white-space: pre-wrap; }
textarea.note-ta::placeholder { color: var(--faint); }
.note-del { flex: none; color: var(--faint); padding: 2px; border-radius: 4px; }
button.note-del:hover { color: var(--danger); }
.thread { margin: 10px 16px 0; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); overflow: hidden; }
button.thread-head { display: flex; align-items: center; gap: 8px; width: 100%; box-sizing: border-box; padding: 7px 11px; font-size: 11.5px; color: var(--faint); }
button.thread-head .caret { display: inline-flex; transition: transform 0.12s; }  button.thread-head .caret.open { transform: rotate(90deg); }
.thread-label { font-size: 10px; font-weight: 700; letter-spacing: 0.06em; }
.thread-body { max-height: 340px; overflow-y: auto; }
.thread-msg { padding: 8px 12px; border-top: 1px solid var(--border); }
.thread-who { margin-bottom: 3px; font-size: 10.5px; font-weight: 600; color: var(--accent); }
.thread-msg.ours .thread-who { color: var(--faint); }
.thread-text { font-size: 12px; line-height: 1.55; color: var(--dim); }
.previous { margin: 8px 16px 0; font-size: 11.5px; color: var(--faint); }
.previous-label { font-size: 10px; font-weight: 700; letter-spacing: 0.05em; }
.previous-verdict { font-weight: 600; } .previous-verdict.accept { color: var(--ok); } .previous-verdict.reject { color: var(--danger); }
/* a file: its header stays in view while its diff scrolls under it */
section.file { margin-bottom: 18px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg-raised); }
.file-head { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 9px; min-height: 40px; padding: 0 14px 0 10px; border-bottom: 1px solid var(--border); border-radius: 10px 10px 0 0; background: var(--bg-panel); }
.file-head.folded { border-bottom: 0; border-radius: 10px; }
.file-path { min-width: 0; font: 12.5px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.file-path .dir { color: var(--faint); } .file-path .base { color: var(--text); font-weight: 600; }
.file-badge { flex: none; padding: 1px 7px; border-radius: 99px; font-size: 9.5px; font-weight: 700; letter-spacing: 0.06em; color: var(--dim); background: var(--bg-hover); }
.file-badge.is-added { color: var(--ok); background: color-mix(in oklab, var(--ok) 13%, transparent); }
.file-badge.is-deleted { color: var(--danger); background: color-mix(in oklab, var(--danger) 12%, transparent); }
.file-churn { flex: none; font: 11px var(--mono); font-variant-numeric: tabular-nums; }
.file-churn .plus { color: var(--ok); } .file-churn .minus { color: var(--danger); }
.file-count { flex: none; padding: 1px 8px; border-radius: 99px; font: 600 10.5px var(--mono); color: var(--dim); background: var(--bg-hover); }
.file-count.done { color: var(--ok); background: color-mix(in oklab, var(--ok) 14%, transparent); }
.file-summary { padding: 7px 14px 7px 38px; border-bottom: 1px solid var(--border); font-size: 12px; line-height: 1.5; color: var(--dim); }
.file-diff { overflow: hidden; border-radius: 0 0 10px 10px; font: var(--code-size)/1.6 var(--mono); }
.file-unanchored { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px 14px; border-top: 1px dashed var(--border-strong); }
.file-unanchored-head { font-size: 11px; color: var(--faint); }
/* unwrapped: long lines keep to one row and the file scrolls sideways; the
   numbers stay put, and what sits between the rows stays in view */
.in-diff { font-family: var(--sans); }
.file-diff.nowrap { overflow-x: auto; container-type: inline-size; }
.file-diff.nowrap > div { width: max-content; min-width: 100%; }
.file-diff.nowrap .diff-row.inline { width: max-content; min-width: 100%; }
.file-diff.nowrap .diff-row .code { white-space: pre; padding-left: 0; text-indent: 0; }
.file-diff.nowrap .diff-row.inline .ln, .file-diff.nowrap .diff-row.inline .sign { position: sticky; z-index: 2; background: var(--bg-raised); }

button.tool.on { color: var(--accent); }
button.tool:disabled { opacity: 0.45; cursor: default; }
/* calmer diff colours: the tint on the row, the colour in the sign and the number */
.file-diff { --rv-add: color-mix(in oklab, var(--add-bg) 75%, transparent); --rv-del: color-mix(in oklab, var(--del-bg) 75%, transparent); }
/* the header: the change and how far along its review is */
.head { position: relative; display: flex; align-items: center; gap: 8px 18px; padding: 11px 18px; border-bottom: 1px solid var(--border); background: var(--bg-panel); flex: none; }

.tally { flex: none; display: flex; gap: 14px; font-size: 12px; color: var(--dim); white-space: nowrap; }
.tally b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.tally .t-ok b { color: var(--ok); } .tally .t-no b { color: var(--danger); }
.seg-group { display: flex; margin-right: 4px; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
.seg-group .seg + .seg { border-left: 1px solid var(--border); }
button.tool { all: unset; display: inline-flex; align-items: center; gap: 5px; cursor: pointer; padding: 5px 8px; border-radius: 6px; font-size: 11.5px; color: var(--dim); white-space: nowrap; }
button.tool:hover { background: var(--bg-hover); color: var(--text); }
button.tool.armed.accept { color: var(--ok); background: color-mix(in oklab, var(--ok) 12%, transparent); }
button.tool.armed.reject { color: var(--danger); background: color-mix(in oklab, var(--danger) 12%, transparent); }
.head-progress { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; }
.head-progress span { display: block; height: 100%; background: var(--accent); transition: width 160ms ease-out; }
/* the brief: what the agent says the change is, and its concerns on a click */
.brief { max-width: 980px; margin-bottom: 18px; border: 1px solid color-mix(in oklab, var(--accent) 22%, transparent); border-radius: 10px; background: var(--accent-bg); overflow: hidden; }
.brief-line { display: flex; align-items: flex-start; gap: 10px; padding: 11px 14px; }
.brief-line > svg { flex: none; margin-top: 3px; color: var(--accent); }

.brief-concerns { box-shadow: inset 3px 0 0 var(--sev-major); }

.brief-details .eyebrow { margin-bottom: 4px; }
.md.dim { font-size: 12px; color: var(--dim); }
.errors { margin: 0 22px 12px 22px; padding: 9px 12px; border: 1px solid color-mix(in oklab, var(--danger) 45%, transparent); border-radius: 8px; background: color-mix(in oklab, var(--danger) 8%, transparent); font-family: var(--mono); font-size: 12px; color: var(--danger); white-space: pre-wrap; }
</style>
</head>
<body>
<div id="app"></div>
<script src="/sdk/v1/pinrail-plugin.js"></script>
<script>
"use strict";
/* The review gate: a change's diff with the agent's proposed comments
   anchored on lines, the reviewer's verdicts and their own comments. A port
   of a hand-written review page onto the pinrail plugin protocol; nothing
   forge-specific remains. */

/* ---------- bridge ---------- */
let GATE = null, PREVIOUS = null, RO_FLAG = false;
const RO = () => RO_FLAG;

const plugin = Pinrail.connect({
  resize: "fill",
  onInit(init) {
    GATE = init.gate; PREVIOUS = init.previous; RO_FLAG = init.readonly;
    applySettings(init.settings);
    boot(init.draft);
  },
  onSettings(settings) {
    // changed in the app's Settings, or the answer to a pill here
    set(() => applySettings(settings));
  },
  onViolations(errors) {
    // violations answer a hand-over; one that comes without (a setting the
    // app would not keep) is not the decision's, and opens nothing
    if (!handingOver) return;
    handingOver = false;
    set(() => { S.errors = errors; S.confirmSubmitArm = false; S.showSubmit = true; });
  },
  onSubmitted(decision) {
    RO_FLAG = true;
    loadDecision(decision && decision.data);
    set(() => { S.done = true; S.showSubmit = false; S.composer = null; S.noteOpen = {}; S.errors = null; });
  },
  onCollect() { collect(); },
});

function draft() {
  if (RO() || !D) return;
  plugin.draft({
    decisions: S.decisions, manualComments: S.manualComments, mseq,
  });
}

/* ---------- state ---------- */
let D = null;          // adapted payload
let PARSED = [];       // per-file parsed rows/splitRows/add/del
let SEGMENTS = {};     // proposal id -> md segments
const S = {
  decisions: {}, focusedId: null, diffMode: "inline", wrap: true,
  folded: {}, treeOpen: true, findingsOnly: false, briefOpen: false, concernsOpen: false,
  composer: null, manualComments: [],
  confirmBulk: null, showSubmit: false, done: false, errors: null,
  collapsedDirs: {}, activeFile: null, noteOpen: {}, expanded: {},
  confirmSubmitArm: false, orderMode: "semantic",
};
let mseq = 0, bulkT = null, handingOver = false;
const esc = Pinrail.escape;

function adapt(payload) {
  const files = (payload.files || []).map((f) => ({
    path: f.path, oldPath: f.old_path || null, status: f.status || "modified",
    summary: f.summary || "", rank: f.rank ?? null,
    diff: (f.diff || "").replace(/\n$/, "").split("\n").filter((l, i, a) => !(i === a.length - 1 && l === "")),
  }));
  const proposals = (payload.proposals || []).map((p) => ({
    id: p.id, kind: p.kind || "comment", severity: p.severity || "minor", title: p.title || "", body: p.body || "",
    file: p.file || null, line: p.line ?? null, side: p.side || "new", resolves: !!p.resolves, thread: p.thread || null,
  }));
  return { change: payload.change || {}, overview: payload.overview || {}, files, proposals };
}

function loadDecision(data) {
  S.decisions = {}; S.manualComments = [];
  if (!data) return;
  for (const d of data.decisions || []) S.decisions[d.id] = { action: d.action, note: d.note || undefined };
  S.manualComments = (data.comments || []).map((c, i) => ({ id: "m" + (i + 1), file: c.file, line: c.line, side: c.side || "new", body: c.body }));
}

const previousVerdict = (id) => Pinrail.previousVerdict(PREVIOUS, id);

/* ---------- markdown-lite ---------- */
function inlineHtml(text) {
  return text.split(/(`[^`]+`|\*\*[^*]+\*\*)/g).filter(Boolean).map((p) => {
    if (p.startsWith("`")) return `<code class="inl">${esc(p.slice(1, -1))}</code>`;
    if (p.startsWith("**")) return `<b>${esc(p.slice(2, -2))}</b>`;
    return esc(p);
  }).join("");
}
function mdSegments(body) {
  const segs = []; const re = /```([^\n`]*)\n([\s\S]*?)```/g; let last = 0, m;
  const pushText = (t) => t.split(/\n\n+/).map((s) => s.trim()).filter(Boolean).forEach((p) => segs.push({ kind: "para", html: inlineHtml(p) }));
  while ((m = re.exec(body))) {
    if (m.index > last) pushText(body.slice(last, m.index));
    const info = m[1].trim();
    const text = m[2].replace(/\n$/, "");
    if (info.startsWith("suggestion")) {
      // range modifier: ```suggestion:-A+B replaces lines anchor-A .. anchor+B
      const mod = info.match(/^suggestion(?::?-(\d+))?(?:\+(\d+))?/);
      segs.push({ kind: "suggestion", text, above: mod && mod[1] ? parseInt(mod[1], 10) : 0, below: mod && mod[2] ? parseInt(mod[2], 10) : 0 });
    } else {
      segs.push({ kind: "code", text });
    }
    last = re.lastIndex;
  }
  if (last < body.length) pushText(body.slice(last));
  return segs;
}
function mdBlockHtml(body) {
  return mdSegments(body || "").map((seg) => {
    if (seg.kind === "para") return `<p style="margin:0 0 6px 0">${seg.html}</p>`;
    return `<pre style="margin:0 0 6px 0;background:var(--bg-panel);border:1px solid var(--border);border-radius:5px;padding:6px 9px;font-family:var(--mono);font-size:11.5px;line-height:1.5;overflow-x:auto;white-space:pre-wrap">${esc(seg.text)}</pre>`;
  }).join("");
}

/* ---------- diff parsing ---------- */
function parseDiff(lines) {
  const rows = []; let o = 0, n = 0;
  for (const line of lines) {
    if (line.startsWith("@@")) {
      const m = line.match(/-(\d+)(?:,\d+)? \+(\d+)/);
      if (m) { o = parseInt(m[1], 10); n = parseInt(m[2], 10); }
      rows.push({ kind: "hunk", text: line });
    } else if (line.startsWith("\\ No newline")) {
      continue;
    } else {
      const p = line[0], text = line.slice(1);
      if (p === "+") rows.push({ kind: "add", new: n++, text });
      else if (p === "-") rows.push({ kind: "del", old: o++, text });
      else rows.push({ kind: "ctx", old: o++, new: n++, text });
    }
  }
  return rows;
}
function buildSplit(rows) {
  const out = []; let i = 0;
  while (i < rows.length) {
    const r = rows[i];
    if (r.kind === "hunk") { out.push({ kind: "hunk", text: r.text }); i++; continue; }
    if (r.kind === "ctx") { out.push({ kind: "line", l: r, r: r }); i++; continue; }
    const dels = [], adds = [];
    while (i < rows.length && rows[i].kind === "del") dels.push(rows[i++]);
    while (i < rows.length && rows[i].kind === "add") adds.push(rows[i++]);
    const len = Math.max(dels.length, adds.length);
    for (let k = 0; k < len; k++) out.push({ kind: "line", l: dels[k] || null, r: adds[k] || null });
  }
  return out;
}

/* ---------- ordering ---------- */
const anchorsRow = (p, r) => r.kind !== "hunk" && (p.side === "old" ? r.old === p.line : r.new === p.line);
function unplaceable(p) {
  if (!p.file) return true;
  return !D.files.some((f) => f.path === p.file);
}
function orderedFiles() {
  const idx = D.files.map((f, i) => i);
  if (S.orderMode === "path") return idx.sort((a, b) => D.files[a].path.localeCompare(D.files[b].path));
  return idx.sort((a, b) => (D.files[a].rank ?? a) - (D.files[b].rank ?? b));
}
function orderedIds() {
  if (!D) return [];
  const ids = [];
  orderedFiles().forEach((i) => {
    const f = D.files[i];
    D.proposals.filter((p) => p.file === f.path).sort((a, b) => (a.line || 1e9) - (b.line || 1e9)).forEach((p) => ids.push(p.id));
  });
  D.proposals.filter(unplaceable).forEach((p) => ids.push(p.id));
  return ids;
}
const decided = (id) => { const d = S.decisions[id]; return !!(d && d.action); };

/* ---------- data prep ---------- */
function prep() {
  PARSED = D.files.map((f) => {
    const rows = parseDiff(f.diff);
    return { rows, splitRows: buildSplit(rows), add: rows.filter((r) => r.kind === "add").length, del: rows.filter((r) => r.kind === "del").length };
  });
  SEGMENTS = {};
  D.proposals.forEach((p) => {
    const segs = mdSegments(p.body);
    segs.forEach((seg) => {
      if (seg.kind === "suggestion" && p.file && p.line != null) {
        const fi = D.files.findIndex((f) => f.path === p.file);
        if (fi !== -1) {
          const start = p.line - (seg.above || 0), end = p.line + (seg.below || 0);
          const old = [];
          for (let ln = start; ln <= end; ln++) {
            const row = PARSED[fi].rows.find((r) => r.kind !== "hunk" && r.new === ln);
            if (row) old.push({ line: ln, text: row.text });
          }
          if (old.length) { seg.oldLines = old; seg.line = start; }
        }
      }
    });
    SEGMENTS[p.id] = segs;
  });
}

/* ---------- state mutation ---------- */
function captureDrafts() {
  const c = document.getElementById("composer-ta");
  if (c && S.composer) S.composer.text = c.value;
  document.querySelectorAll("[data-note-ta]").forEach((el) => {
    S.noteOpen[el.getAttribute("data-note-ta")] = { open: true, draft: el.value };
  });
}
function set(mut) { captureDrafts(); mut(); render(); draft(); }

/* The plugin's settings, as the manifest declares them: how the diff is
   laid out, how files are ordered, whether only files with findings show,
   and whether the tree starts open. The toolbar pills and the V and O keys
   change the same settings through the shell, so a choice here is the
   choice in Settings, for every review from now on. */
function applySettings(settings) {
  const s = settings || {};
  if (s.diff === "inline" || s.diff === "split") S.diffMode = s.diff;
  if (typeof s.wrap === "boolean") S.wrap = s.wrap;
  if (s.order === "semantic" || s.order === "path") S.orderMode = s.order;
  if (typeof s.findings_only === "boolean") S.findingsOnly = s.findings_only;
  if (typeof s.tree_open === "boolean") S.treeOpen = s.tree_open;
  if (D && !D.files.some((f) => f.rank != null)) S.orderMode = "path";
}
function keep(key, value) { plugin.setSetting(key, value); }

function decide(id, action, advance) {
  set(() => {
    S.decisions[id] = { ...(S.decisions[id] || {}), action };
    delete S.expanded[id];
    if (action === "reject" && !(S.decisions[id].note)) { S.noteOpen[id] = { open: true, draft: "" }; S.focusNote = id; }
    else delete S.noteOpen[id];
  });
  if (advance) advanceFocus(id);
}
function undo(id) { set(() => { delete S.decisions[id]; delete S.noteOpen[id]; delete S.expanded[id]; S.focusedId = id; }); }
function setNote(id, note) {
  set(() => {
    const cur = S.decisions[id] || {};
    S.decisions[id] = { ...cur, note: note || undefined };
    delete S.noteOpen[id];
    // a note just written stays in view
    if (note) S.expanded[id] = true;
  });
  // stay on the finding: a note is not a verdict, and the next one can wait
}
function unfoldFor(id) {
  const p = D.proposals.find((x) => x.id === id);
  if (p && p.file && S.folded[p.file]) delete S.folded[p.file];
}
function advanceFocus(fromId) {
  const ids = orderedIds();
  const undecidedIds = ids.filter((id) => !decided(id));
  if (!undecidedIds.length) { set(() => { S.focusedId = null; }); return; }
  const start = ids.indexOf(fromId);
  let next = undecidedIds.find((id) => ids.indexOf(id) > start);
  if (next == null) next = undecidedIds[0];
  set(() => { S.focusedId = next; unfoldFor(next); });
  scrollToCard(next);
}
function moveFocus(dir) {
  const pool = orderedIds();
  if (!pool.length) return;
  const cur = pool.indexOf(S.focusedId);
  const next = cur === -1 ? (dir > 0 ? pool[0] : pool[pool.length - 1]) : pool[(cur + dir + pool.length) % pool.length];
  set(() => { S.focusedId = next; unfoldFor(next); });
  scrollToCard(next);
}
/* Sections off screen are skipped until scrolled to, so their place is an
   estimate: scroll, let the browser lay the target out, then correct. */
/* A finding opened or folded stays where it was on screen: its header is
   measured before and after, and the scroll takes up any difference,
   whatever else the redraw moved. */
let pinning = 0;
function inPlace(id, change) {
  if (id == null) { change(); return; }
  const main = document.getElementById("main");
  const head = () => document.querySelector(`#card-${CSS.escape(String(id))} .card-head`);
  const before = head() && main ? head().getBoundingClientRect().top : null;
  const mine = ++pinning;   // a later action's pin replaces this one
  change();
  if (before == null) return;
  let left = null;          // where the last pin left the scroll
  const settle = () => {
    const m = document.getElementById("main"), h = head();
    if (mine !== pinning || !m || !h) return;
    if (left != null && Math.abs(m.scrollTop - left) > 1) return;   // scrolled since, by the person
    m.scrollTop += h.getBoundingClientRect().top - before;
    left = m.scrollTop;
  };
  settle();
  requestAnimationFrame(settle);
  // once more after the key or click has fully played out in the browser
  setTimeout(settle, 120);
}
function scrollTo(el, offset) {
  const c = document.getElementById("main");
  if (!el || !c) return;
  const place = () => { const er = el.getBoundingClientRect(), cr = c.getBoundingClientRect(); c.scrollTop += er.top - cr.top - offset(cr); };
  place();
  requestAnimationFrame(place);
}
function scrollToCard(id) {
  scrollTo(document.getElementById("card-" + id), (cr) => cr.height / 3.2);
}
function jumpToFile(path) {
  scrollTo(document.querySelector(`[data-filesec="${CSS.escape(path)}"]`), () => 6);
  S.activeFile = path;
  highlightTree(path);
}

/* ---------- decision ---------- */
function buildDecision() {
  const ids = orderedIds();
  const data = {
    decisions: ids.filter(decided).map((id) => {
      const dec = S.decisions[id];
      const o = { id, action: dec.action };
      if (dec.note) o.note = dec.note;
      return o;
    }),
    comments: S.manualComments.map((m) => ({ file: m.file, line: m.line, side: m.side, body: m.body })),
    undecided: ids.filter((id) => !decided(id)),
  };
  return data;
}

/* ---------- render: proposal card ---------- */
function sevChip(sev) {
  return `<span class="sev is-${esc(sev)}">${esc(sev)}</span>`;
}
function noteSegsHtml(note) {
  return note.split(/\n+/).map((s) => s.trim()).filter(Boolean).map((l) => `<span class="line">${inlineHtml(l)}</span>`).join("");
}
function noteBlockHtml(p, dec) {
  const note = dec && dec.note;
  if (!note) return "";
  const kind = dec.action === "accept" ? "accept" : dec.action === "reject" ? "reject" : "";
  const label = dec.action === "accept" ? "NOTE TO THE AGENT" : dec.action === "reject" ? "REJECTION REASON" : "NOTE — SAVED WITH YOUR DECISION";
  const text = `<span class="note-label">${label}</span>${noteSegsHtml(note)}`;
  return `<div class="note ${kind}">${RO() ? `<span class="note-text">${text}</span>`
    : `<button class="bare note-text" data-act="open-note" data-id="${p.id}" title="Click to edit">${text}</button>
    <button class="bare note-del" data-act="del-note" data-id="${p.id}" title="Delete note">${Pinrail.icon("x", { size: 13 })}</button>`}</div>`;
}
function noteEditorHtml(p, dec) {
  const st = S.noteOpen[p.id];
  if (!st || !st.open || RO()) return "";
  // the note itself, made editable where it sits
  const action = dec && dec.action;
  const kind = action === "accept" ? "accept" : action === "reject" ? "reject" : "";
  const label = action === "accept" ? "NOTE TO THE AGENT" : action === "reject" ? "REJECTION REASON" : "NOTE — SAVED WITH YOUR DECISION";
  const ph = action === "accept" ? "What should the agent change before posting? e.g. shorten this, drop the second paragraph"
    : action === "reject" ? "Why reject? It becomes a lesson future reviews follow, e.g. out of scope for this change"
    : "A note to the agent, saved with whichever decision you make";
  return `<div class="note editing ${kind}">
    <span class="note-text">
      <span class="note-label">${label}<span class="note-hint">Enter to save · Esc to cancel</span></span>
      <textarea class="note-ta" data-note-ta="${p.id}" rows="1" placeholder="${esc(ph)}" aria-label="note for proposal ${p.id}">${esc(st.draft || "")}</textarea>
    </span>
    <button class="icon-btn" data-act="save-note" data-id="${p.id}" title="Save">${Pinrail.icon("check", { size: 15, label: "Save" })}</button>
  </div>`;
}
function threadBlockHtml(p) {
  const tc = p.thread;
  if (!tc || !tc.comments || !tc.comments.length) return "";
  const key = "t" + p.id;
  const theirs = tc.comments.filter((n) => !n.ours);
  // threads with the developer's responses start open — that is what the decision hinges on
  const open = key in S.expanded ? !!S.expanded[key] : theirs.length > 0;
  const header = `<button class="bare thread-head" data-act="toggle-thread" data-id="${p.id}" data-open="${open ? 1 : 0}">
    <span class="caret${open ? " open" : ""}">${Pinrail.icon("chevron-right", { size: 12 })}</span>
    <span class="thread-label">THREAD${tc.round != null ? ` · ROUND ${esc(tc.round)}` : ""}</span>
    <span>${tc.comments.length} comment${tc.comments.length === 1 ? "" : "s"}${theirs.length ? ` (${theirs.length} from the developer)` : ""}</span>
  </button>`;
  const body = open ? `<div class="thread-body">${tc.comments.map((n) => `<div class="thread-msg${n.ours ? " ours" : ""}">
      <div class="thread-who">@${esc(n.author || "?")} · ${n.ours ? "us" : "developer"}</div>

/* A proposal. Anchored on a diff row it is `flush`: full width, flush with

  const dec = S.decisions[p.id] || null;

/* ---------- render: reviewer's comments / composer ---------- */

/* ---------- render: file sections ---------- */
function rowAttachments(f, newLn, oldLn, pad) {
  const at = (x) => x.file === f.path && ((x.side !== "old" && newLn != null && x.line === newLn) || (x.side === "old" && oldLn != null && x.line === oldLn));
  const anchoredCards = D.proposals.filter(at);
  const manual = S.manualComments.filter(at);
  const comp = S.composer && !RO() && at(S.composer);
  let html = "";
  anchoredCards.forEach((p) => { html += `<div class="in-diff">${cardHtml(p, true)}</div>`; });
  // a comment being edited is written where it stands, not in a box of its own
  const editing = comp && S.composer.editId != null;
  manual.forEach((m) => { html += editing && S.composer.editId === m.id ? composerHtml() : manualHtml(m); });
  if (comp && !editing) html += composerHtml();
  return html;
}
/* One "+" for the whole diff: it moves to the line-number cell of the row
   under the pointer, so three thousand rows carry a number each and not a
   button each. Rows say which lines they are; the section says which file. */
function ensureAddBtn() {
  let btn = document.getElementById("addbtn");
  if (!btn) {
    btn = document.createElement("button");
    btn.id = "addbtn"; btn.className = "addbtn"; btn.innerHTML = Pinrail.icon("plus", { size: 12 });
    btn.setAttribute("data-act", "open-composer");
  }
  return btn;
}
document.addEventListener("mouseover", (e) => {
  if (RO() || !D) return;
  const row = e.target.closest && e.target.closest(".diff-row");
  if (!row) return;
  const sec = row.closest("[data-filesec]");
  if (!sec) return;
  const newLn = row.getAttribute("data-n"), oldLn = row.getAttribute("data-o");
  const side = newLn ? "new" : oldLn ? "old" : null;
  if (!side) return;
  const cells = row.querySelectorAll(".ln");
  const cell = side === "new" ? cells[cells.length - 1] : cells[0];
  const btn = ensureAddBtn();
  btn.setAttribute("data-file", sec.getAttribute("data-filesec"));
  btn.setAttribute("data-line", side === "new" ? newLn : oldLn);
  btn.setAttribute("data-side", side);
  // inline, an old line's + skips the new number, so it sits where every other one does
  btn.classList.toggle("past-new", side === "old" && row.classList.contains("inline"));
  const label = `comment on ${sec.getAttribute("data-filesec")}:${side === "new" ? newLn : oldLn}${side === "old" ? " old" : ""}`;
  btn.setAttribute("aria-label", label); btn.title = side === "new" ? "Add your comment on this line" : "Comment on the old line";
  if (btn.parentNode !== cell) cell.appendChild(btn);
});
/* The rows of a file come in hunks, and each hunk is a region of its own
   (see render): a verdict or a composer on one line re-renders its hunk,
   not the file. */
let HUNKS = new Map(); // hunk region key -> html, filled while rendering
function hunked(f, rows, rowHtml) {
  let n = 0, chunk = [], out = "";
  const flush = () => {
    if (!chunk.length) return;
    const key = `hunk:${f.path}:${n++}`;
    const html = `<div data-region="${esc(key)}">${chunk.join("")}</div>`;
    HUNKS.set(key, html);
    out += `<!--region:${esc(key)}-->`;
    chunk = [];

  for (const r of rows) {

/* A line long enough to wrap carries on two characters past its own

};
function inlineRowsHtml(f, fi) {
  const P = PARSED[fi];
  return hunked(f, P.rows, (r) => {
    if (r.kind === "hunk") return `<div class="hunk">${esc(r.text)}</div>`;
    const isAdd = r.kind === "add", isDel = r.kind === "del";
    return `<div class="diff-row inline${isAdd ? " add" : isDel ? " del" : ""}"${r.new != null ? ` data-n="${r.new}"` : ""}${r.old != null ? ` data-o="${r.old}"` : ""}><span class="ln">${r.old ?? ""}</span><span class="ln">${r.new ?? ""}</span><span class="sign">${isAdd ? "+" : isDel ? "−" : ""}</span><span class="code"${hang(r.text)}>${esc(r.text)}</span></div>` +

  });
}

  const P = PARSED[fi];

}
function fileSectionHtml(f, fi) {
  const P = PARSED[fi];
  const fProps = D.proposals.filter((p) => p.file === f.path);
  const unanchored = fProps.filter((p) => p.line == null || !P.rows.some((r) => anchorsRow(p, r)));
  const folded = !!S.folded[f.path];
  const total = fProps.length, fDecided = fProps.filter((p) => decided(p.id)).length;
  const badge = f.status === "added" ? "NEW" : f.status === "renamed" ? "RENAMED" : f.status === "deleted" ? "DELETED" : null;

      <button class="bare file-fold${folded ? "" : " open"}" data-act="fold-file" data-file="${esc(f.path)}" aria-label="fold ${esc(f.path)}" aria-expanded="${folded ? "false" : "true"}">${Pinrail.icon("chevron-right", { size: 13 })}</button>
      <span class="file-path"><span class="dir">${esc(dir)}</span><span class="base">${esc(base)}</span></span>
      ${badge ? `<span class="file-badge is-${f.status}">${badge}</span>` : ""}

      <span class="grow"></span>

/* ---------- render: tree ---------- */
function treeHtml() {
  const order = orderedFiles();
  const ids = orderedIds();
  const dirs = [];
  order.forEach((i) => {
    const f = D.files[i];
    const dir = f.path.includes("/") ? f.path.slice(0, f.path.lastIndexOf("/")) : "";
    let g = dirs.find((x) => x.dir === dir);
    if (!g) { g = { dir, files: [] }; dirs.push(g); }
    g.files.push(i);
  });
  // each finding under its file, in reading order, with where it stands
  const findingRow = (p) => {
    const action = S.decisions[p.id] && S.decisions[p.id].action;
    const state = action === "accept" ? "accepted" : action === "reject" ? "rejected" : "open";
    return `<button class="tree-finding ${state}${S.focusedId === p.id ? " focus" : ""}" data-act="jump-card" data-id="${esc(String(p.id))}" title="${esc(p.title)}">
      <span class="dot is-${esc(p.severity || "nit")}"></span><span class="t">${esc(p.title.replace(/`/g, ""))}</span>${S.decisions[p.id] && S.decisions[p.id].note ? `<span class="has-note" title="Has a note">${Pinrail.icon("message-square-text", { size: 12 })}</span>` : ""}<span class="n">#${esc(String(p.id))}</span></button>`;
  };
  const mineRow = (m) => `<button class="tree-finding mine-row" data-act="jump-comment" data-mid="${m.id}" title="Your comment on line ${m.line}: ${esc(m.body)}">
      ${Pinrail.icon("message-square", { size: 12 })}<span class="t">${esc(m.body)}</span><span class="n">L${m.line}</span></button>`;
  let rows = "";
  // with the findings filter on, a file is shown only with something to decide or
  // a comment of yours; a folder only with a file shown
  const shown = (i) => !S.findingsOnly || D.proposals.some((p) => p.file === D.files[i].path) || S.manualComments.some((m) => m.file === D.files[i].path);
  dirs.forEach((g) => {
    if (!g.files.some(shown)) return;
    const collapsed = !!S.collapsedDirs[g.dir];
    if (g.dir) rows += `<button class="tree-row tree-dir" data-act="toggle-dir" data-dir="${esc(g.dir)}">
      <span class="caret${collapsed ? "" : " open"}">${Pinrail.icon("chevron-right", { size: 12 })}</span>${Pinrail.icon(collapsed ? "folder" : "folder-open", { size: 13 })}<span class="path">${esc(g.dir)}/</span></button>`;
    if (collapsed) return;
    g.files.forEach((i) => {
      const f = D.files[i], P = PARSED[i];
      const fProps = D.proposals.filter((p) => p.file === f.path).sort((a, b) => ids.indexOf(a.id) - ids.indexOf(b.id));
      const mine = S.manualComments.filter((m) => m.file === f.path);
      if (S.findingsOnly && !fProps.length && !mine.length) return;
      // the file's findings and your own comments, by the line they are on
      const at = (x) => (x.line == null ? Infinity : x.line);
      const items = [...fProps.map((p, k) => ({ line: at(p), k, html: findingRow(p) })),
        ...mine.map((m, k) => ({ line: at(m), k: 1e6 + k, html: mineRow(m) }))].sort((a, b) => a.line - b.line || a.k - b.k);
      const total = fProps.length, fDecided = fProps.filter((p) => decided(p.id)).length;
      rows += `<button class="tree-row tree-file${S.activeFile === f.path ? " on" : ""}${total ? "" : " quiet"}" data-act="jump-file" data-file="${esc(f.path)}">
        <span class="name">${esc(f.path.split("/").pop())}</span>
        <span class="grow"></span>
        ${total ? `<span class="count${fDecided === total ? " done" : ""}">${fDecided}/${total}</span>` : ""}
        <span class="churn"><span class="plus">+${P.add}</span> <span class="minus">−${P.del}</span></span>
      </button>${items.map((x) => x.html).join("")}`;
    });
  });
  // findings on no file, as the diff shows them after the last file
  const loose = D.proposals.filter(unplaceable).sort((a, b) => ids.indexOf(a.id) - ids.indexOf(b.id));
  if (loose.length) rows += `<div class="tree-row tree-dir tree-loose">${Pinrail.icon("git-pull-request", { size: 13 })}<span class="path">Not on a file</span></div>${loose.map(findingRow).join("")}`;
  const hasRanks = D.files.some((f) => f.rank != null);
  return `<aside class="rail">
    <div class="rail-head">
      <span class="eyebrow">FILES · ${D.files.length}</span>
      <span class="grow"></span>
      ${hasRanks ? `<button class="toggle ${S.orderMode === "semantic" ? "on" : ""}" data-act="toggle-order" title="Semantic reading order vs alphabetical">${ico(S.orderMode === "semantic" ? "list-ordered" : "arrow-down-a-z")}${S.orderMode === "semantic" ? "semantic" : "a→z"}</button>` : ""}
      <button class="toggle ${S.findingsOnly ? "on" : ""}" data-act="toggle-findings-only" title="Show only files with findings">${ico("funnel")}findings</button>
    </div>

  </aside>`;
}

/* ---------- render: summary, modals, header ---------- */

    </div>` : "";

}

  const group = (title, fg, items) => `<div><div style="font-size:10.5px;font-weight:700;letter-spacing:0.07em;color:${fg};margin-bottom:5px">${title}</div><div style="display:flex;flex-direction:column;gap:3px">${items.join("")}</div></div>`;
  if (verbatim.length) groups.push(group("POSTED VERBATIM", "var(--ok)", verbatim.map((e) => item("#" + e.p.id, e.p.title))));
  if (revised.length) groups.push(group("POSTED AFTER REVISION", "var(--accent)", revised.map((e) => item("#" + e.p.id, e.p.title, e.d.note))));
  if (rejected.length) groups.push(group("REJECTED — NOT POSTED", "var(--danger)", rejected.map((e) => item("#" + e.p.id, e.p.title, e.d.note))));
  if (yours) groups.push(group("YOUR COMMENTS — HANDED TO THE AGENT", "var(--accent)", [
    ...S.manualComments.map((m) => item(m.file.split("/").pop() + ":" + m.line, m.body))]));
  if (undecidedList.length) groups.push(group("UNDECIDED — REPORTED AS SUCH", "var(--sev-major)", undecidedList.map((p) => item("#" + p.id, p.title))));
  const stats = [
    [verbatim.length, "posted verbatim", "var(--ok)"],
    [revised.length, "posted after revision", "var(--accent)"],
    [rejected.length, "rejected", "var(--danger)"],
    [yours, "your comments", "var(--accent)"],
    [undecidedList.length, "left undecided", undecidedList.length ? "var(--sev-major)" : "var(--faint)"],
  ].map(([n, label, fg]) => `<div style="border:1px solid var(--border);border-radius:8px;padding:8px 10px;background:var(--bg)">
    <div style="font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;color:${fg}">${n}</div>
    <div style="font-size:10.5px;color:var(--dim);line-height:1.3">${label}</div></div>`).join("");
  const errors = S.errors && S.errors.length ? `<div class="errors" id="errors">The server refused the decision:\n${S.errors.map((e) => `${esc(e.path || "/")}: ${esc(e.message)}`).join("\n")}</div>` : "";
  const body = `
    <div style="padding:18px 22px 0 22px">
      <div style="font-size:15px;font-weight:600">Hand over to the agent</div>
      <div style="font-size:12px;color:var(--dim);margin-top:3px">This is the gate. Exactly the following goes back to the workflow — nothing else.</div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:14px 22px">${stats}</div>
    ${undecidedList.length ? `<div style="margin:0 22px 12px 22px;padding:9px 12px;border:1px solid color-mix(in oklab, var(--sev-major) 45%, transparent);background:color-mix(in oklab, var(--sev-major) 10%, transparent);border-radius:8px;font-size:12.5px">⚠ <b>${undecidedList.length} proposal(s) still undecided.</b> They will not be posted; the workflow is told they were left undecided.</div>` : ""}
    ${errors}
    <div style="padding:0 22px 8px 22px;display:flex;flex-direction:column;gap:10px">${groups.join("")}</div>
    <div style="display:flex;align-items:center;gap:10px;padding:14px 22px;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--bg-raised)">
      <span style="flex:1;font-size:11.5px;color:var(--faint)">Your note to the agent travels with this.</span>
      <button class="ghost" data-act="close-submit" style="font-size:12.5px;padding:6px 12px">Keep reviewing</button>
      <button class="primary" data-act="confirm-submit" style="padding:7px 16px">${S.confirmSubmitArm ? `Hand over anyway — ${undecidedList.length} left undecided` : `Hand over ${decEntries.length + yours} decision(s)`}</button>
    </div>`;
  return `<div style="position:fixed;inset:0;background:oklch(0.1 0.01 250 / 0.65);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding-top:6vh;animation:fade 0.12s ease-out">
    <div id="submit-modal" style="background:var(--bg-raised);border:1px solid var(--border-strong);border-radius:12px;width:640px;max-height:86vh;overflow-y:auto;box-shadow:0 20px 60px oklch(0 0 0 / 0.45)">${body}</div></div>`;
}
/* The shell's own header carries the gate's origin: the repository, the
   workflow, the ref and a link to it. This header says what the shell cannot
   know, and leaves out whatever it can see is already up there. */
function shellShows(field) {
  const origin = (GATE && GATE.origin) || {};
  const change = D.change;
  if (field === "url") return !!origin.url && origin.url === change.url;
  const bare = (value) => String(value == null ? "" : value).replace(/^[#!]/, "");
  return !!origin.ref && bare(origin.ref) === bare(change.ref);
}

/* Toolbar icons sit beside their label, so they are decoration and the label
   is the name. The one button with no label of its own carries one instead. */
const ico = (name) => Pinrail.icon(name, { size: 14 });

function headerHtml() {
  const props = D.proposals;
  const count = (a) => props.filter((p) => S.decisions[p.id] && S.decisions[p.id].action === a).length;
  const decidedCount = props.filter((p) => decided(p.id)).length;
  const undecidedList = props.filter((p) => !decided(p.id));
  const pct = props.length ? Math.round((decidedCount / props.length) * 100) : 0;
  const c = D.change;
  const status = GATE.status;
  const roLabel = status === "decided" ? "READ-ONLY · DECIDED" : `READ-ONLY · ${String(status).toUpperCase()}`;
  return `<header class="head">
    <button class="bare head-tree" data-act="toggle-tree">${Pinrail.icon(S.treeOpen ? "panel-left-close" : "panel-left-open", { size: 15, label: S.treeOpen ? "Collapse the file tree" : "Show the file tree" })}</button>
    <div class="head-title">
      <h1>${esc(c.title)}</h1>
      ${shellShows("ref") ? "" : `<span class="head-ref">${esc(c.ref)}</span>`}
      <span class="head-branch">

        ${c.url && !shellShows("url") ? `<a href="${esc(c.url)}" target="_blank" rel="noreferrer">open ↗</a>` : ""}
      </span>

    ${RO() ? `<span class="head-ro">${roLabel}</span>`
      : `<div class="tally" title="${decidedCount} of ${props.length} decided"><span class="t-ok"><b>${count("accept")}</b> accepted</span><span class="t-no"><b>${count("reject")}</b> rejected</span><span><b>${undecidedList.length}</b> undecided</span></div>`}
    ${RO() ? "" : `<div class="head-progress" aria-hidden="true"><span style="width:${pct}%"></span></div>`}

/* The diff's own bar: how it reads, level with the rail's head. */
function toolbarHtml() {

  };

      <button class="seg ${S.diffMode === "split" ? "on" : ""}" data-act="set-split" title="Split diff">${Pinrail.icon("columns-2", { size: 14, label: "Split diff" })}</button>
    </div>

/* ---------- render root ---------- */
/* The document is a set of regions — header, tree, summary, one section per
   file, the unanchored cards, the modals — each rendered to a string. A
   change re-renders the strings and swaps only the regions whose string
   differs, so accepting a comment touches one file's section rather than
   three thousand diff rows. The whole document is rebuilt only when its
   shape changes: the tree opens or closes, files reorder, the round is
   done. */
let RENDERED = null; // { shape, regions: Map(key -> html), hunks: Map(key -> html) }
function region(key, html) {
  // the region's root carries its key; an empty region keeps a placeholder
  if (!html) return `<span data-region="${esc(key)}" hidden></span>`;
  return html.replace(/^\s*<([a-z0-9]+)/i, `<$1 data-region="${esc(key)}"`);
}
// a file region holds markers where its hunks go; composing fills them in
const compose = (html) => html.replace(/<!--region:([^>]*)-->/g, (_, key) => HUNKS.get(key) || "");
const hunkFile = (key) => "file:" + key.slice("hunk:".length, key.lastIndexOf(":"));
function render() {
  const app = document.getElementById("app");
  if (!D) { app.innerHTML = `<div style="padding:40px;color:var(--dim);font-family:var(--sans)">waiting for the shell…</div>`; RENDERED = null; return; }
  const main = document.getElementById("main");
  const scrollTop = main ? main.scrollTop : 0;
  const focusEl = document.activeElement;
  const focusDesc = focusEl && focusEl.id === "composer-ta" ? { id: "composer-ta" }
    : focusEl && focusEl.hasAttribute && focusEl.hasAttribute("data-note-ta") ? { note: focusEl.getAttribute("data-note-ta") } : null;

  const globalUn = D.proposals.filter(unplaceable);
  const order = orderedFiles();
  const regions = new Map();
  HUNKS = new Map();
  regions.set("header", region("header", headerHtml()));
  regions.set("tree", region("tree", S.treeOpen ? treeHtml() : ""));
  regions.set("toolbar", region("toolbar", toolbarHtml()));
  regions.set("brief", region("brief", briefHtml()));
  for (const i of order) regions.set(`file:${D.files[i].path}`, region(`file:${D.files[i].path}`, fileSectionHtml(D.files[i], i)));
  regions.set("unanchored", region("unanchored", globalUn.length ? `<section style="margin-bottom:20px">
          <div style="display:flex;align-items:baseline;gap:10px;padding:7px 11px;background:var(--bg-panel);border:1px solid var(--border);border-radius:8px 8px 0 0">
            <span style="font-size:12.5px;font-weight:600">Not anchored to any file</span>
            <span style="font-size:11px;color:var(--faint)">replies go to their thread; the rest post on the change as a whole</span>
          </div>
          <div style="border:1px dashed var(--border-strong);border-top:none;border-radius:0 0 8px 8px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg-panel)">${globalUn.map(cardHtml).join("")}</div>
        </section>` : ""));
  regions.set("submit", region("submit", submitModalHtml()));
  const shape = JSON.stringify([S.treeOpen, S.done, order.map((i) => D.files[i].path), globalUn.map((p) => p.id)]);

  if (RENDERED && RENDERED.shape === shape) {
    // the same shape: swap only what changed — a region, or a hunk inside one
    let missing = false;
    const swapped = new Set();
    for (const [key, html] of regions) {
      if (RENDERED.regions.get(key) === html) continue;
      const el = app.querySelector(`[data-region="${CSS.escape(key)}"]`);
      if (!el) { missing = true; break; }
      el.outerHTML = compose(html);
      swapped.add(key);
    }
    if (!missing) {
      for (const [key, html] of HUNKS) {
        if (RENDERED.hunks.get(key) === html || swapped.has(hunkFile(key))) continue;
        const el = app.querySelector(`[data-region="${CSS.escape(key)}"]`);
        if (!el) { missing = true; break; }
        el.outerHTML = html;
      }
    }
    if (!missing) {
      RENDERED = { shape, regions, hunks: HUNKS };
      restoreFocus(focusDesc);
      syncStatus();
      return;
    }
  }

  const banner = S.done ? `<div id="done-banner" style="flex:none;padding:7px 16px;background:color-mix(in oklab, var(--ok) 12%, var(--bg-panel));border-bottom:1px solid color-mix(in oklab, var(--ok) 35%, var(--border));font-size:12.5px;color:var(--ok);font-weight:500">✓ Decisions submitted. The workflow receives exactly what you approved.</div>` : "";
  app.innerHTML = `${regions.get("header")}${banner}
  <div style="display:flex;flex:1;min-height:0">
    ${regions.get("tree")}
    <div class="pane">
    ${regions.get("toolbar")}
    <div id="main" style="flex:1;overflow-y:auto;min-width:0;min-height:0">
      <div style="padding:16px 24px 420px 24px">
        ${regions.get("brief")}
        ${order.map((i) => compose(regions.get(`file:${D.files[i].path}`))).join("")}
        ${regions.get("unanchored")}
      </div>
    </div>
    </div>
  </div>
  ${regions.get("submit")}`;
  RENDERED = { shape, regions, hunks: HUNKS };
  const nm = document.getElementById("main");
  if (nm) { nm.scrollTop = scrollTop; nm.addEventListener("scroll", spy, { passive: true }); }
  restoreFocus(focusDesc);
  syncStatus();
}
// a note field grows with what is written in it
function fitNote(el) { el.style.height = "auto"; el.style.height = el.scrollHeight + "px"; }
document.addEventListener("input", (e) => { if (e.target.matches && e.target.matches("[data-note-ta], #composer-ta")) fitNote(e.target); });
function restoreFocus(focusDesc) {
  document.querySelectorAll("[data-note-ta], #composer-ta").forEach(fitNote);
  let toFocus = null;
  if (focusDesc) toFocus = focusDesc.id ? document.getElementById(focusDesc.id) : document.querySelector(`[data-note-ta="${focusDesc.note}"]`);
  else if (S.composer) toFocus = document.getElementById("composer-ta");
  // a note field takes the cursor when it has just been opened, not on every
  // redraw: one left open further up must not pull the page back to it
  else if (S.focusNote != null) toFocus = document.querySelector(`[data-note-ta="${S.focusNote}"]`);
  S.focusNote = null;
  // putting the cursor back where it was never scrolls; a field just opened may
  if (toFocus && toFocus !== document.activeElement) { toFocus.focus({ preventScroll: !!focusDesc }); const v = toFocus.value; toFocus.value = ""; toFocus.value = v; }
}

/* ---------- scrollspy ---------- */
let spyPending = false;
function spy() {
  if (spyPending) return;
  spyPending = true;
  requestAnimationFrame(() => {
    spyPending = false;
    const c = document.getElementById("main"); if (!c) return;
    const cr = c.getBoundingClientRect();
    let best = null, bestTop = -Infinity;
    c.querySelectorAll("[data-filesec]").forEach((el) => {
      const t = el.getBoundingClientRect().top - cr.top;
      if (t <= 80 && t > bestTop) { bestTop = t; best = el.getAttribute("data-filesec"); }
    });
    if (best && best !== S.activeFile) {
      S.activeFile = best;
      highlightTree(best);
    }
  });
}
function highlightTree(path) {
  document.querySelectorAll('[data-act="jump-file"]').forEach((el) => el.classList.toggle("on", el.getAttribute("data-file") === path));
}

/* ---------- actions ---------- */
function saveComposer() {
  const ta = document.getElementById("composer-ta");
  const text = ta ? ta.value.trim() : "";
  const c = S.composer;
  if (!c || !text) return;
  set(() => {
    if (c.editId != null) S.manualComments = S.manualComments.map((m) => m.id === c.editId ? { ...m, body: text } : m);
    else S.manualComments.push({ id: "m" + (++mseq), file: c.file, line: c.line, side: c.side, body: text });
    S.composer = null;
  });
}
function bulk(action) {
  const undecidedList = D.proposals.filter((p) => !decided(p.id));
  if (S.confirmBulk !== action) {
    set(() => { S.confirmBulk = action; });
    clearTimeout(bulkT);
    bulkT = setTimeout(() => set(() => { S.confirmBulk = null; }), 3000);
    return;
  }
  set(() => {
    undecidedList.forEach((p) => { S.decisions[p.id] = { ...(S.decisions[p.id] || {}), action }; });
    S.confirmBulk = null;
  });
}
function confirmSubmit() {
  captureDrafts();
  const undecidedCount = D.proposals.filter((p) => !decided(p.id)).length;
  if (!S.confirmSubmitArm && undecidedCount) { set(() => { S.confirmSubmitArm = true; }); return; }
  set(() => { S.errors = null; });
  handingOver = true;
  plugin.submit(buildDecision());
}
/* The shell's hand-over button asks for the decision: the first press opens
   the summary of exactly what would go back, the next one confirms it. */
function collect() {
  if (RO()) return;
  if (!S.showSubmit) { set(() => { S.showSubmit = true; S.confirmSubmitArm = false; }); return; }
  confirmSubmit();
}

function syncStatus() {
  if (RO()) return;
  const undecided = D.proposals.filter((p) => !decided(p.id)).length;
  plugin.status({
    label: !S.showSubmit ? "Review and hand over"
      : S.confirmSubmitArm ? `Hand over, ${undecided} undecided`
      : "Hand over",
  });
}

// WebKit keeps a text field focused when a button elsewhere is clicked; a
// press outside the field lets go of it, so a redraw never returns to it
document.addEventListener("mousedown", (e) => {
  const a = document.activeElement;
  if (a && a.matches && a.matches("textarea, input") && !a.contains(e.target)) a.blur();
}, true);
document.addEventListener("click", (e) => {
  const cardEl = e.target.closest("[data-card]");
  const cardId = cardEl ? parseInt(cardEl.getAttribute("data-card"), 10) : null;
  const t = e.target.closest("[data-act]");
  if (!t) {
    const ov = e.target.closest("[data-act-overlay]");
    if (ov && e.target === ov) return;
    if (cardId != null && S.focusedId !== cardId) set(() => { S.focusedId = cardId; });
    return;
  }
  if (cardId != null) S.focusedId = cardId;
  const act = t.getAttribute("data-act");
  const id = t.hasAttribute("data-id") ? parseInt(t.getAttribute("data-id"), 10) : null;
  switch (act) {
    // a click stays on the finding; the a key moves on, for going through them in order
    case "accept": inPlace(id, () => decide(id, "accept", false)); break;
    case "reject": inPlace(id, () => decide(id, "reject", false)); break;
    case "undo": undo(id); break;
    case "expand": inPlace(id, () => set(() => { S.expanded[id] = true; })); break;
    case "collapse": inPlace(id, () => set(() => { delete S.expanded[id]; })); break;
    case "toggle-thread": { const k = "t" + t.getAttribute("data-id"); const cur = t.getAttribute("data-open") === "1"; inPlace(id, () => set(() => { S.expanded[k] = !cur; })); break; }
    case "open-note": set(() => { S.noteOpen[id] = { open: true, draft: (S.decisions[id] && S.decisions[id].note) || "" }; S.focusNote = id; }); break;
    case "save-note": { const ta = document.querySelector(`[data-note-ta="${id}"]`); setNote(id, ta ? ta.value.trim() : ""); break; }
    case "del-note": setNote(id, ""); break;
    case "open-composer": {
      const file = t.getAttribute("data-file");
      const line = parseInt(t.getAttribute("data-line"), 10); const side = t.getAttribute("data-side") || "new";
      set(() => { S.composer = { file, line, side, text: "", editId: null }; });
      break;
    }
    case "save-composer": inPlace(S.focusedId, saveComposer); break;
    case "cancel-composer": inPlace(S.focusedId, () => set(() => { S.composer = null; })); break;
    case "edit-manual": {
      const m = S.manualComments.find((x) => x.id === t.getAttribute("data-mid"));
      if (m) set(() => { S.composer = { file: m.file, line: m.line, side: m.side, text: m.body, editId: m.id }; });
      break;
    }
    case "del-manual": set(() => { S.manualComments = S.manualComments.filter((x) => x.id !== t.getAttribute("data-mid")); }); break;
    case "fold-file": { const f = t.getAttribute("data-file"); set(() => { S.folded[f] = !S.folded[f]; }); break; }
    case "fold-all": {
      const all = D.files.every((f) => S.folded[f.path]);
      set(() => { S.folded = {}; if (!all) D.files.forEach((f) => { S.folded[f.path] = true; }); });
      break;
    }
    case "jump-file": jumpToFile(t.getAttribute("data-file")); break;
    case "jump-comment": {
      const el = document.querySelector(`[data-comment="${CSS.escape(t.getAttribute("data-mid"))}"]`);
      if (el) scrollTo(el, (cr) => cr.height / 3.2);
      break;
    }
    case "jump-card": {
      const p = D.proposals.find((x) => String(x.id) === t.getAttribute("data-id"));
      if (p) { set(() => { S.focusedId = p.id; unfoldFor(p.id); }); scrollToCard(p.id); }
      break;
    }
    case "toggle-dir": { const d = t.getAttribute("data-dir"); set(() => { S.collapsedDirs[d] = !S.collapsedDirs[d]; }); break; }
    case "toggle-tree": set(() => { S.treeOpen = !S.treeOpen; }); keep("tree_open", S.treeOpen); break;
    case "toggle-findings-only": set(() => { S.findingsOnly = !S.findingsOnly; }); keep("findings_only", S.findingsOnly); break;
    case "toggle-order": set(() => { S.orderMode = S.orderMode === "semantic" ? "path" : "semantic"; }); keep("order", S.orderMode); break;
    case "set-inline": set(() => { S.diffMode = "inline"; }); keep("diff", "inline"); break;
    case "set-split": set(() => { S.diffMode = "split"; }); keep("diff", "split"); break;
    case "toggle-wrap": set(() => { S.wrap = !S.wrap; }); keep("wrap", S.wrap); break;
    case "bulk-accept": bulk("accept"); break;
    case "bulk-reject": bulk("reject"); break;
    case "toggle-brief": set(() => { S.briefOpen = !S.briefOpen; }); break;
    case "toggle-concerns": set(() => { S.concernsOpen = !S.concernsOpen; }); break;
    case "open-submit": set(() => { S.showSubmit = true; S.confirmSubmitArm = false; }); break;
    case "close-submit": set(() => { S.showSubmit = false; S.errors = null; }); break;
    case "confirm-submit": confirmSubmit(); break;
  }
});
document.addEventListener("keydown", (e) => {
  if (!D) return;
  const tag = e.target && e.target.tagName;
  const typing = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (e.target && e.target.isContentEditable);
  if (e.key === "Escape") {
    // the key is ours: nothing else acts on it, and the field it was typed in
    // lets go of focus before it goes
    e.preventDefault();
    if (typing && e.target.blur) e.target.blur();
    if (typing && e.target.hasAttribute && e.target.hasAttribute("data-note-ta")) {
      const id = e.target.getAttribute("data-note-ta");
      inPlace(id, () => set(() => { delete S.noteOpen[id]; }));
      return;
    }
    inPlace(S.focusedId, () => set(() => { S.showSubmit = false; S.composer = null; S.confirmBulk = null; S.confirmSubmitArm = false; }));
    return;
  }
  if (typing) {
    if (e.key === "Enter" && !e.shiftKey) {
      if (e.target.id === "composer-ta") { e.preventDefault(); inPlace(S.focusedId, saveComposer); }
      else if (e.target.hasAttribute("data-note-ta")) {
        e.preventDefault();
        const id = parseInt(e.target.getAttribute("data-note-ta"), 10);
        setNote(id, e.target.value.trim());
      }
    }
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const fid = S.focusedId;
  switch (e.key) {
    case "j": e.preventDefault(); moveFocus(1); break;
    case "k": e.preventDefault(); moveFocus(-1); break;
    case "a": if (!RO() && fid != null) { e.preventDefault(); decide(fid, "accept", true); } break;
    case "x": if (!RO() && fid != null) { e.preventDefault(); decide(fid, "reject", false); } break;
    case "c": if (!RO() && fid != null) {
      // the note to the agent on the focused finding, written in place
      e.preventDefault();
      inPlace(fid, () => set(() => { S.noteOpen[fid] = { open: true, draft: (S.decisions[fid] && S.decisions[fid].note) || "" }; S.focusNote = fid; S.expanded[fid] = true; }));
    }
    break;
    case "v": e.preventDefault(); set(() => { S.diffMode = S.diffMode === "inline" ? "split" : "inline"; }); keep("diff", S.diffMode); break;
    case "w": if (S.diffMode === "inline") { e.preventDefault(); set(() => { S.wrap = !S.wrap; }); keep("wrap", S.wrap); } break;
    case "o": e.preventDefault(); set(() => { S.orderMode = S.orderMode === "semantic" ? "path" : "semantic"; }); keep("order", S.orderMode); break;
    case "s": if (!RO()) { e.preventDefault(); set(() => { S.showSubmit = true; S.confirmSubmitArm = false; }); } break;
  }
});

/* ---------- boot ---------- */
function boot(draftData) {
  D = adapt(GATE.payload);
  if (!D.files.some((f) => f.rank != null)) S.orderMode = "path";
  prep();
  S.done = RO() && !!GATE.decision;
  S.showSubmit = false; S.composer = null; S.noteOpen = {}; S.errors = null;
  if (RO()) {
    loadDecision(GATE.decision && GATE.decision.data);
  } else if (draftData && draftData.decisions) {
    S.decisions = draftData.decisions || {};
    S.manualComments = draftData.manualComments || [];
    mseq = draftData.mseq || S.manualComments.length;
  } else {
    S.decisions = {}; S.manualComments = [];
  }
  const ids = orderedIds();
  S.focusedId = RO() ? null : (ids.find((id) => !decided(id)) ?? (ids.length ? ids[0] : null));
  render();
}
render();
</script>
