<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>3D model review</title>
<link rel="stylesheet" href="/sdk/v1/pinrail-plugin.css">
<style>
  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; }
  .shell { display: grid; grid-template-rows: auto 1fr; height: 100%; }
  .top { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 14px; padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--bg-panel); }
  .top .top-notice { flex-basis: 100%; }
  .top h1 { margin: 0; font-size: 15px; font-weight: 600; }
  .top .subject { color: var(--dim); font-size: 12.5px; }
  .tally { margin-left: auto; display: flex; gap: 12px; font-size: 12px; color: var(--dim); }
  .tally b { color: var(--text); font-variant-numeric: tabular-nums; }
  .work { display: grid; grid-template-columns: 264px 1fr; min-height: 0; }

  /* the rail: a still of every model from the same angle */
  .rail { overflow-y: auto; border-right: 1px solid var(--border); padding: 12px; display: grid; gap: 6px; align-content: start; background: var(--bg-panel); }
  .rail-label { margin: 4px 6px 6px; font: 600 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
  .pick { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px 10px; width: 100%; padding: 8px; border: 1px solid transparent; border-radius: 10px; background: none; color: var(--text); text-align: left; cursor: pointer; font: inherit; }
  .pick:hover { background: var(--bg-hover); }
  .pick[aria-current="true"] { background: var(--bg-raised); border-color: var(--border-strong); }
  .pick:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .pick-name { font-size: 13px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-left: 2px; }
  .still { grid-column: 1 / -1; aspect-ratio: 16 / 10; border-radius: 7px; background: var(--stage-bg); overflow: hidden; display: grid; place-items: center; box-shadow: inset 0 0 0 1px var(--border); }
  .still img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .still .wait { font: 11px var(--mono); color: var(--faint); }
  .pick-meta { grid-column: 1 / -1; font: 11px var(--mono); color: var(--faint); padding-left: 2px; margin-top: -2px; }

  .verdict-chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 99px; font: 600 10.5px var(--mono); letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
  .v-favorite { background: color-mix(in oklab, #d4a017 22%, transparent); color: color-mix(in oklab, #b8860b 80%, var(--text)); }
  .v-keep { background: var(--accent-bg); color: var(--accent); }
  .v-drop { background: color-mix(in oklab, var(--faint) 18%, transparent); color: var(--faint); text-decoration: line-through; }
  .v-none { color: var(--faint); background: none; padding-inline: 0; }

  .sheet { overflow-y: auto; min-height: 0; }
  .sheet-inner { max-width: 1120px; margin: 0 auto; padding: 22px 28px 28px; display: grid; gap: 18px; }
  .notes { color: var(--dim); font-size: 13px; line-height: 1.6; padding: 12px 14px; border: 1px dashed var(--border); border-radius: 10px; }
  .notes p { margin: 0 0 6px; } .notes p:last-child { margin: 0; }
  .model-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; }
  .model-head h2 { margin: 0; font-size: 22px; letter-spacing: -0.02em; }
  .model-id { font: 12px var(--mono); color: var(--faint); }
  .previous { flex-basis: 100%; font-size: 12.5px; color: var(--dim); }
  .reasoning { max-width: 72ch; color: var(--dim); font-size: 14px; line-height: 1.65; margin-top: -6px; }
  .reasoning p { margin: 0 0 8px; } .reasoning p:last-child { margin: 0; }
  .label { margin: 0 0 8px; font: 600 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }

  /* the stage */
  .viewer { position: relative; height: clamp(380px, 58vh, 620px); border-radius: 14px; overflow: hidden; background: var(--stage-bg); box-shadow: inset 0 0 0 1px var(--border); }
  .viewer canvas { display: block; width: 100%; height: 100%; outline: none; }
  .viewer.pickable canvas { cursor: grab; }
  .viewer.pickable.over canvas { cursor: crosshair; }
  .viewer.dragging canvas { cursor: grabbing; }
  .bar { position: absolute; display: flex; gap: 4px; padding: 4px; border-radius: 10px; background: color-mix(in oklab, var(--bg-raised) 86%, transparent); backdrop-filter: blur(8px); box-shadow: 0 0 0 1px var(--border), 0 6px 18px -10px rgba(0,0,0,.35); }
  .bar.views { top: 12px; left: 12px; flex-wrap: wrap; max-width: calc(100% - 250px); }
  .bar.tools { top: 12px; right: 12px; }
  .bar button { display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px; border: 0; border-radius: 7px; background: none; color: var(--dim); font: 500 12px var(--sans); cursor: pointer; white-space: nowrap; }
  .bar button:hover { background: var(--bg-hover); color: var(--text); }
  .bar button[aria-pressed="true"] { background: var(--bg); color: var(--text); box-shadow: 0 0 0 1px var(--border-strong); }
  .bar button kbd { font: 10.5px var(--mono); color: var(--faint); }
  .bar .sep { width: 1px; margin: 3px 2px; background: var(--border); }
  .stats { position: absolute; left: 14px; bottom: 12px; display: flex; gap: 14px; font: 11.5px var(--mono); color: var(--stage-ink); opacity: .75; pointer-events: none; }
  .hint { position: absolute; right: 14px; bottom: 12px; font-size: 11.5px; color: var(--stage-ink); opacity: .6; pointer-events: none; }
  .tip { position: absolute; transform: translate(12px, 12px); padding: 3px 8px; border-radius: 6px; background: var(--text); color: var(--bg); font: 500 11.5px var(--sans); pointer-events: none; white-space: nowrap; }
  .tip .m { opacity: .6; font-family: var(--mono); font-size: 10.5px; margin-left: 6px; }
  .broken, .reading { position: absolute; inset: 0; display: grid; place-items: center; padding: 20px; text-align: center; color: var(--dim); font-size: 13px; }

  .pins { position: absolute; inset: 0; pointer-events: none; }
  .pin { position: absolute; display: grid; place-items: center; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: var(--accent); color: var(--bg); font: 700 11px var(--mono); box-shadow: 0 0 0 2px var(--bg), 0 2px 8px rgba(0,0,0,.3); pointer-events: auto; cursor: pointer; transition: opacity .15s; }
  .pin.hidden-behind { opacity: .35; }
  .pin.new { background: var(--text); }

  .pop { position: absolute; width: 300px; display: grid; gap: 8px; padding: 12px; border-radius: 12px; background: var(--bg-raised); box-shadow: 0 0 0 1px var(--border-strong), 0 14px 34px -12px rgba(0,0,0,.45); z-index: 3; }
  .pop-head { display: flex; align-items: baseline; gap: 8px; font-size: 12.5px; color: var(--dim); min-width: 0; }
  .pop-head b { color: var(--text); font-weight: 600; }
  .pop-head .path { font: 11px var(--mono); color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pop textarea { width: 100%; min-height: 64px; resize: vertical; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font: 13px/1.5 var(--sans); box-sizing: border-box; }
  .pop textarea:focus { outline: none; border-color: var(--accent); }
  .pop-actions { display: flex; gap: 6px; justify-content: flex-end; align-items: center; }
  .pop-actions .k { margin-right: auto; font: 11px var(--mono); color: var(--faint); }
  .btn { padding: 5px 11px; border-radius: 7px; border: 1px solid var(--border-strong); background: var(--bg); color: var(--text); font: 600 12px var(--sans); cursor: pointer; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .btn.quiet { border-color: transparent; background: none; color: var(--dim); font-weight: 500; }

  /* parts and comments under the stage */
  .below { display: grid; grid-template-columns: minmax(220px, 300px) 1fr; gap: 18px; align-items: start; }
  .tree { margin: 0; padding: 6px; list-style: none; border: 1px solid var(--border); border-radius: 12px; max-height: 280px; overflow-y: auto; font-size: 12.5px; }
  .tree button { display: flex; align-items: center; gap: 6px; width: 100%; padding: 4px 8px; border: 0; border-radius: 6px; background: none; color: var(--text); font: inherit; text-align: left; cursor: pointer; }
  .tree button:hover, .tree button.lit { background: var(--bg-hover); }
  .tree .grp { color: var(--dim); cursor: default; }
  .tree .grp:hover { background: none; }
  .tree .mat { margin-left: auto; font: 10.5px var(--mono); color: var(--faint); }
  .tree .count { display: grid; place-items: center; min-width: 16px; height: 16px; border-radius: 8px; background: var(--accent); color: var(--bg); font: 700 10px var(--mono); }
  .comments { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .comments li { display: grid; grid-template-columns: auto 1fr auto; align-items: start; gap: 10px; padding: 9px 12px; border-radius: 10px; background: var(--bg-raised); border: 1px solid var(--border); font-size: 13.5px; }
  .comments .num { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: var(--bg); font: 700 11px var(--mono); }
  .comments .what { font: 11.5px var(--mono); color: var(--faint); }
  .comments .acts { display: flex; gap: 4px; }
  .empty { color: var(--faint); font-size: 13px; padding: 10px 2px; }

  .decide { display: grid; gap: 10px; padding-top: 4px; }
  .choices { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .choice { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 9px; border: 1px solid var(--border-strong); background: var(--bg); color: var(--text); font: 600 13px var(--sans); cursor: pointer; }
  .choice kbd { font: 11px var(--mono); color: var(--faint); }
  .choice[aria-pressed="true"][data-action="favorite"] { background: color-mix(in oklab, #d4a017 22%, var(--bg)); border-color: #d4a017; }
  .choice[aria-pressed="true"][data-action="keep"] { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
  .choice[aria-pressed="true"][data-action="drop"] { background: var(--bg-hover); color: var(--faint); text-decoration: line-through; }
  .choice:disabled { opacity: .6; cursor: default; }
  .choices .nav { margin-left: auto; display: flex; gap: 6px; }
  .choices .nav button { padding: 7px 11px; border-radius: 9px; border: 1px solid var(--border); background: none; color: var(--dim); font: 12px var(--mono); cursor: pointer; }
  #note { width: 100%; min-height: 64px; resize: vertical; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-raised); color: var(--text); font: 13.5px/1.5 var(--sans); box-sizing: border-box; }

  @media (max-width: 820px) {
    .work { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .rail { grid-auto-flow: column; grid-auto-columns: 180px; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--border); }
    .rail-label { display: none; }
    .below { grid-template-columns: 1fr; }
    .bar.views { max-width: calc(100% - 24px); }
    .bar.tools { top: auto; bottom: 36px; }
  }
</style>
</head>
<body>
<script src="/sdk/v1/pinrail-plugin.js"></script>
<div class="shell" id="app"><div class="top"><h1>Loading…</h1></div></div>
<script type="module">
import * as THREE from "./vendor/three.js";
const { OrbitControls, GLTFLoader, RoomEnvironment } = THREE;

const esc = Pinrail.escape;
const ACTIONS = { favorite: "Favourite", keep: "Keep", drop: "Drop" };
const KEYS = { favorite: "f", keep: "s", drop: "x" };
const LIGHTS = {
  studio: { label: "Studio", bg: "#e9e7e3", ink: "#3a3833", env: 1, sun: 1.6, ground: 0.18 },
  day: { label: "Daylight", bg: "#dfe8ee", ink: "#2d3b44", env: 0.7, sun: 2.8, ground: 0.28 },
  night: { label: "Night", bg: "#15171b", ink: "#c9cdd4", env: 0.08, sun: 0.15, ground: 0.4 },
};
const UNIT_METRES = { m: 1, cm: 0.01, mm: 0.001, in: 0.0254, ft: 0.3048 };

const S = { sel: 0, verdicts: {}, armed: false, errors: null, view: 0, turn: false, wire: false, light: "studio", picking: null, hover: null, keepScroll: false };
let P = null;
const models = [];        // per payload model: { root, error, stats, still, center, size }

/* Reading a model: a file the review carries (GLB, or glTF with
   everything embedded), which the shell hands over, or three.js JSON inline. */
async function load(m) {
  const file = Pinrail.attachmentName(m.file);
  if (!file) return new THREE.ObjectLoader().parse(m.object);
  const bytes = await plugin.attachment(file);
  return new Promise((ok, fail) => new GLTFLoader().parse(bytes, "", (g) => {
    // the loader makes names safe for animation paths ("Lower arm" → "Lower_arm"); keep the agent's own
    const nodes = g.parser.json.nodes || [];
    g.scene.traverse((o) => {
      const k = g.parser.associations.get(o)?.nodes;
      if (k !== undefined && nodes[k]?.name) o.userData.sourceName = nodes[k].name;
    });
    ok(g.scene);
  }, (e) => fail(e)));
}

/* The part's path by node names, the way the agent named them. Unnamed
   nodes are called by type, and twins get a #n. */
function nameOf(node) {
  if (node.userData.sourceName) return node.userData.sourceName;
  if (node.name) return node.name;
  return node.isMesh ? "Mesh" : node.type;
}
function pathOf(node, root) {
  const parts = [];
  for (let n = node; n && n !== root; n = n.parent) {
    let label = nameOf(n);
    const twins = n.parent ? n.parent.children.filter((c) => nameOf(c) === label) : [];
    if (twins.length > 1) label += `#${twins.indexOf(n) + 1}`;
    parts.unshift(label);
  }
  return parts.join(" > ");
}
const materialName = (mesh, face) => {
  const mat = Array.isArray(mesh.material) ? mesh.material[face?.materialIndex ?? 0] : mesh.material;
  return mat?.name || "";
};

function statsOf(root) {
  let tris = 0, meshes = 0;
  const mats = new Set();
  root.traverse((o) => {
    if (!o.isMesh) return;
    meshes++;
    const g = o.geometry;
    tris += (g.index ? g.index.count : g.attributes.position.count) / 3;
    (Array.isArray(o.material) ? o.material : [o.material]).forEach((mt) => mats.add(mt));
  });
  return { tris: Math.round(tris), meshes, materials: mats.size };
}
function fmtTris(n) { return n >= 1e6 ? `${(n / 1e6).toFixed(1)}M` : n >= 1e3 ? `${(n / 1e3).toFixed(1)}k` : String(n); }
function fmtSize(size) {
  const unit = P.subject.units || "m";
  let k = 1, u = unit;
  if (unit === "m" && Math.max(size.x, size.y, size.z) < 1) { k = 100; u = "cm"; }
  const n = (v) => { const x = v * k; return x >= 100 ? x.toFixed(0) : x >= 10 ? x.toFixed(1).replace(/\.0$/, "") : x.toFixed(2).replace(/0$/, ""); };
  return `${n(size.x)} × ${n(size.y)} × ${n(size.z)} ${u}`;
}

/* The stage: one renderer, reused for every model. */
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(35, 1, 0.001, 1000);
const sun = new THREE.DirectionalLight("#ffffff", 1.6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0005;
scene.add(sun, sun.target);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.ShadowMaterial({ opacity: 0.18 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
const holder = new THREE.Group();   // turns on the turntable; the model sits in it, centred
scene.add(holder);
let controls = null, dirty = true, current = null;

function stageFor(entry) {
  holder.clear();
  current = entry;
  if (!entry?.root) return;
  holder.rotation.set(0, 0, 0);
  holder.add(entry.frame);
  const { size } = entry;
  const r = Math.max(size.x, size.y, size.z);
  ground.scale.set(r * 8, r * 8, 1);
  sun.position.set(r * 1.2, r * 2.4, r * 1.6);
  const cam = sun.shadow.camera;
  cam.left = cam.bottom = -r * 1.5; cam.right = cam.top = r * 1.5; cam.near = 0.01 * r; cam.far = r * 8;
  cam.updateProjectionMatrix();
  camera.near = r / 200; camera.far = r * 100;
  camera.updateProjectionMatrix();
  applyLight();
  applyWire();
}

/* A model inside a frame group that stands it on the ground, centred; the
   frame is what the camera and the pins work in, the root keeps the
   model's own coordinates. */
function framed(root) {
  if (P.subject.up === "z") root.rotation.x = -Math.PI / 2;
  const frame = new THREE.Group();
  frame.add(root);
  root.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  const c = box.getCenter(new THREE.Vector3());
  root.position.sub(new THREE.Vector3(c.x, box.min.y, c.z));
  root.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  frame.updateMatrixWorld(true);
  return { frame, size, center: new THREE.Vector3(0, size.y / 2, 0) };
}

/* The views: set ones from the model's size, then the agent's own. */
function viewsFor(i) {
  const e = models[i];
  const m = P.models[i];
  if (!e?.root) return [];
  const { size, center } = e;
  // far enough that the bounding sphere fills the frame's height, with a margin
  const d = (size.length() / 2) / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * 1.08;
  const at = (x, y, z) => new THREE.Vector3(x, y, z).normalize().multiplyScalar(d).add(center).toArray();
  const set = [
    { name: "¾", position: at(0.62, 0.42, 0.66), target: center.toArray() },
    { name: "Front", position: at(0, 0, 1), target: center.toArray() },
    { name: "Side", position: at(1, 0, 0), target: center.toArray() },
    { name: "Top", position: at(0, 1, 0.0001), target: center.toArray() },
  ];
  const own = (m.views || []).map((v) => {
    const pos = e.root.localToWorld(new THREE.Vector3(...v.position));
    const tgt = v.target ? e.root.localToWorld(new THREE.Vector3(...v.target)) : center.clone();
    return { name: v.name, position: pos.toArray(), target: tgt.toArray(), own: true };
  });
  return [...set, ...own];
}
function goView(k) {
  const views = viewsFor(S.sel);
  if (!views[k]) return;
  S.view = k;
  holder.rotation.y = 0;
  camera.position.fromArray(views[k].position);
  controls.target.fromArray(views[k].target);
  controls.update();
  dirty = true;
  document.querySelectorAll("[data-view]").forEach((b) => b.setAttribute("aria-pressed", String(Number(b.dataset.view) === k)));
}
function setCamera(position, target) {
  holder.rotation.y = 0;
  camera.position.copy(current.root.localToWorld(new THREE.Vector3(...position)));
  controls.target.copy(target ? current.root.localToWorld(new THREE.Vector3(...target)) : current.center);
  controls.update();
  S.view = -1;
  document.querySelectorAll("[data-view]").forEach((b) => b.setAttribute("aria-pressed", "false"));
  dirty = true;
}

function applyLight() {
  const L = LIGHTS[S.light];
  scene.background = new THREE.Color(L.bg);
  scene.environmentIntensity = L.env;
  sun.intensity = L.sun;
  ground.material.opacity = L.ground;
  renderer.toneMappingExposure = S.light === "night" ? 1.3 : 1;
  const v = document.querySelector(".viewer");
  if (v) { v.style.setProperty("--stage-bg", L.bg); v.style.setProperty("--stage-ink", L.ink); }
  dirty = true;
}
function applyWire() {
  holder.traverse((o) => { if (o.isMesh) (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => { m.wireframe = S.wire; }); });
  dirty = true;
}

/* Hover and selection: the part lights up in the accent. */
const lit = new Map();   // mesh -> its own materials
function light(mesh, on) {
  if (!mesh) return;
  if (on && !lit.has(mesh)) {
    lit.set(mesh, mesh.material);
    const tint = (m) => { const c = m.clone(); if (c.emissive) { c.emissive = new THREE.Color(accent()); c.emissiveIntensity = 0.55; } return c; };
    mesh.material = Array.isArray(mesh.material) ? mesh.material.map(tint) : tint(mesh.material);
  } else if (!on && lit.has(mesh)) {
    mesh.material = lit.get(mesh);
    lit.delete(mesh);
  }
  dirty = true;
}
function unlightAll() { [...lit.keys()].forEach((m) => light(m, false)); }
const accent = () => getComputedStyle(document.body).getPropertyValue("--accent").trim() || "#2563eb";

const ray = new THREE.Raycaster();
function hit(ev) {
  if (!current?.root) return null;
  const r = renderer.domElement.getBoundingClientRect();
  const p = new THREE.Vector2(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(p, camera);
  return ray.intersectObject(current.root, true).find((h) => h.object.isMesh && h.object.visible) || null;
}

/* Pins follow their point as the camera moves, and fade when the model is in front of them. */
function placePins() {
  const box = document.querySelector(".pins");
  if (!box || !current?.root) return;
  const w = renderer.domElement.clientWidth, h = renderer.domElement.clientHeight;
  const comments = verdictOf(P.models[S.sel].id)?.comments || [];
  const pins = [...comments.map((c, i) => ({ c, label: i + 1 })), ...(S.picking ? [{ c: S.picking, label: "+", fresh: true }] : [])];
  box.innerHTML = pins.map(({ c, label, fresh }) => {
    if (!c.point) return "";
    const world = current.root.localToWorld(new THREE.Vector3(...c.point));
    const v = world.clone().project(camera);
    if (v.z > 1) return "";
    const dir = world.clone().sub(camera.position);
    ray.set(camera.position, dir.clone().normalize());
    const first = ray.intersectObject(current.root, true)[0];
    const behind = first && first.distance < dir.length() - Math.max(current.size.x, current.size.y) * 0.01;
    return `<span class="pin${fresh ? " new" : ""}${behind ? " hidden-behind" : ""}" data-pin="${fresh ? "" : label - 1}" style="left:${((v.x + 1) / 2) * w}px;top:${((1 - v.y) / 2) * h}px">${label}</span>`;
  }).join("");
  const pop = document.getElementById("pop");
  if (pop && S.picking) {
    const v = current.root.localToWorld(new THREE.Vector3(...S.picking.point)).project(camera);
    let x = ((v.x + 1) / 2) * w + 18, y = ((1 - v.y) / 2) * h - 20;
    if (x + 300 > w - 8) x = ((v.x + 1) / 2) * w - 318;
    y = Math.max(8, Math.min(y, h - pop.offsetHeight - 8));
    pop.style.left = `${Math.max(8, x)}px`;
    pop.style.top = `${y}px`;
  }
}

function loop() {
  requestAnimationFrame(loop);
  const canvas = renderer.domElement;
  if (!canvas.isConnected || !controls) return;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== Math.floor(w * renderer.getPixelRatio()) || canvas.height !== Math.floor(h * renderer.getPixelRatio())) {
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    dirty = true;
  }
  if (S.turn && !S.picking) { holder.rotation.y += 0.006; dirty = true; }
  if (controls.update()) dirty = true;
  if (!dirty) return;
  dirty = false;
  renderer.render(scene, camera);
  placePins();
}

/* A still for the rail, from the ¾ view in studio light. It borrows the
   stage, so whatever was on it goes back as it was. */
function still(i) {
  const e = models[i];
  const keep = { light: S.light, wire: S.wire };
  const was = current, turned = holder.rotation.y;
  S.light = "studio"; S.wire = false;
  stageFor(e);
  const v = viewsFor(i)[0];
  const cam = camera.clone();
  cam.aspect = 16 / 10;
  cam.position.fromArray(v.position);
  cam.lookAt(new THREE.Vector3(...v.target));
  cam.updateProjectionMatrix();
  const w = renderer.domElement.width, h = renderer.domElement.height;
  renderer.setSize(480, 300, false);
  renderer.render(scene, cam);
  e.still = renderer.domElement.toDataURL("image/png");
  renderer.setSize(w / renderer.getPixelRatio(), h / renderer.getPixelRatio(), false);
  Object.assign(S, keep);
  stageFor(was);
  holder.rotation.y = turned;
  dirty = true;
}

const verdictOf = (id) => S.verdicts[id] || null;
const shown = (v) => v && !v.action && (v.comments || []).length ? { ...v, action: "keep" } : v;
const chip = (v) => v && v.action && ACTIONS[v.action]
  ? `<span class="verdict-chip v-${v.action}">${v.action === "favorite" ? "★ " : ""}${ACTIONS[v.action]}</span>`
  : `<span class="verdict-chip v-none">—</span>`;

function decisionData() {
  const decisions = [], undecided = [];
  for (const m of P.models) {
    const v = verdictOf(m.id);
    const note = v && v.note ? v.note.trim() : "";
    const comments = (v && v.comments) || [];
    const action = (v && v.action) || (comments.length ? "keep" : null);
    if (!action) { undecided.push(m.id); continue; }
    const d = { id: m.id, action };
    if (note) d.note = note;
    if (comments.length) d.comments = comments.map(({ target, name, material, point, view, note }) => ({ target, name, ...(material ? { material } : {}), point, view, note }));
    decisions.push(d);
  }
  return { decisions, undecided };
}

function status() {
  if (plugin.readonly) return;
  const d = decisionData();
  const fav = d.decisions.find((x) => x.action === "favorite");
  const kept = d.decisions.filter((x) => x.action === "keep").length;
  const dropped = d.decisions.filter((x) => x.action === "drop").length;
  const parts = [];
  if (fav) parts.push(`★ ${P.models.find((m) => m.id === fav.id)?.name ?? fav.id}`);
  if (kept) parts.push(`${kept} kept`);
  if (dropped) parts.push(`${dropped} dropped`);
  const label = S.armed ? `Hand over with ${d.undecided.length} undecided` : parts.length ? `Hand over: ${parts.join(", ")}` : "Hand over";
  plugin.status({ label });
}

function renderTop() {
  const d = decisionData();
  const count = (a) => d.decisions.filter((x) => x.action === a).length;
  return `<div class="top">
      <h1>${esc(plugin.review.title || "3D model review")}</h1>
      <span class="subject">${esc(P.subject.name)}</span>
      <div class="tally" aria-live="polite">
        <span><b>${count("favorite")}</b> favourite</span><span><b>${count("keep")}</b> kept</span><span><b>${count("drop")}</b> dropped</span><span><b>${d.undecided.length}</b> undecided</span>
      </div>
      ${notice()}
    </div>`;
}

// what the app refused, every refusal, or why a first hand-over waits: the
// shell's button label is easy to miss and holds one message
function notice() {
  if (S.errors && S.errors.length) {
    return `<div class="notice danger top-notice" role="alert">${S.errors.map((e) => `${esc(e.path || "/")}: ${esc(e.message)}`).join("<br>")}</div>`;
  }
  if (S.armed) {
    const n = decisionData().undecided.length;
    return `<div class="notice warn top-notice" role="status" data-armed>${n} undecided. Hand over again to send ${n === 1 ? "it" : "them"} back undecided.</div>`;
  }
  return "";
}

function renderPick(m, i) {
  const e = models[i];
  return `<button type="button" class="pick" data-pick="${i}" aria-current="${i === S.sel}">
          <span class="still">${e?.still ? `<img src="${e.still}" alt="">` : `<span class="wait">${e?.error ? "can't read it" : "…"}</span>`}</span>
          <span class="pick-name">${esc(m.name)}</span>${chip(shown(verdictOf(m.id)))}
          ${e?.stats ? `<span class="pick-meta">${fmtTris(e.stats.tris)} tris · ${e.stats.meshes} parts</span>` : ""}
        </button>`;
}

function renderRail() {
  return `<nav class="rail" aria-label="Models" style="--stage-bg:${LIGHTS.studio.bg}">
      <p class="rail-label">${P.models.length} models</p>
      ${P.models.map(renderPick).join("")}
    </nav>`;
}

function treeOf(e, comments) {
  const counts = {};
  comments.forEach((c) => { counts[c.target] = (counts[c.target] || 0) + 1; });
  const rows = [];
  const walk = (node, depth) => {
    for (const child of node.children) {
      const path = pathOf(child, e.root);
      const pad = `style="padding-left:${8 + depth * 14}px"`;
      if (child.isMesh) rows.push(`<li><button type="button" data-part="${esc(path)}" ${pad}>${esc(nameOf(child))}${counts[path] ? `<span class="count">${counts[path]}</span>` : ""}<span class="mat">${esc(materialName(child))}</span></button></li>`);
      else if (child.children.length) rows.push(`<li><button type="button" class="grp" tabindex="-1" ${pad}>${esc(nameOf(child))}</button></li>`);
      walk(child, depth + 1);
    }
  };
  walk(e.root, 0);
  return rows.join("");
}

function renderSheet() {
  const m = P.models[S.sel];
  const e = models[S.sel];
  const v = verdictOf(m.id) || {};
  const prev = previousVerdict(plugin.previous, m.id);
  const ro = plugin.readonly ? "disabled" : "";
  const views = viewsFor(S.sel);
  const comments = v.comments || [];
  const L = LIGHTS[S.light];
  return `<main class="sheet" id="sheet" aria-labelledby="model-name"><div class="sheet-inner">
      ${P.notes ? `<div class="notes">${Pinrail.markdown(P.notes)}</div>` : ""}
      <header class="model-head">
        <h2 id="model-name">${esc(m.name)}</h2>
        <span class="model-id">${esc(m.id)} · ${S.sel + 1} of ${P.models.length}</span>
        ${prev ? `<div class="previous">Last round: ${chip(prev)} ${prev.note ? "— " + esc(prev.note) : ""}</div>` : ""}
      </header>
      ${m.reasoning ? `<div class="reasoning">${Pinrail.markdown(m.reasoning)}</div>` : ""}

      <section class="viewer ${plugin.readonly ? "" : "pickable"}" id="viewer" aria-label="${esc(m.name)}, in 3D" style="--stage-bg:${L.bg};--stage-ink:${L.ink}">
        <div id="canvas-slot" style="position:absolute;inset:0"></div>
        ${e?.error ? `<div class="broken">This model could not be read: ${esc(String(e.error.message || e.error))}</div>` : ""}
        ${e ? "" : `<div class="reading">Reading the model…</div>`}
        <div class="pins"></div>
        ${e?.root ? `
        <div class="bar views" role="group" aria-label="Views">
          ${views.map((vw, k) => `<button type="button" data-view="${k}" aria-pressed="${k === S.view}">${esc(vw.name)}${k < 9 ? ` <kbd>${k + 1}</kbd>` : ""}</button>`).join("")}
        </div>
        <div class="bar tools" role="group" aria-label="Display">
          ${Object.entries(LIGHTS).map(([k, l]) => `<button type="button" data-light="${k}" aria-pressed="${S.light === k}">${esc(l.label)}</button>`).join("")}
          <span class="sep"></span>
          <button type="button" data-toggle="turn" aria-pressed="${S.turn}" title="Turntable (t)">${Pinrail.icon("rotate-3d", { size: 14 })}<kbd>t</kbd></button>
          <button type="button" data-toggle="wire" aria-pressed="${S.wire}" title="Wireframe (w)">${Pinrail.icon("grid", { size: 14 })}<kbd>w</kbd></button>
        </div>
        <div class="stats"><span>${fmtSize(e.size)}</span><span>${fmtTris(e.stats.tris)} triangles</span><span>${e.stats.meshes} parts · ${e.stats.materials} materials</span></div>
        ${plugin.readonly ? "" : `<div class="hint">Drag to orbit · scroll to zoom · click a part to comment</div>`}` : ""}
        ${S.picking ? `<div class="pop" id="pop" role="dialog" aria-label="Comment on ${esc(S.picking.name)}">
            <div class="pop-head"><b>${esc(S.picking.name)}</b><span class="path">${esc(S.picking.target)}</span></div>
            <textarea id="part-note" aria-label="What to change in ${esc(S.picking.name)}" placeholder="What should change here? e.g. thinner, a warmer brass, lower by 2 cm"></textarea>
            <div class="pop-actions"><span class="k">↵ add · esc</span><button type="button" class="btn quiet" data-pop="cancel">Cancel</button><button type="button" class="btn primary" data-pop="add">Comment</button></div>
          </div>` : ""}
      </section>

      ${e?.root ? `<section class="below">
        <div><p class="label">Parts</p><ul class="tree" aria-label="Parts of ${esc(m.name)}">${treeOf(e, comments)}</ul></div>
        <div><p class="label">Changes asked for</p>
          ${comments.length ? `<ol class="comments">${comments.map((c, i) => `
            <li><span class="num">${i + 1}</span><span>${esc(c.note)}<br><span class="what">${esc(c.target)}${c.material ? " · " + esc(c.material) : ""}</span></span>
              <span class="acts"><button type="button" class="btn quiet" data-show="${i}">Show</button>${plugin.readonly ? "" : `<button type="button" class="btn quiet" data-remove="${i}">Remove</button>`}</span></li>`).join("")}</ol>`
            : `<p class="empty">${plugin.readonly ? "None." : "Click a part in the model, or in the list, to ask for a change to it."}</p>`}
        </div>
      </section>` : ""}

      <section class="decide" aria-label="Your verdict on ${esc(m.name)}">
        <div class="choices" role="group" aria-label="Verdict">
          ${Object.entries(ACTIONS).map(([a, label]) => `<button type="button" class="choice" data-action="${a}" aria-pressed="${v.action === a}" ${ro}>${a === "favorite" ? "★ " : ""}${label} <kbd>${KEYS[a]}</kbd></button>`).join("")}
          <span class="nav"><button type="button" data-step="-1" aria-label="Previous model">← k</button><button type="button" data-step="1" aria-label="Next model">j →</button></span>
        </div>
        <textarea id="note" aria-label="Note on ${esc(m.name)}" placeholder="${v.action === "drop" ? "Why it goes (optional)" : "What to change in the next round (optional)"}" ${ro}>${esc(v.note || "")}</textarea>
      </section>
    </div></main>`;
}

let staged = -1, rounds = 0;

/* One model in the rail, redrawn on its own when it has been read. */
function pickFor(m, i) {
  const t = document.createElement("template");
  t.innerHTML = renderPick(m, i).trim();
  return t.content.firstChild;
}

function render() {
  const sheet = document.getElementById("sheet");
  const scroll = sheet ? sheet.scrollTop : 0;
  const railEl = document.querySelector(".rail");
  const railScroll = railEl ? railEl.scrollTop : 0;
  const focusNote = document.activeElement?.id === "note";
  document.getElementById("app").innerHTML = `${renderTop()}<div class="work">${renderRail()}${renderSheet()}</div>`;
  if (S.keepScroll) document.getElementById("sheet").scrollTop = scroll;
  document.querySelector(".rail").scrollTop = railScroll;
  S.keepScroll = false;
  if (S.reveal) { document.getElementById("viewer")?.scrollIntoView({ block: "nearest" }); S.reveal = false; }
  document.getElementById("canvas-slot")?.appendChild(renderer.domElement);
  if (staged !== S.sel) {
    unlightAll();
    stageFor(models[S.sel]);
    staged = S.sel;
    if (models[S.sel]?.root) { S.view = 0; goView(0); }
  }
  applyLight();
  if (S.picking) {
    const mesh = meshAt(S.picking.target);
    light(mesh, true);
    requestAnimationFrame(() => { placePins(); document.getElementById("part-note")?.focus({ preventScroll: true }); });
  }
  if (focusNote) document.getElementById("note")?.focus();
  dirty = true;
  status();
}

function meshAt(target) {
  let found = null;
  current?.root?.traverse((o) => { if (!found && o.isMesh && pathOf(o, current.root) === target) found = o; });
  return found;
}

function camNow() {
  const inv = (v) => current.root.worldToLocal(v.clone()).toArray().map((x) => +x.toFixed(4));
  return { position: inv(camera.position), target: inv(controls.target) };
}
function startComment(mesh, worldPoint, face) {
  if (plugin.readonly) return;
  S.turn = false;
  unlightAll();
  const local = current.root.worldToLocal(worldPoint.clone()).toArray().map((x) => +x.toFixed(4));
  S.picking = { target: pathOf(mesh, current.root), name: nameOf(mesh), material: materialName(mesh, face), point: local, view: camNow() };
  S.keepScroll = true;
  render();
}
function commentOnPart(target) {
  const mesh = meshAt(target);
  if (!mesh) return;
  const box = new THREE.Box3().setFromObject(mesh);
  S.reveal = true;
  startComment(mesh, box.getCenter(new THREE.Vector3()), null);
}
function addComment() {
  const note = document.getElementById("part-note")?.value.trim();
  if (!note || !S.picking) return;
  const id = P.models[S.sel].id;
  const v = verdictOf(id) || { action: null };
  S.verdicts[id] = { ...v, comments: [...(v.comments || []), { ...S.picking, note }] };
  S.picking = null;
  S.armed = false;
  S.errors = null;
  S.keepScroll = true;
  unlightAll();
  plugin.draft(S.verdicts, { flush: true });
  render();
}
function cancelComment() { S.picking = null; S.keepScroll = true; unlightAll(); render(); }

function select(i) {
  S.sel = (i + P.models.length) % P.models.length;
  S.picking = null;
  render();
  document.querySelector(`[data-pick="${S.sel}"]`)?.scrollIntoView({ block: "nearest" });
}
function setVerdict(action) {
  if (plugin.readonly) return;
  const id = P.models[S.sel].id;
  const cur = verdictOf(id);
  if (cur?.action === action) S.verdicts[id] = { ...cur, action: null };
  else {
    if (action === "favorite") for (const [other, v] of Object.entries(S.verdicts)) if (v.action === "favorite") S.verdicts[other] = { ...v, action: "keep" };
    S.verdicts[id] = { ...(cur || {}), action };
  }
  S.armed = false;
  S.errors = null;
  S.keepScroll = true;
  plugin.draft(S.verdicts, { flush: true });
  render();
}
/** The decision, or nothing while undecided candidates wait for a second
 *  press to confirm. */
function handOver() {
  const data = decisionData();
  if (data.undecided.length && !S.armed) { S.armed = true; status(); S.keepScroll = true; render(); return; }
  S.errors = null;
  return data;
}

/* Orbit on drag, comment on a click that did not move. */
let down = null;
renderer.domElement.addEventListener("pointerdown", (e) => { down = { x: e.clientX, y: e.clientY }; document.getElementById("viewer")?.classList.add("dragging"); });
window.addEventListener("pointerup", (e) => {
  document.getElementById("viewer")?.classList.remove("dragging");
  if (!down || e.target !== renderer.domElement) { down = null; return; }
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y) > 4;
  down = null;
  if (moved || plugin.readonly) return;
  const h = hit(e);
  if (h) startComment(h.object, h.point, h.face);
  else if (S.picking) cancelComment();
});
renderer.domElement.addEventListener("pointermove", (e) => {
  if (down || plugin.readonly || S.picking) return;
  const h = hit(e);
  const mesh = h?.object || null;
  if (mesh !== S.hover) { light(S.hover, false); light(mesh, true); S.hover = mesh; }
  const viewer = document.getElementById("viewer");
  viewer?.classList.toggle("over", !!mesh);
  viewer?.querySelector(".tip")?.remove();
  if (mesh && viewer) {
    const r = viewer.getBoundingClientRect();
    viewer.insertAdjacentHTML("beforeend", `<span class="tip" style="left:${e.clientX - r.left}px;top:${e.clientY - r.top}px">${esc(nameOf(mesh))}<span class="m">${esc(materialName(mesh, h.face))}</span></span>`);
  }
});
renderer.domElement.addEventListener("pointerleave", () => {
  if (!S.picking) { light(S.hover, false); S.hover = null; }
  document.querySelector("#viewer .tip")?.remove();
});

const plugin = Pinrail.connect({
  resize: "fill",
  async onInit({ review, draft }) {
    P = review.payload;
    S.verdicts = {};
    S.sel = 0; S.picking = null; staged = -1;
    const decided = review.decision?.data;
    if (decided) for (const d of decided.decisions || []) S.verdicts[d.id] = { action: d.action, note: d.note || "", comments: d.comments || [] };
    else if (draft && typeof draft === "object") S.verdicts = draft;
    models.length = 0;
    if (!controls) {
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.12;
      controls.addEventListener("change", () => { dirty = true; });
    }
    render();
    // the view is up at once; each model fills in as it is read
    const round = ++rounds;
    for (const [i, m] of P.models.entries()) {
      let entry;
      try {
        const root = await load(m);
        entry = { root, ...framed(root), stats: statsOf(root) };
      } catch (error) {
        entry = { error };
      }
      if (round !== rounds) return;
      models[i] = entry;
      if (entry.root) still(i);
      if (i === S.sel) { staged = -1; S.keepScroll = true; render(); }
      else document.querySelector(`[data-pick="${i}"]`)?.replaceWith(pickFor(m, i));
    }
  },
  onSubmitted() { render(); },
  onViolations(errors) {
    S.errors = errors;
    S.armed = false;
    S.keepScroll = true;
    render();
    plugin.status({ label: `Check: ${errors[0]?.message ?? "the decision"}` });
  },
  onCollect() { return handOver(); },
  onAppearance() { dirty = true; },
});
loop();

document.addEventListener("click", (e) => {
  if (!P) return;
  const t = e.target.closest ? e.target : null;
  if (!t) return;
  const pop = t.closest("[data-pop]");
  if (pop) return pop.dataset.pop === "add" ? addComment() : cancelComment();
  const view = t.closest("[data-view]");
  if (view) return goView(Number(view.dataset.view));
  const lightBtn = t.closest("[data-light]");
  if (lightBtn) { S.light = lightBtn.dataset.light; S.keepScroll = true; return render(); }
  const toggle = t.closest("[data-toggle]");
  if (toggle) {
    S[toggle.dataset.toggle] = !S[toggle.dataset.toggle];
    if (toggle.dataset.toggle === "wire") applyWire();
    toggle.setAttribute("aria-pressed", String(S[toggle.dataset.toggle]));
    dirty = true;
    return;
  }
  const part = t.closest("[data-part]");
  if (part) return commentOnPart(part.dataset.part);
  const show = t.closest("[data-show]");
  if (show) { const c = verdictOf(P.models[S.sel].id).comments[Number(show.dataset.show)]; if (c.view) setCamera(c.view.position, c.view.target); return; }
  const pin = t.closest("[data-pin]");
  if (pin && pin.dataset.pin !== "") { const c = verdictOf(P.models[S.sel].id).comments[Number(pin.dataset.pin)]; document.querySelectorAll(".comments li")[Number(pin.dataset.pin)]?.scrollIntoView({ block: "nearest", behavior: "smooth" }); if (c.view) setCamera(c.view.position, c.view.target); return; }
  const remove = t.closest("[data-remove]");
  if (remove) {
    const id = P.models[S.sel].id, v = verdictOf(id);
    S.verdicts[id] = { ...v, comments: v.comments.filter((_, i) => i !== Number(remove.dataset.remove)) };
    S.keepScroll = true; plugin.draft(S.verdicts, { flush: true }); return render();
  }
  const pick = t.closest("[data-pick]");
  if (pick) return select(Number(pick.dataset.pick));
  const choice = t.closest("[data-action]");
  if (choice) return setVerdict(choice.dataset.action);
  const step = t.closest("[data-step]");
  if (step) return select(S.sel + Number(step.dataset.step));
});
document.addEventListener("pointerover", (e) => {
  const part = e.target.closest?.("[data-part]");
  if (S.picking) return;
  if (part) { const mesh = meshAt(part.dataset.part); if (mesh !== S.hover) { light(S.hover, false); light(mesh, true); S.hover = mesh; } }
  else if (S.hover && !e.target.closest?.("canvas")) { light(S.hover, false); S.hover = null; }
});
document.addEventListener("input", (e) => {
  if (e.target.id !== "note" || plugin.readonly) return;
  const id = P.models[S.sel].id;
  S.verdicts[id] = { ...(verdictOf(id) || { action: null }), note: e.target.value };
  S.armed = false;
  S.errors = null;
  plugin.draft(S.verdicts);
});
document.addEventListener("keydown", (e) => {
  if (e.target.id === "part-note") {
    if (e.key === "Enter" && !e.shiftKey && !e.metaKey && !e.ctrlKey) { e.preventDefault(); addComment(); }
    if (e.key === "Escape") { e.preventDefault(); cancelComment(); }
    return;
  }
  if (!P || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.closest && e.target.closest("textarea, input")) return;
  const key = e.key.toLowerCase();
  if (key === "j") select(S.sel + 1);
  else if (key === "k") select(S.sel - 1);
  else if (key === "f") setVerdict("favorite");
  else if (key === "s") setVerdict("keep");
  else if (key === "x") setVerdict("drop");
  else if (key === "t") document.querySelector('[data-toggle="turn"]')?.click();
  else if (key === "w") document.querySelector('[data-toggle="wire"]')?.click();
  else if (key === "l") { const ks = Object.keys(LIGHTS); S.light = ks[(ks.indexOf(S.light) + 1) % ks.length]; S.keepScroll = true; render(); }
  else if (/^[1-9]$/.test(key)) goView(Number(key) - 1);
  else if (key === "escape" && S.picking) cancelComment();
  else return;
  e.preventDefault();
});

/* What the previous round decided for an item: its decision's
   `decisions: [{ id, action, note }]` and `undecided: [id]`. The previous
   round may come from an earlier release, so its shape is checked. */
function previousVerdict(previous, id) {
  const data = previous && previous.decision && previous.decision.data;
  if (!data || typeof data !== "object") return null;
  const d = (Array.isArray(data.decisions) ? data.decisions : []).find((x) => x && x.id === id);
  if (d) return { action: d.action, note: d.note || "" };
  if (Array.isArray(data.undecided) && data.undecided.includes(id)) return { action: "undecided", note: "" };
  return null;
}
</script>
