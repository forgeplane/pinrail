<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>hello review</title>
<link rel="stylesheet" href="/sdk/v1/pinrail-plugin.css">
<style>
  /* The tokens, the base and every class below come from the SDK stylesheet;
     these four rules are all this view needs of its own. */
  .choice { display: flex; gap: 8px; margin: 14px 0 10px; }
  .choice .pinrail-btn { display: inline-flex; align-items: center; gap: 6px; }
  .pinrail-errors { min-height: 16px; margin-top: 10px; }
</style>
</head>
<body>
<script src="/sdk/v1/pinrail-plugin.js"></script>
<script>
// The smallest complete pinrail plugin: one question, yes or no. The answer
// is held here; the shell hands it over.
"use strict";
const esc = Pinrail.escape;
const view = Pinrail.layout();
view.content.className = "pinrail-content pinrail-dim";
view.content.textContent = "waiting for the shell…";
let choice = null;

const plugin = Pinrail.connect({
  onInit({ draft }) {
    choice = draft && typeof draft.ok === "boolean" ? draft.ok : null;
    render();
  },
  onSubmitted() { render(); },
  onViolations(errors) {
    document.getElementById("errors").textContent = errors.map((e) => `${e.path || "/"}: ${e.message}`).join("\n");
  },
  // the app's hand-over button, or ⌘/Ctrl+Enter: the decision, or nothing yet
  onCollect() { return handOver(); },
});

/** The decision, or nothing while there is no answer to hand over. */
function handOver() {
  if (choice === null) {
    document.getElementById("errors").textContent = "Choose yes or no first.";
    return;
  }
  return { ok: choice };
}

function pick(value) {
  choice = choice === value ? null : value;
  plugin.draft({ ok: choice });
  render();
}

function render() {
  const review = plugin.review;
  const decided = review.decision && review.decision.data;
  view.content.className = "pinrail-content";
  // the redraw replaces the buttons: the one that had focus gets it back
  const focused = document.activeElement && document.activeElement.id;
  view.content.innerHTML = `<p>${esc(review.payload.message)}</p>` + (plugin.readonly
    ? (decided
      ? `<p class="pinrail-dim">Decided: <b>${decided.ok ? "yes" : "no"}</b></p>`
      // withdrawn or expired: nobody answered
      : `<p class="pinrail-dim">Closed without a decision (${esc(review.status)})</p>`)
    : `<div class="choice">
         <button type="button" class="pinrail-btn" id="yes" aria-pressed="${choice === true}">${Pinrail.icon("check")} Yes</button>
         <button type="button" class="pinrail-btn" id="no" aria-pressed="${choice === false}">${Pinrail.icon("x")} No</button>
       </div>
       <div id="errors" class="pinrail-errors" role="alert"></div>`);
  if (focused) document.getElementById(focused)?.focus();
  if (plugin.readonly) return;
  document.getElementById("yes").onclick = () => pick(true);
  document.getElementById("no").onclick = () => pick(false);
  plugin.handOverLabel(choice === null ? "Hand over" : `Hand over: ${choice ? "yes" : "no"}`);
}
</script>
</body>
</html>
