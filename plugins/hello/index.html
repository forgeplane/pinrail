<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>hello gate</title>
<style>
  /* The shell sends its theme; the SDK sets data-theme for us. */
  :root { --bg:#15181e; --field:#101216; --raised:#1a1e26; --border:#39414f; --text:#d7dce5; --muted:#67707f; --danger:#e5644e; color-scheme: dark; }
  [data-theme="light"] { --bg:#ffffff; --field:#ffffff; --raised:#f6f7f9; --border:#c5c8d1; --text:#24262c; --muted:#737987; --danger:#bc4655; color-scheme: light; }
  body { margin: 0; padding: 16px; font: 14px/1.5 system-ui, sans-serif; color: var(--text); background: var(--bg); }
  button { font: inherit; cursor: pointer; border-radius: 6px; padding: 6px 14px; border: 1px solid var(--border); background: var(--raised); color: inherit; margin-right: 6px; }
  input { font: inherit; color: inherit; background: var(--field); border: 1px solid var(--border); border-radius: 6px; padding: 6px 9px; width: 100%; box-sizing: border-box; margin: 10px 0; }
  .muted { color: var(--muted); }
  .err { color: var(--danger); font-family: ui-monospace, monospace; font-size: 12px; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="app" class="muted">waiting for the shell…</div>
<script src="/sdk/v1/wicket-plugin.js"></script>
<script>
// The smallest complete wicket plugin: one question, yes or no, with an
// optional comment. The SDK does the protocol; this file only renders.
"use strict";
const app = document.getElementById("app");
const esc = Wicket.escape;

const plugin = Wicket.connect({
  onInit({ draft }) { render(draft); },
  onSubmitted() { render(); },
  onViolations(errors) {
    document.getElementById("errors").textContent = errors.map((e) => `${e.path || "/"}: ${e.message}`).join("\n");
  },
  onCollect() { document.getElementById("yes").click(); },
});

function render(draft) {
  const gate = plugin.gate;
  const decided = gate.decision && gate.decision.data;
  app.className = "";
  app.innerHTML = `<p>${esc(gate.payload.message)}</p>` + (plugin.readonly
    ? `<p class="muted">Decided: <b>${decided && decided.ok ? "yes" : "no"}</b>${decided && decided.comment ? " — " + esc(decided.comment) : ""}</p>`
    : `<input id="comment" placeholder="comment (optional)" value="${esc(draft && draft.comment)}">
       <button id="yes">Yes</button><button id="no">No</button><div id="errors" class="err"></div>`);
  if (plugin.readonly) return;
  const comment = () => document.getElementById("comment").value.trim();
  document.getElementById("comment").oninput = () => plugin.draft({ comment: comment() });
  const submit = (ok) => plugin.submit(comment() ? { ok, comment: comment() } : { ok });
  document.getElementById("yes").onclick = () => submit(true);
  document.getElementById("no").onclick = () => submit(false);
}
</script>
</body>
</html>
