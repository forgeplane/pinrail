<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Logo review</title>
<link rel="stylesheet" href="/sdk/v1/pinrail-plugin.css">
<style>
  /* The chrome follows the app (the SDK's tokens); every specimen is painted
     in the brand's own palette, light and dark, whatever the app's theme. */
  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; }
  .shell { display: grid; grid-template-rows: auto 1fr; height: 100%; }
  .top { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 14px; padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--bg-panel); }
  .top .top-notice { flex-basis: 100%; }
  .top h1 { margin: 0; font-size: 15px; font-weight: 600; }
  .top .brand-line { color: var(--dim); font-size: 12.5px; }
  .tally { margin-left: auto; display: flex; gap: 12px; font-size: 12px; color: var(--dim); }
  .tally b { color: var(--text); font-variant-numeric: tabular-nums; }
  .work { display: grid; grid-template-columns: 300px 1fr; min-height: 0; }

  /* the rail: every mark at 16 and 32, on light and dark, to compare at a glance */
  .rail { overflow-y: auto; border-right: 1px solid var(--border); padding: 12px; display: grid; gap: 6px; align-content: start; background: var(--bg-panel); }
  .rail-label { margin: 4px 6px 6px; font: 600 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
  .pick { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px 10px; width: 100%; padding: 10px; border: 1px solid transparent; border-radius: 10px; background: none; color: var(--text); text-align: left; cursor: pointer; font: inherit; }
  .pick:hover { background: var(--bg-hover); }
  .pick[aria-current="true"] { background: var(--bg-raised); border-color: var(--border-strong); }
  .pick:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .pick-name { font-size: 13px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pick-tiles { grid-column: 1 / -1; display: flex; gap: 6px; }
  .mini { display: flex; align-items: center; gap: 8px; padding: 6px 9px; border-radius: 7px; background: var(--pb); color: var(--pi); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--pi) 10%, transparent); }

  .verdict-chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 99px; font: 600 10.5px var(--mono); letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
  .v-favorite { background: color-mix(in oklab, #d4a017 22%, transparent); color: color-mix(in oklab, #b8860b 80%, var(--text)); }
  .v-keep { background: var(--accent-bg); color: var(--accent); }
  .v-drop { background: color-mix(in oklab, var(--faint) 18%, transparent); color: var(--faint); text-decoration: line-through; }
  .v-none { color: var(--faint); background: none; padding-inline: 0; }

  /* the specimen sheet */
  .sheet { overflow-y: auto; min-height: 0; }
  .sheet-inner { max-width: 1040px; margin: 0 auto; padding: 22px 28px 0; display: grid; gap: 22px; }
  .notes { color: var(--dim); font-size: 13px; line-height: 1.6; padding: 12px 14px; border: 1px dashed var(--border); border-radius: 10px; }
  .notes p { margin: 0 0 6px; } .notes p:last-child { margin: 0; }
  .mark-head h2 { margin: 0; font-size: 22px; letter-spacing: -0.02em; }
  .mark-id { font: 12px var(--mono); color: var(--faint); }
  .previous { margin-top: 6px; font-size: 12.5px; color: var(--dim); }
  .reasoning { max-width: 68ch; color: var(--dim); font-size: 14px; line-height: 1.65; }
  .reasoning p { margin: 0 0 8px; } .reasoning p:last-child { margin: 0; }
  .label { margin: 0 0 8px; font: 600 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }

  .hero { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stage { display: grid; place-items: center; min-height: 240px; border-radius: 14px; background: var(--pb); color: var(--pi);
    background-image: linear-gradient(color-mix(in oklab, var(--pi) 7%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in oklab, var(--pi) 7%, transparent) 1px, transparent 1px);
    background-size: 20px 20px; background-position: center; }

  /* every specimen keeps a hairline edge, so a dark palette still reads on a dark app */
  .stage, .ladder-row, .place, .lockup, .mini { box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--pi) 9%, transparent); }
  /* picking a part of the mark to comment on */
  .stage { position: relative; }
  .stage.pickable svg * { cursor: crosshair; }
  .part-box { position: absolute; pointer-events: none; border: 1.5px dashed var(--accent); border-radius: 3px; }
  .part-box.hover { border-color: color-mix(in oklab, var(--pi) 70%, transparent); }
  .part-pin { position: absolute; display: grid; place-items: center; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; background: var(--accent); color: var(--pb); font: 700 11px var(--mono); pointer-events: none; box-shadow: 0 0 0 2px var(--pb); }
  .composer { display: grid; gap: 8px; padding: 12px 14px; border: 1px solid var(--accent); border-radius: 12px; background: var(--bg-raised); }
  .composer-head { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--dim); }
  .composer-head code { font: 12px var(--mono); color: var(--text); }
  .composer textarea { width: 100%; min-height: 54px; resize: vertical; padding: 9px 11px; border-radius: 9px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font: 13.5px/1.5 var(--sans); box-sizing: border-box; }
  .composer-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .composer-actions button, .part-list button { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--bg); color: var(--text); font: 600 12.5px var(--sans); cursor: pointer; }
  .composer-actions .add { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .parts-hint { margin: -12px 0 0; font-size: 12.5px; color: var(--faint); }
  .part-list { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .part-list li { display: grid; grid-template-columns: auto 1fr auto; align-items: start; gap: 10px; padding: 9px 12px; border-radius: 10px; background: var(--bg-raised); border: 1px solid var(--border); font-size: 13.5px; }
  .part-list .num { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--pin); color: #fff; font: 700 11px var(--mono); }
  .part-list .what { font: 11.5px var(--mono); color: var(--faint); }
  .part-list button { padding: 3px 9px; font-weight: 500; color: var(--dim); }
  .mk { display: inline-block; flex: none; line-height: 0; }
  .mk svg { width: 100%; height: 100%; display: block; overflow: visible; }

  .ladder { display: grid; gap: 8px; }
  .ladder-row { display: flex; align-items: flex-end; gap: 22px; padding: 16px 18px; border-radius: 12px; background: var(--pb); color: var(--pi); overflow-x: auto; }
  .rung { display: grid; justify-items: center; gap: 7px; }
  .rung .size { font: 10px var(--mono); color: var(--pm); }

  .places { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .place { display: grid; gap: 12px; padding: 16px; border-radius: 12px; background: var(--pb); color: var(--pi); }

  /* a browser's tab strip */
  .tabs { display: flex; align-items: flex-end; gap: 2px; padding: 8px 10px 0; border-radius: 9px 9px 0 0; background: color-mix(in oklab, var(--ps) 82%, var(--pi)); overflow: hidden; }
  .tab { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 7px 12px; border-radius: 8px 8px 0 0; font: 12.5px var(--sans); color: var(--pm); }
  .tab.active { background: var(--pb); color: var(--pi); flex: 0 1 auto; }
  .tab .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tab .dot { width: 14px; height: 14px; border-radius: 4px; background: color-mix(in oklab, var(--pm) 35%, transparent); flex: none; }
  .url { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--pb); border-radius: 0 0 9px 9px; font: 12px var(--mono); color: var(--pm); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--pi) 8%, transparent); }
  .url .bar { flex: 1; display: flex; align-items: center; gap: 8px; padding: 4px 10px; border-radius: 6px; background: color-mix(in oklab, var(--ps) 80%, transparent); color: var(--pi); }

  /* the macOS menu bar: marks drawn in one colour, as template images are */
  .menubar { display: flex; align-items: center; justify-content: flex-end; gap: 14px; padding: 5px 12px; border-radius: 8px; font: 600 12.5px var(--sans); }
  .menubar.light { background: #ececec; color: #1d1d1f; }
  .menubar.dark { background: #2c2c2e; color: #f5f5f7; }
  .menubar .mb-item { display: inline-flex; align-items: center; gap: 5px; --accent: currentColor; }
  .menubar .ghost { opacity: .5; font-weight: 500; }

  .icons { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
  .app-icon { display: grid; place-items: center; width: 96px; height: 96px; border-radius: 22px; background: linear-gradient(160deg, var(--ps), var(--pb)); color: var(--pi); box-shadow: 0 16px 28px -18px rgba(0,0,0,.55), inset 0 0 0 1px color-mix(in oklab, var(--pi) 10%, transparent); }
  .dock { display: flex; align-items: flex-end; gap: 8px; padding: 8px 10px; border-radius: 16px; background: color-mix(in oklab, var(--ps) 75%, transparent); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--pi) 8%, transparent); }
  .dock .app-icon { width: 44px; height: 44px; border-radius: 10px; box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--pi) 10%, transparent); }
  .dock .other { width: 44px; height: 44px; border-radius: 10px; background: color-mix(in oklab, var(--pm) 22%, transparent); }

  .lockup { display: flex; align-items: center; gap: 12px; padding: 18px 20px; border-radius: 12px; background: var(--pb); color: var(--pi); flex-wrap: wrap; }
  .wordmark { font-size: 34px; line-height: 1; letter-spacing: -0.035em; }
  .wordmark .acc { color: var(--accent); }
  .tagline { flex-basis: 100%; margin-top: 2px; font: 13px var(--sans); color: var(--pm); }

  /* the verdict, kept in reach at the foot of the sheet */
  .decide { position: sticky; bottom: 0; margin-top: 4px; margin-bottom: 18px; display: grid; gap: 10px; padding: 14px 16px; border: 1px solid var(--border-strong); border-radius: 14px; background: color-mix(in oklab, var(--bg-raised) 94%, transparent); backdrop-filter: blur(8px); box-shadow: 0 -12px 30px -24px rgba(0,0,0,.5); }
  .choices { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .choice { display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 9px; border: 1px solid var(--border-strong); background: var(--bg); color: var(--text); font: 600 13px var(--sans); cursor: pointer; }
  .choice kbd { font: 11px var(--mono); color: var(--faint); }
  .choice:hover:not(:disabled) { border-color: var(--text); }
  .choice:focus-visible, .nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .choice[aria-pressed="true"][data-action="favorite"] { background: color-mix(in oklab, #d4a017 20%, var(--bg)); border-color: #c9971a; }
  .choice[aria-pressed="true"][data-action="keep"] { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
  .choice[aria-pressed="true"][data-action="drop"] { background: color-mix(in oklab, var(--faint) 16%, var(--bg)); border-color: var(--faint); color: var(--dim); }
  .choice:disabled { opacity: .55; cursor: default; }
  .nav { margin-left: auto; display: flex; gap: 6px; }
  .nav button { padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); background: none; color: var(--dim); font: 12px var(--sans); cursor: pointer; }
  .decide textarea { width: 100%; min-height: 44px; resize: vertical; padding: 9px 11px; border-radius: 9px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font: 13.5px/1.5 var(--sans); box-sizing: border-box; }
  .decide textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .broken { display: grid; place-items: center; width: 100%; height: 100%; font: 10px var(--mono); color: var(--danger); }

  @media (max-width: 760px) {
    .work { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .rail { grid-auto-flow: column; grid-auto-columns: 220px; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--border); }
    .hero, .places { grid-template-columns: 1fr; }
    .sheet-inner { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: no-preference) { .pick, .choice { transition: background .15s, border-color .15s; } }
</style>
</head>
<body>
<script src="/sdk/v1/pinrail-plugin.js"></script>
<div class="shell" id="app"><div class="top"><h1>Loading…</h1></div></div>
<script>
"use strict";
const esc = Pinrail.escape;
const ACTIONS = { favorite: "Favourite", keep: "Keep", drop: "Drop" };
const KEYS = { favorite: "f", keep: "s", drop: "x" };
const S = { sel: 0, verdicts: {}, armed: false, errors: null, keepScroll: false, picking: null };
let P = null;          // the payload
let clean = {};        // mark id -> sanitized svg markup

const DEFAULT_PALETTE = {
  light: { background: "#ffffff", surface: "#f4f4f5", ink: "#18181b", muted: "#71717a", accent: "#2563eb" },
  dark: { background: "#18181b", surface: "#27272a", ink: "#fafafa", muted: "#a1a1aa", accent: "#60a5fa" },
};

/* An agent's SVG, made safe to draw inline: no scripts, no foreign content,
   no styles that could reach the page, no event handlers, and no links but
   to its own fragments. What cannot be parsed is reported, not drawn. */
function sanitize(markup) {
  const doc = new DOMParser().parseFromString(markup, "image/svg+xml");
  const svg = doc.documentElement;
  if (!svg || svg.nodeName.toLowerCase() !== "svg" || doc.querySelector("parsererror")) return null;
  svg.querySelectorAll("script, foreignObject, style, iframe, a").forEach((n) => n.remove());
  for (const el of [svg, ...svg.querySelectorAll("*")]) {
    for (const attr of [...el.attributes]) {
      const name = attr.name.toLowerCase();
      const value = attr.value.trim();
      if (name.startsWith("on")) el.removeAttribute(attr.name);
      else if ((name === "href" || name === "xlink:href") && !value.startsWith("#")) el.removeAttribute(attr.name);
      else if (/url\(\s*['"]?(?!#)/i.test(value)) el.removeAttribute(attr.name);
    }
  }
  svg.removeAttribute("width");
  svg.removeAttribute("height");
  svg.setAttribute("aria-hidden", "true");
  svg.setAttribute("focusable", "false");
  return new XMLSerializer().serializeToString(svg);
}

const mark = (m, size) =>
  `<span class="mk" style="width:${size}px;height:${size}px">${clean[m.id] ?? '<span class="broken">svg?</span>'}</span>`;

/* A palette as the custom properties a specimen reads: --pb background,
   --ps surface, --pi ink, --pm muted, --accent the mark's accent. */
function vars(p) {
  return `--pb:${p.background};--ps:${p.surface || p.background};--pi:${p.ink};--pm:${p.muted || p.ink};--accent:${p.accent}`;
}
const palette = () => ({ light: { ...DEFAULT_PALETTE.light, ...(P.palette?.light || {}) }, dark: { ...DEFAULT_PALETTE.dark, ...(P.palette?.dark || {}) } });

function wordmark() {
  const text = P.brand.wordmark || P.brand.name;
  const parts = esc(text).replace(/\[([^\]]+)\]/g, '<span class="acc">$1</span>');
  const font = P.brand.wordmark_font ? `font-family:${esc(P.brand.wordmark_font)};` : "";
  return `<span class="wordmark" style="${font}font-weight:${P.brand.wordmark_weight || 800}">${parts}</span>`;
}

const verdictOf = (id) => S.verdicts[id] || null;
/* The verdict as the decision will carry it: a mark with part comments and no verdict is kept. */
const shown = (v) => v && !v.action && (v.comments || []).length ? { ...v, action: "keep" } : v;
const chip = (v) => v && v.action && ACTIONS[v.action]
  ? `<span class="verdict-chip v-${v.action}">${v.action === "favorite" ? "★ " : ""}${ACTIONS[v.action]}</span>`
  : `<span class="verdict-chip v-none">—</span>`;

function decisionData() {
  const decisions = [], undecided = [];
  for (const m of P.marks) {
    const v = verdictOf(m.id);
    const note = v && v.note ? v.note.trim() : "";
    const comments = (v && v.comments) || [];
    const action = (v && v.action) || (comments.length ? "keep" : null);
    if (!action) { undecided.push(m.id); continue; }
    const d = { id: m.id, action };
    if (note) d.note = note;
    if (comments.length) d.comments = comments.map(({ target, tag, markup, note }) => ({ target, tag, markup, note }));
    decisions.push(d);
  }
  return { decisions, undecided };
}

function status() {
  if (plugin.readonly) return;
  const d = decisionData();
  const fav = d.decisions.find((x) => x.action === "favorite");
  const kept = d.decisions.filter((x) => x.action === "keep").length;
  const dropped = d.decisions.filter((x) => x.action === "drop").length;
  const parts = [];
  if (fav) parts.push(`★ ${P.marks.find((m) => m.id === fav.id)?.name ?? fav.id}`);
  if (kept) parts.push(`${kept} kept`);
  if (dropped) parts.push(`${dropped} dropped`);
  const label = S.armed ? `Hand over with ${d.undecided.length} undecided` : parts.length ? `Hand over: ${parts.join(", ")}` : "Hand over";
  plugin.status({ label });
}

function renderTop() {
  const d = decisionData();
  const count = (a) => d.decisions.filter((x) => x.action === a).length;
  return `<div class="top">
      <h1>${esc(plugin.review.title || "Logo review")}</h1>
      <span class="brand-line">${esc(P.brand.name)}${P.brand.tagline ? " · " + esc(P.brand.tagline) : ""}</span>
      <div class="tally" aria-live="polite">
        <span><b>${count("favorite")}</b> favourite</span><span><b>${count("keep")}</b> kept</span><span><b>${count("drop")}</b> dropped</span><span><b>${d.undecided.length}</b> undecided</span>
      </div>
      ${notice()}
    </div>`;
}

// what the app refused, every refusal, or why a first hand-over waits: the
// shell's button label is easy to miss and holds one message
function notice() {
  if (S.errors && S.errors.length) {
    return `<div class="notice danger top-notice" role="alert">${S.errors.map((e) => `${esc(e.path || "/")}: ${esc(e.message)}`).join("<br>")}</div>`;
  }
  if (S.armed) {
    const n = decisionData().undecided.length;
    return `<div class="notice warn top-notice" role="status" data-armed>${n} undecided. Hand over again to send ${n === 1 ? "it" : "them"} back undecided.</div>`;
  }
  return "";
}

function renderRail() {
  const pal = palette();
  return `<nav class="rail" aria-label="Marks">
      <p class="rail-label">${P.marks.length} marks · 16 and 32 px</p>
      ${P.marks.map((m, i) => `
        <button type="button" class="pick" data-pick="${i}" aria-current="${i === S.sel}">
          <span class="pick-name">${esc(m.name)}</span>${chip(shown(verdictOf(m.id)))}
          <span class="pick-tiles">
            <span class="mini" style="${vars(pal.light)}">${mark(m, 16)}${mark(m, 32)}</span>
            <span class="mini" style="${vars(pal.dark)}">${mark(m, 16)}${mark(m, 32)}</span>
          </span>
        </button>`).join("")}
    </nav>`;
}

function renderSheet() {
  const m = P.marks[S.sel];
  const pal = palette();
  const v = verdictOf(m.id) || {};
  const prev = previousVerdict(plugin.previous, m.id);
  const ro = plugin.readonly ? "disabled" : "";
  const both = (fn) => `${fn(pal.light, "light")}${fn(pal.dark, "dark")}`;
  const sizes = [16, 20, 24, 32, 48, 64, 128];
  const host = `${P.brand.name.toLowerCase().replace(/[^a-z0-9]+/g, "")}.dev`;
  const tab = (p) => `<div style="${vars(p)}">
      <div class="tabs"><span class="tab"><span class="dot"></span><span class="t">Pull requests</span></span><span class="tab active">${mark(m, 16)}<span class="t">${esc(P.brand.name)} · Inbox</span></span><span class="tab"><span class="dot"></span><span class="t">Docs</span></span></div>
      <div class="url"><span class="bar">${mark(m, 14)}<span>${esc(host)}</span></span></div>
    </div>`;
  return `<main class="sheet" id="sheet" aria-labelledby="mark-name"><div class="sheet-inner">
      ${P.notes ? `<div class="notes">${Pinrail.markdown(P.notes)}</div>` : ""}
      <header class="mark-head">
        <h2 id="mark-name">${esc(m.name)}</h2>
        <span class="mark-id">${esc(m.id)} · ${S.sel + 1} of ${P.marks.length}</span>
        ${prev ? `<div class="previous">Last round: ${chip(prev)} ${prev.note ? "— " + esc(prev.note) : ""}</div>` : ""}
      </header>
      ${m.reasoning ? `<div class="reasoning">${Pinrail.markdown(m.reasoning)}</div>` : ""}

      <section class="hero" aria-label="The mark, large">
        ${both((p, t) => `<div class="stage ${plugin.readonly ? "" : "pickable"}" style="${vars(p)}" data-stage="${t}">${mark(m, 168)}</div>`)}
      </section>
      ${plugin.readonly ? "" : `<p class="parts-hint">Click a part of the mark to ask for a change to it.</p>`}
      ${S.picking ? `<div class="composer" id="composer">
          <div class="composer-head">Comment on <code>${esc(S.picking.tag)} ${S.picking.n}</code> of ${esc(m.name)}</div>
          <textarea id="part-note" aria-label="What to change in this part" placeholder="What should change here? e.g. thinner, a little more to the left, rounded ends"></textarea>
          <div class="composer-actions"><button type="button" data-part="cancel">Cancel</button><button type="button" class="add" data-part="add">Add comment</button></div>
        </div>` : ""}
      ${(v.comments || []).length ? `<ol class="part-list" aria-label="Comments on parts" style="--pin:${pal.light.accent}">${v.comments.map((c, i) => `
          <li><span class="num">${i + 1}</span><span>${esc(c.note)}<br><span class="what">${esc(c.tag)} · ${esc(c.target)}</span></span>${plugin.readonly ? "" : `<button type="button" data-remove-part="${i}" aria-label="Remove comment ${i + 1}">Remove</button>`}</li>`).join("")}
        </ol>` : ""}

      <section class="ladder" aria-label="Sizes">
        <p class="label">Sizes</p>
        ${both((p) => `<div class="ladder-row" style="${vars(p)}">${sizes.map((s) => `<div class="rung">${mark(m, s)}<span class="size">${s}</span></div>`).join("")}</div>`)}
      </section>

      <section aria-label="In a browser">
        <p class="label">Browser tab</p>
        <div class="places">${both((p) => tab(p))}</div>
      </section>

      <section aria-label="On the desktop">
        <p class="label">App icon, Dock and menu bar</p>
        <div class="places">
          ${both((p, t) => `<div class="place" style="${vars(p)}">
              <div class="icons"><div class="app-icon">${mark(m, 60)}</div><div class="dock"><span class="other"></span><div class="app-icon">${mark(m, 28)}</div><span class="other"></span></div></div>
              <div class="menubar ${t}"><span class="ghost">Wi-Fi</span><span class="mb-item">${mark(m, 16)}<span>3</span></span><span class="ghost">Wed 10:00</span></div>
            </div>`)}
        </div>
      </section>

      <section aria-label="With the wordmark">
        <p class="label">Lockup</p>
        <div class="places">${both((p) => `<div class="lockup" style="${vars(p)}">${mark(m, 40)}${wordmark()}${P.brand.tagline ? `<span class="tagline">${esc(P.brand.tagline)}</span>` : ""}</div>`)}</div>
      </section>

      <section class="decide" aria-label="Your verdict on ${esc(m.name)}">
        <div class="choices" role="group" aria-label="Verdict">
          ${Object.entries(ACTIONS).map(([a, label]) => `<button type="button" class="choice" data-action="${a}" aria-pressed="${v.action === a}" ${ro}>${a === "favorite" ? "★ " : ""}${label} <kbd>${KEYS[a]}</kbd></button>`).join("")}
          <span class="nav"><button type="button" data-step="-1" aria-label="Previous mark">← k</button><button type="button" data-step="1" aria-label="Next mark">j →</button></span>
        </div>
        <textarea id="note" aria-label="Note on ${esc(m.name)}" placeholder="${v.action === "drop" ? "Why it goes (optional)" : "What to change in the next round (optional)"}" ${ro}>${esc(v.note || "")}</textarea>
      </section>
    </div></main>`;
}

function render() {
  const sheet = document.getElementById("sheet");
  const scroll = sheet ? sheet.scrollTop : 0;
  const railEl = document.querySelector(".rail");
  const railScroll = railEl ? railEl.scrollTop : 0;
  const focusNote = document.activeElement?.id === "note";
  document.getElementById("app").innerHTML = `${renderTop()}<div class="work">${renderRail()}${renderSheet()}</div>`;
  if (S.keepScroll) document.getElementById("sheet").scrollTop = scroll;
  document.querySelector(".rail").scrollTop = railScroll;
  S.keepScroll = false;
  if (focusNote) document.getElementById("note")?.focus();
  drawParts();
  if (S.picking) document.getElementById("part-note")?.focus({ preventScroll: true });
  status();
}

/* The shapes a person can point at: every drawn element, not containers. */
const SHAPES = "path, rect, circle, ellipse, line, polyline, polygon, text, use";

/* An element's path in the mark's svg: tags and positions among siblings of
   the same tag, which the agent can follow in its own source. */
function pathOf(el) {
  const parts = [];
  for (let node = el; node && node.tagName.toLowerCase() !== "svg"; node = node.parentElement) {
    const tag = node.tagName.toLowerCase();
    const same = [...node.parentElement.children].filter((c) => c.tagName.toLowerCase() === tag);
    parts.unshift(`${tag}:nth-of-type(${same.indexOf(node) + 1})`);
  }
  return ["svg", ...parts].join(" > ");
}
const shapesOf = (svg) => [...svg.querySelectorAll(SHAPES)];
const boxIn = (stage, el) => {
  const s = stage.getBoundingClientRect(), r = el.getBoundingClientRect();
  return { left: r.left - s.left, top: r.top - s.top, width: r.width, height: r.height };
};

function drawParts() {
  const m = P.marks[S.sel];
  const comments = verdictOf(m.id)?.comments || [];
  for (const stage of document.querySelectorAll(".stage")) {
    const svg = stage.querySelector("svg");
    if (!svg) continue;
    const at = (target) => shapesOf(svg).find((el) => pathOf(el) === target);
    comments.forEach((c, i) => {
      const el = at(c.target);
      if (!el) return;
      const b = boxIn(stage, el);
      stage.insertAdjacentHTML("beforeend", `<span class="part-box" style="left:${b.left - 3}px;top:${b.top - 3}px;width:${b.width + 6}px;height:${b.height + 6}px"></span><span class="part-pin" style="left:${b.left}px;top:${b.top}px">${i + 1}</span>`);
    });
    if (S.picking) {
      const el = at(S.picking.target);
      if (el) {
        const b = boxIn(stage, el);
        stage.insertAdjacentHTML("beforeend", `<span class="part-box" style="left:${b.left - 3}px;top:${b.top - 3}px;width:${b.width + 6}px;height:${b.height + 6}px"></span>`);
      }
    }
  }
}

function pickPart(el) {
  const svg = el.closest("svg");
  const shapes = shapesOf(svg);
  S.picking = { target: pathOf(el), tag: el.tagName.toLowerCase(), n: shapes.indexOf(el) + 1, markup: el.outerHTML.replace(/ xmlns="[^"]*"/g, "") };
  S.keepScroll = true;
  render();
}

function addPart() {
  const note = document.getElementById("part-note")?.value.trim();
  if (!note || !S.picking) return;
  const id = P.marks[S.sel].id;
  const v = verdictOf(id) || { action: null };
  S.verdicts[id] = { ...v, comments: [...(v.comments || []), { target: S.picking.target, tag: S.picking.tag, markup: S.picking.markup, note }] };
  S.picking = null;
  S.armed = false;
  S.errors = null;
  S.keepScroll = true;
  plugin.draft(S.verdicts);
  render();
}

function select(i) {
  S.sel = (i + P.marks.length) % P.marks.length;
  S.picking = null;
  render();
  document.querySelector(`[data-pick="${S.sel}"]`)?.scrollIntoView({ block: "nearest" });
}

function setVerdict(action) {
  if (plugin.readonly) return;
  const id = P.marks[S.sel].id;
  const current = verdictOf(id);
  if (current?.action === action) S.verdicts[id] = { ...current, action: null };
  else {
    // one favourite at a time: the last one steps down to the shortlist
    if (action === "favorite") for (const [other, v] of Object.entries(S.verdicts)) if (v.action === "favorite") S.verdicts[other] = { ...v, action: "keep" };
    S.verdicts[id] = { ...(current || {}), action };
  }
  S.armed = false;
  S.errors = null;
  S.keepScroll = true;
  plugin.draft(S.verdicts);
  render();
}

/** The decision, or nothing while undecided candidates wait for a second
 *  press to confirm. */
function handOver() {
  const data = decisionData();
  if (data.undecided.length && !S.armed) { S.armed = true; status(); S.keepScroll = true; render(); return; }
  S.errors = null;
  return data;
}

const plugin = Pinrail.connect({
  resize: "fill",
  onInit({ review, draft }) {
    P = review.payload;
    clean = {};
    for (const m of P.marks) clean[m.id] = sanitize(m.svg);
    S.verdicts = {};
    S.sel = 0;
    S.picking = null;
    const decided = review.decision?.data;
    if (decided) for (const d of decided.decisions || []) S.verdicts[d.id] = { action: d.action, note: d.note || "", comments: d.comments || [] };
    else if (draft && typeof draft === "object") S.verdicts = draft;
    render();
  },
  onSubmitted() { render(); },
  onViolations(errors) {
    S.errors = errors;
    S.armed = false;
    S.keepScroll = true;
    render();
    plugin.status({ label: `Check: ${errors[0]?.message ?? "the decision"}` });
  },
  onCollect() { return handOver(); },
});

document.addEventListener("click", (e) => {
  const shape = !plugin.readonly && e.target.closest && e.target.closest(".stage svg *");
  if (shape) {
    const el = shape.matches(SHAPES) ? shape : shape.closest(SHAPES);
    if (el) return pickPart(el);
  }
  const part = e.target.closest("[data-part]");
  if (part) {
    if (part.dataset.part === "add") return addPart();
    S.picking = null; S.keepScroll = true; return render();
  }
  const remove = e.target.closest("[data-remove-part]");
  if (remove) {
    const id = P.marks[S.sel].id, v = verdictOf(id);
    S.verdicts[id] = { ...v, comments: v.comments.filter((_, i) => i !== Number(remove.dataset.removePart)) };
    S.keepScroll = true; plugin.draft(S.verdicts); return render();
  }
  const pick = e.target.closest("[data-pick]");
  if (pick) return select(Number(pick.dataset.pick));
  const choice = e.target.closest("[data-action]");
  if (choice) return setVerdict(choice.dataset.action);
  const step = e.target.closest("[data-step]");
  if (step) return select(S.sel + Number(step.dataset.step));
});
document.addEventListener("pointerover", (e) => {
  document.querySelectorAll(".part-box.hover").forEach((b) => b.remove());
  if (plugin.readonly || !e.target.closest) return;
  const el = e.target.closest(".stage svg *");
  const shape = el && (el.matches(SHAPES) ? el : el.closest(SHAPES));
  if (!shape) return;
  const stage = shape.closest(".stage"), b = boxIn(stage, shape);
  stage.insertAdjacentHTML("beforeend", `<span class="part-box hover" style="left:${b.left - 3}px;top:${b.top - 3}px;width:${b.width + 6}px;height:${b.height + 6}px"></span>`);
});

document.addEventListener("input", (e) => {
  if (e.target.id !== "note" || plugin.readonly) return;
  const id = P.marks[S.sel].id;
  S.verdicts[id] = { ...(verdictOf(id) || { action: null }), note: e.target.value };
  S.armed = false;
  S.errors = null;
  plugin.draft(S.verdicts);
});
document.addEventListener("keydown", (e) => {
  if (e.target.id === "part-note") {
    if (e.key === "Enter" && !e.shiftKey && !e.metaKey && !e.ctrlKey) { e.preventDefault(); addPart(); }
    if (e.key === "Escape") { e.preventDefault(); S.picking = null; S.keepScroll = true; render(); }
    return;
  }
  if (!P || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.closest && e.target.closest("textarea, input")) return;
  const key = e.key.toLowerCase();
  if (key === "j") select(S.sel + 1);
  else if (key === "k") select(S.sel - 1);
  else if (key === "f") setVerdict("favorite");
  else if (key === "s") setVerdict("keep");
  else if (key === "x") setVerdict("drop");
  else return;
  e.preventDefault();
});

/* What the previous round decided for an item: its decision's
   `decisions: [{ id, action, note }]` and `undecided: [id]`. The previous
   round may come from an earlier release, so its shape is checked. */
function previousVerdict(previous, id) {
  const data = previous && previous.decision && previous.decision.data;
  if (!data || typeof data !== "object") return null;
  const d = (Array.isArray(data.decisions) ? data.decisions : []).find((x) => x && x.id === id);
  if (d) return { action: d.action, note: d.note || "" };
  if (Array.isArray(data.undecided) && data.undecided.includes(id)) return { action: "undecided", note: "" };
  return null;
}
</script>
</body>
