# A tag named plugin-<name>-v<version> (plugin-review-v1.2.0) builds that
# plugin and attaches its bundle, <name>-<version>.zip, to a GitHub release
# of the same tag. Installing it then needs no toolchain: download the zip
# and install it from disk.
#
#   pinrail plugins install ~/Downloads/review-1.2.0.zip
#
# The manifest's version must be the tag's, or the release fails.
name: plugin release

on:
  push:
    tags: ["plugin-*-v*"]

# read-only, unless a job asks for more
permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # a release builds from nothing a cache could have changed
          package-manager-cache: false
      # the name becomes a path: a plugin's name, and a folder under plugins/
      - name: Name and version from the tag
        run: |
          ref="${GITHUB_REF_NAME#plugin-}"
          name="${ref%-v*}"
          [[ "$name" =~ ^[a-z][a-z0-9_-]*$ && -d "plugins/$name" ]] || { echo "the tag names no plugin: $name"; exit 1; }
          echo "PLUGIN=$name" >> "$GITHUB_ENV"
          echo "VERSION=${ref##*-v}" >> "$GITHUB_ENV"
      - name: Build when the package has a build script
        working-directory: plugins/${{ env.PLUGIN }}
        run: |
          if [ -f package.json ] && node -e 'process.exit(require("./package.json").scripts?.build ? 0 : 1)'; then
            npm ci && npm run build
          fi
          declared=$(node -e 'process.stdout.write(require("./manifest.json").version.trim())')
          test "$declared" = "$VERSION" || { echo "manifest says $declared, tag says $VERSION"; exit 1; }
      - name: The bundle, and nothing else
        working-directory: plugins/${{ env.PLUGIN }}
        run: |
          # Lucide's icons carry their licence with them
          if [ -d view/icons ]; then cp ../../pinrail-plugin/licenses/lucide-icons.txt view/icons/LICENSE; fi
          zip -r "../../$PLUGIN-$VERSION.zip" . \
            -x "node_modules/*" "src/*" "tests/*" "test/*" "fixtures/*" ".*" "*/.*" \
               "package.json" "package-lock.json" "pnpm-lock.yaml" "yarn.lock" "bun.lockb" \
               "tsconfig*.json" "vite.config.*" "vitest.config.*" "playwright.config.*"
      # the app's updater and the download links read this repository's
      # latest release, which must stay the app's
      - name: Release the bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$PLUGIN-$VERSION.zip" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --notes "" --latest=false
