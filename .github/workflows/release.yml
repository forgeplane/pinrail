# A tag v<version> (v0.1.0) releases the desktop app: the full CI runs first,
# then a draft GitHub Release gets a universal macOS build (.dmg, and the
# .app.tar.gz the action adds) and Linux builds (.AppImage, .deb, .rpm), each
# with the wicket CLI inside (/usr/bin/wicket in the Linux packages, beside the
# app as wicket-desktop; wicket-cli in the macOS bundle) and the third-party
# notices as THIRD_PARTY_NOTICES.txt, a build provenance attestation for each
# installer, and a SHA256SUMS file.
# The draft is published by hand after a smoke test. The tag has to name
# the version in desktop/Cargo.toml and tauri.conf.json.
#
# The macOS build is signed with the Developer ID certificate and notarized
# with an App Store Connect key, both from the `release` environment, which
# only tags can read. A build without those secrets is unsigned and still
# succeeds, so a manual run on a fork needs nothing
# (agent-docs/release-checklist.md §1 and §2).
#
# Run it by hand (Actions › release › Run workflow) to build without
# releasing: the bundles are kept as workflow artifacts.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      id: ${{ steps.release.outputs.id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the version
        id: version
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          workspace=$(sed -n 's/^version = "\(.*\)"/\1/p' desktop/Cargo.toml | head -1)
          app=$(jq -r .version desktop/app/src-tauri/tauri.conf.json)
          # the CLI ships inside the bundle and answers --version itself
          cli=$(sed -n 's/^version = "\(.*\)"/\1/p' cli/Cargo.toml | head -1)
          for found in "$workspace" "$app" "$cli"; do
            test "$found" = "$tagged" || { echo "the tag says $tagged, desktop/Cargo.toml says $workspace, tauri.conf.json says $app, cli/Cargo.toml says $cli"; exit 1; }
          done
          echo "version=$tagged" >> "$GITHUB_OUTPUT"
      - name: Create the draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          The macOS build is signed and notarized by Apple, so it opens without a warning.

          Verify a download with `gh attestation verify <file> --repo ${{ github.repository }}`, or against `SHA256SUMS`.
          EOF
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Wicket ${{ steps.version.outputs.version }}" --notes-file notes.md
          id=$(gh api "repos/${{ github.repository }}/releases" --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id")
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: [test, draft]
    # a tag builds into its draft; a manual run builds with nothing to release
    if: always() && needs.test.result == 'success' && (needs.draft.result == 'success' || needs.draft.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            runner: macos-latest
            triple: universal-apple-darwin
            args: --target universal-apple-darwin --config src-tauri/tauri.release.conf.json
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: |
              desktop/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: linux
            # the oldest supported Ubuntu, so the AppImage runs on older glibc
            runner: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            # wicket-desktop and /usr/bin/wicket: the command is the CLI's
            args: --config src-tauri/tauri.release.conf.json --config src-tauri/tauri.release.linux.conf.json
            targets: ""
            bundles: |
              desktop/target/release/bundle/appimage/*.AppImage
              desktop/target/release/bundle/deb/*.deb
              desktop/target/release/bundle/rpm/*.rpm
    runs-on: ${{ matrix.runner }}
    # notarization waits on Apple, so a stuck one fails within the hour
    # rather than holding a runner for the default six
    timeout-minutes: 60
    # A tag builds in the `release` environment, which holds the Apple
    # secrets and admits tags only. A manual run takes no environment, so it
    # reads no secrets and builds unsigned, which is what it is for.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    env:
      # a step cannot read a secret in its condition, only an environment
      # value: this says whether this run has what it takes to sign
      SIGNED: ${{ secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_API_KEY_P8 != '' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Plain apt, refreshed first: a release is worth the half minute. The
      # caching action installs against whatever index the image shipped
      # with, and a superseded version there fails the whole build on a 404.
      # libgtk-3-dev is named because 22.04's webkit package does not bring
      # it, and the build needs gdk-3.0 through pkg-config.
      - name: Install the Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/app/package-lock.json
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          # the version mise.toml pins
          toolchain: "1.98.1"
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            desktop
            cli
          key: release-${{ matrix.name }}
          cache-on-failure: true
          # a cache saved under a tag is visible to that tag only; a manual
          # run on main saves one every tag can restore
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install the shell's dependencies
        working-directory: desktop/app
        run: npm ci
      # the release build writes the third-party notices it bundles
      - uses: taiki-e/install-action@76c2e6406e52637deed7160d77bded76bd83e06e # v2.87.14
        with:
          tool: cargo-about
      # the CLI ships inside the bundle as the wicket-cli sidecar
      - name: Build the CLI
        working-directory: desktop/app
        run: npm run cli:build -- ${{ matrix.triple }}
      # a tag that cannot sign is a mistake, not an unsigned release
      - name: Refuse to build a tag that cannot be signed
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v') && env.SIGNED != 'true'
        run: |
          echo "the release environment has no Apple secrets, so this tag would ship unsigned" >&2
          exit 1
      # notarization takes the key as a file; the secret carries it base64
      - name: Write the notarization key (macOS)
        id: notarize
        if: runner.os == 'macOS' && env.SIGNED == 'true'
        env:
          P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/notarize"
          printf %s "$P8" | base64 --decode > "$RUNNER_TEMP/notarize/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/notarize/AuthKey.p8"
          echo "path=$RUNNER_TEMP/notarize/AuthKey.p8" >> "$GITHUB_OUTPUT"
      - name: Build and upload the bundles
        id: build
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # signing: the certificate and its key, into a keychain the action makes
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # notarization: the App Store Connect key, by id, issuer and file
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ steps.notarize.outputs.path }}
        with:
          projectPath: desktop/app
          tauriScript: npx tauri
          # a flaky upload or a notarization hiccup costs a retry, not a release
          retryAttempts: 3
          args: ${{ matrix.args }}
          releaseId: ${{ needs.draft.outputs.id }}
          uploadUpdaterJson: false
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: wicket-[platform]-[arch]-[bundle]
      # what the person downloading gets: a signature that checks out, and
      # a notarization ticket stapled to the bundle
      - name: Check the signature and the notarization (macOS)
        if: runner.os == 'macOS' && env.SIGNED == 'true'
        run: |
          app=$(find desktop/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          test -n "$app" || { echo "no .app was built"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dvv "$app" 2>&1 | grep -E 'Authority|TeamIdentifier'
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$app"
      # Attestations are refused to a private repository on the free plan,
      # so they wait for the repository to be public rather than failing a
      # signed, notarized build over a signature nobody can check yet.
      - name: Attest the build provenance
        if: startsWith(github.ref, 'refs/tags/v') && !github.event.repository.private
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ matrix.bundles }}

  checksums:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [draft, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir assets && cd assets
          gh release download "$GITHUB_REF_NAME" --repo "${{ github.repository }}"
          sha256sum -- * > ../SHA256SUMS
          cat ../SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" ../SHA256SUMS --repo "${{ github.repository }}" --clobber
