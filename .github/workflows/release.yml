# A tag v<version> (v0.1.0) releases the desktop app: the full CI passes first,
# then a draft GitHub Release gets a universal macOS build (.dmg, and the
# .app.tar.gz the action adds) and Linux builds for x86-64 and ARM64
# (.AppImage, .deb, .rpm), each
# with the pinrail CLI inside (/usr/bin/pinrail in the Linux packages, beside the
# app as pinrail-desktop; pinrail-cli in the macOS bundle) and the third-party
# notices as THIRD_PARTY_NOTICES.txt, the CLI on its own for each platform
# (pinrail-cli-<target>.tar.gz), a build provenance attestation for each
# installer and CLI archive, and a SHA256SUMS file. The update bundles are
# signed with the updater key, and latest.json lists them for the app's
# updater, which reads it from the latest published release.
# The draft is published by hand after a smoke test. The tag has to name
# the version in desktop/Cargo.toml and tauri.conf.json.
#
# The macOS build is signed with the Developer ID certificate and notarized
# with an App Store Connect key, both from the repository's secrets. A build
# without them is unsigned and still succeeds, so a fork needs nothing, and a
# tag that cannot sign stops rather than shipping. The same holds for the updater
# key: without it a build leaves out the update bundles, and a tag stops.
#
# Run it by hand (Actions › release › Run workflow) to build without
# releasing: the bundles are kept as workflow artifacts.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A release pushes the tag with main, so the push to main already runs
  # the full CI on the same commit. This waits for that run and takes its
  # result, rather than running every job a second time.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
    outputs:
      passed: ${{ steps.main.outputs.passed }}
    steps:
      - name: Wait for the CI run of this commit on main
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # the push to main starts its run at the same moment as this one;
          # give it two minutes to appear
          for _ in $(seq 1 24); do
            run=$(gh run list --repo "$REPO" --workflow ci.yml --branch main --event push \
              --commit "$SHA" --limit 1 --json databaseId -q '.[0].databaseId // empty')
            test -n "$run" && break
            sleep 5
          done
          if [ -z "$run" ]; then
            echo "No CI run on main for $SHA, so this release runs CI itself."
            echo "passed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Waiting for CI run $run on main."
          gh run watch "$run" --repo "$REPO" --interval 30 --exit-status > /dev/null \
            || { echo "CI run $run on main did not pass: https://github.com/$REPO/actions/runs/$run"; exit 1; }
          echo "passed=true" >> "$GITHUB_OUTPUT"

  # the full CI, when main has no run of this commit to wait for
  test:
    needs: ci
    if: needs.ci.outputs.passed != 'true'
    # zizmor prefers $/, which actionlint cannot read yet
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]

  draft:
    needs: [ci, test]
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.ci.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      id: ${{ steps.release.outputs.id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # scripts/set-version.mjs writes these before a release is tagged
      - name: Check the version
        id: version
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          for file in desktop/Cargo.toml cli/Cargo.toml; do
            found=$(sed -n 's/^version = "\(.*\)"/\1/p' "$file" | head -1)
            test "$found" = "$tagged" || { echo "the tag says $tagged, $file says $found"; exit 1; }
          done
          app=$(jq -r .version desktop/app/src-tauri/tauri.conf.json)
          test "$app" = "$tagged" || { echo "the tag says $tagged, tauri.conf.json says $app"; exit 1; }
          echo "version=$tagged" >> "$GITHUB_OUTPUT"
      - name: Create the draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # what the changelog says about this version, and how to check a download
          node scripts/release-notes.mjs "$VERSION" > notes.md
          cat >> notes.md <<'EOF'

          ---

          The macOS build is signed and notarized by Apple, so it opens without a warning.

          Check a download against `SHA256SUMS`, or with `gh attestation verify <file> --repo ${{ github.repository }}`.
          EOF
          # the tag has to exist, or the release is created with no tag at all
          gh api "repos/${{ github.repository }}/git/ref/tags/$GITHUB_REF_NAME" --silent
          # Create it and read the id from the same answer. Listing the
          # releases right after creating one can come back without it, and
          # an empty id makes every build skip its upload without a word.
          id=$(gh api "repos/${{ github.repository }}/releases" \
            -f tag_name="$GITHUB_REF_NAME" \
            -f name="Pinrail $VERSION" \
            -f body="$(cat notes.md)" \
            -F draft=true \
            --jq .id)
          test -n "$id" || { echo "the draft release came back without an id"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: [ci, test, draft]
    # a tag builds into its draft; a manual run builds with nothing to release
    if: always() && needs.ci.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') && (needs.draft.result == 'success' || needs.draft.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            runner: macos-latest
            triple: universal-apple-darwin
            args: --target universal-apple-darwin --config src-tauri/tauri.release.conf.json
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: |
              desktop/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: linux
            # the oldest supported Ubuntu, so the AppImage runs on older glibc
            runner: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            # pinrail-desktop and /usr/bin/pinrail: the command is the CLI's
            args: --config src-tauri/tauri.release.conf.json --config src-tauri/tauri.release.linux.conf.json
            targets: ""
            bundles: |
              desktop/target/release/bundle/appimage/*.AppImage
              desktop/target/release/bundle/deb/*.deb
              desktop/target/release/bundle/rpm/*.rpm
          - name: linux-arm
            # the same as linux, built on an ARM64 runner of the same Ubuntu
            runner: ubuntu-22.04-arm
            triple: aarch64-unknown-linux-gnu
            args: --config src-tauri/tauri.release.conf.json --config src-tauri/tauri.release.linux.conf.json
            targets: ""
            bundles: |
              desktop/target/release/bundle/appimage/*.AppImage
              desktop/target/release/bundle/deb/*.deb
              desktop/target/release/bundle/rpm/*.rpm
          # a per-user NSIS installer, with the CLI, the host and ConPTY;
          # not signed yet, so SmartScreen warns on the first run
          - name: windows
            runner: windows-latest
            triple: x86_64-pc-windows-msvc
            args: --config src-tauri/tauri.release.conf.json --config src-tauri/tauri.release.windows.conf.json
            targets: ""
            bundles: |
              desktop/target/release/bundle/nsis/*.exe
          - name: windows-arm
            runner: windows-11-arm
            triple: aarch64-pc-windows-msvc
            args: --config src-tauri/tauri.release.conf.json --config src-tauri/tauri.release.windows.conf.json
            targets: ""
            bundles: |
              desktop/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.runner }}
    # The universal macOS build compiles twice, about 20 minutes, then
    # waits in Apple's notary queue, which can take most of an hour. Two
    # hours leaves room for both, and a stuck notarization still fails
    # well before the default six.
    timeout-minutes: 120
    # the steps are written for a Unix shell, which is Git Bash on Windows
    defaults:
      run:
        shell: bash
    env:
      # a step cannot read a secret in its condition, only an environment
      # value: this says whether this run has what it takes to sign
      SIGNED: ${{ secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_API_KEY_P8 != '' }}
      UPDATER: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Plain apt, refreshed first: a release is worth the half minute. The
      # caching action installs against whatever index the image shipped
      # with, and a superseded version there fails the whole build on a 404.
      # libgtk-3-dev is named because 22.04's webkit package does not bring
      # it, and the build needs gdk-3.0 through pkg-config.
      - name: Install the Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf
      # Both caches are restored on purpose, from what CI saved on main:
      # only a push to main writes them, and npm checks every package
      # against the lock file's hashes.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: # zizmor: ignore[cache-poisoning]
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/app/package-lock.json
      # the version rust-toolchain.toml pins, and the matrix's targets
      - name: Rust toolchain
        run: |
          rustup toolchain install
          if [ -n "$TARGETS" ]; then
            IFS=, read -ra targets <<< "$TARGETS"
            rustup target add "${targets[@]}"
          fi
        env:
          TARGETS: ${{ matrix.targets }}
      # Zig at the version mise.toml pins, which builds libghostty-vt for
      # the terminal host
      - name: Zig version
        id: zig
        run: echo "version=$(sed -n 's/^zig = "\(.*\)"$/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ steps.zig.outputs.version }}
          use-cache: false
      # ring, which rustls uses, builds its assembly with Clang on Windows
      # on ARM64, where MSVC's compiler cannot
      - name: Clang (Windows on ARM64)
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        run: |
          if ! command -v clang > /dev/null; then
            choco install llvm --no-progress -y
            echo "C:/Program Files/LLVM/bin" >> "$GITHUB_PATH"
          fi
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: # zizmor: ignore[cache-poisoning]
          # The name the CI workflow saves under, keyed by the runner image
          # so a tag starts from what a push to main already compiled. macOS
          # matches and shares; Linux does not, because CI runs on the
          # current Ubuntu and a release on 22.04, and artifacts built
          # against a newer glibc would undo the floor that image is for.
          shared-key: pinrail-${{ matrix.runner }}
          workspaces: |
            desktop
            cli
          cache-on-failure: true
          # a cache written under a tag is visible to that tag alone, so a
          # release restores and does not save
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # the plugins with a build of their own, whose view/ the core embeds
      - name: Build the plugins
        run: sh scripts/build-plugins.sh
      - name: Install the shell's dependencies
        working-directory: desktop/app
        run: npm ci
      # the release build writes the third-party notices it bundles
      - uses: taiki-e/install-action@76c2e6406e52637deed7160d77bded76bd83e06e # v2.87.14
        with:
          tool: cargo-about
      # the CLI ships inside the bundle as the pinrail-cli sidecar
      - name: Build the CLI
        working-directory: desktop/app
        run: npm run cli:build -- ${{ matrix.triple }}
      # and the terminal host, which the core copies into the data folder
      # and starts from there: on Linux the pinrail-host sidecar, on macOS
      # Pinrail Host.app in Contents/Helpers. Tauri does not sign a bundle
      # it is given as a file, so the host's is signed here with the
      # Developer ID and its own entitlements, from a keychain of its own
      # that is removed again before Tauri makes its keychain for the app
      - name: Build the terminal host
        working-directory: desktop/app
        env:
          TRIPLE: ${{ matrix.triple }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" != macOS ] || [ "$SIGNED" != true ]; then
            npm run host:build -- "$TRIPLE"
            exit 0
          fi
          keychain="$RUNNER_TEMP/host-signing.keychain-db"
          password=$(openssl rand -hex 32)
          searched=$(security list-keychains -d user | tr -d '"')
          cleanup() {
            # shellcheck disable=SC2086
            security list-keychains -d user -s $searched
            security delete-keychain "$keychain" || true
            rm -f "$RUNNER_TEMP/host-certificate.p12"
          }
          trap cleanup EXIT
          printf %s "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/host-certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/host-certificate.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$keychain" $searched
          HOST_SIGNING_IDENTITY="$APPLE_SIGNING_IDENTITY" npm run host:build -- "$TRIPLE"
      # a tag that cannot sign is a mistake, not an unsigned release
      - name: Refuse to build a tag with nowhere to upload
        if: startsWith(github.ref, 'refs/tags/v') && needs.draft.outputs.id == ''
        run: |
          echo "the draft release has no id, so the bundles would be built and dropped" >&2
          exit 1
      - name: Refuse to build a tag that cannot be signed
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v') && env.SIGNED != 'true'
        run: |
          echo "the repository has no Apple secrets, so this tag would ship unsigned" >&2
          exit 1
      - name: Refuse to build a tag without the updater key
        if: startsWith(github.ref, 'refs/tags/v') && env.UPDATER != 'true'
        run: |
          echo "the repository has no updater key, so installed copies would never see this release" >&2
          exit 1
      # notarization takes the key as a file; the secret carries it base64
      - name: Write the notarization key (macOS)
        id: notarize
        if: runner.os == 'macOS' && env.SIGNED == 'true'
        env:
          P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/notarize"
          printf %s "$P8" | base64 --decode > "$RUNNER_TEMP/notarize/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/notarize/AuthKey.p8"
          echo "path=$RUNNER_TEMP/notarize/AuthKey.p8" >> "$GITHUB_OUTPUT"
      # the changelog's section for this version, which latest.json carries
      # to the app as the update's notes
      - name: Read the release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ needs.draft.outputs.version }}
        run: |
          {
            echo 'body<<NOTES_END'
            node scripts/release-notes.mjs "$VERSION"
            echo 'NOTES_END'
          } >> "$GITHUB_OUTPUT"
      - name: Build and upload the bundles
        id: build
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # signing: the certificate and its key, into a keychain the action makes
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # notarization: the App Store Connect key, by id, issuer and file
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ steps.notarize.outputs.path }}
          # the updater's key signs the update bundles
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # the AppImage leaves the display stack to the host: Ubuntu
          # 22.04's libwayland, bundled, makes WebKitGTK abort with
          # EGL_BAD_PARAMETER on a newer Mesa (Arch, Fedora 44); every Linux
          # desktop has these (tauri-apps/tauri#15976)
          LINUXDEPLOY_EXCLUDED_LIBRARIES: "libwayland-client.so*;libwayland-cursor.so*;libwayland-egl.so*;libwayland-server.so*;libxkbcommon.so*;libxcb-randr.so*;libxcb-render.so*;libxcb-shm.so*;libXau.so*;libXdmcp.so*"
        with:
          projectPath: desktop/app
          tauriScript: npx tauri
          # no version in the files' names, so the site links to
          # releases/latest/download/<name> and never goes stale; latest.json
          # names them the same: pinrail-app-universal.dmg, pinrail-app-amd64.AppImage,
          # pinrail-app-amd64.deb, pinrail-app-x86_64.rpm, and on ARM64
          # pinrail-app-aarch64.AppImage, pinrail-app-arm64.deb and
          # pinrail-app-aarch64.rpm; on Windows pinrail-app-x64.exe and
          # pinrail-app-arm64.exe
          releaseAssetNamePattern: "pinrail-app-[arch][ext]"
          # a flaky upload or a notarization hiccup costs a retry, not a release
          retryAttempts: 3
          # without the updater key, the build goes without update bundles
          args: ${{ matrix.args }}${{ env.UPDATER != 'true' && ' --config src-tauri/tauri.no-updater.conf.json' || '' }} -- --locked
          releaseId: ${{ needs.draft.outputs.id }}
          releaseBody: ${{ steps.notes.outputs.body }}
          # each build adds its platforms to the release's latest.json
          uploadUpdaterJson: true
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: pinrail-[platform]-[arch]-[bundle]
      # what the person downloading gets: a signature that checks out, and
      # a notarization ticket stapled to the bundle
      - name: Check the signature and the notarization (macOS)
        if: runner.os == 'macOS' && env.SIGNED == 'true'
        run: |
          app=$(find desktop/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          test -n "$app" || { echo "no .app was built"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dvv "$app" 2>&1 | grep -E 'Authority|TeamIdentifier'
          # the terminal host: its own bundle id, the same team, the
          # hardened runtime and its own entitlements
          host="$app/Contents/Helpers/Pinrail Host.app"
          codesign --verify --deep --strict --verbose=2 "$host"
          signature=$(codesign -dvv "$host" 2>&1)
          echo "$signature"
          app_team=$(codesign -dvv "$app" 2>&1 | sed -n 's/^TeamIdentifier=//p')
          grep -qx 'Identifier=dev.pinrail.host' <<< "$signature"
          grep -qx "TeamIdentifier=$app_team" <<< "$signature"
          grep -q 'flags=.*runtime' <<< "$signature"
          entitlements=$(codesign -d --entitlements - --xml "$host" 2>/dev/null)
          for key in device.camera device.audio-input personal-information.addressbook \
            personal-information.calendars personal-information.photos-library automation.apple-events; do
            grep -q "com.apple.security.$key" <<< "$entitlements" || { echo "the host lacks com.apple.security.$key"; exit 1; }
          done
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$app"
      # What the person installing gets on the oldest Ubuntu Pinrail
      # supports: the .deb installs with its dependencies, the command runs,
      # and the app and the AppImage each start and serve, the SDK included.
      # --headless needs no display; the window gets one from xvfb and must
      # still be running when the timeout stops it.
      - name: Install and start the Linux packages
        if: runner.os == 'Linux'
        run: |
          set -eu
          serves() {
            for _ in $(seq 1 50); do
              curl -fsS "http://127.0.0.1:$1/api/v1/info" > /dev/null 2>&1 && break
              sleep 0.2
            done
            curl -fsS "http://127.0.0.1:$1/api/v1/info"
            echo
            curl -fsS -o /dev/null "http://127.0.0.1:$1/sdk/v1/pinrail-plugin.js"
          }
          bundle=desktop/target/release/bundle
          sudo apt-get install -y --no-install-recommends "./$(ls $bundle/deb/*.deb)" xvfb
          pinrail --version

          pinrail-desktop --headless --port 4790 --data-dir "$(mktemp -d)" &
          serves 4790
          kill $!

          appimage=$(ls $bundle/appimage/*.AppImage)
          chmod +x "$appimage"
          # the display stack is the host's (see LINUXDEPLOY_EXCLUDED_LIBRARIES)
          extracted=$(mktemp -d)
          (cd "$extracted" && "$OLDPWD/$appimage" --appimage-extract > /dev/null)
          bundled=$(find "$extracted/squashfs-root/usr/lib" -maxdepth 1 \( -name 'libwayland-*' \
            -o -name 'libxkbcommon*' -o -name 'libxcb-randr*' -o -name 'libxcb-render*' \
            -o -name 'libxcb-shm*' -o -name 'libXau*' -o -name 'libXdmcp*' \))
          test -z "$bundled" || { echo "the AppImage bundles what the host must provide: $bundled"; exit 1; }
          APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --headless --port 4791 --data-dir "$(mktemp -d)" &
          serves 4791
          kill $!

          status=0
          timeout 15 xvfb-run -a pinrail-desktop || status=$?
          test "$status" -eq 124 || { echo "the app window exited with $status before the timeout"; exit 1; }
      # What the person installing on Windows gets: the installer installs
      # for them without asking, puts the CLI, the host and ConPTY beside
      # the app, and the app starts and serves, the SDK included.
      - name: Install and start the Windows app
        if: runner.os == 'Windows'
        run: |
          set -eu
          installer=$(ls desktop/target/release/bundle/nsis/*.exe)
          cmd //c "$(cygpath -w "$installer") /S"
          dir="$LOCALAPPDATA/Pinrail"
          for file in Pinrail.exe pinrail-cli.exe pinrail-host.exe conpty/conpty.dll sdk/v1/pinrail-plugin.js; do
            test -f "$dir/$file" || { echo "the installer did not put $file in $dir"; exit 1; }
          done
          ls "$dir"/conpty/*/OpenConsole.exe
          "$dir/pinrail-cli.exe" --version
          data=$(mktemp -d)
          # its output in a file, so that the step's own streams close, and
          # the app stopped however the step ends
          "$dir/Pinrail.exe" --headless --port 4792 --data-dir "$(cygpath -w "$data")" > "$data.log" 2>&1 &
          app=$!
          trap 'kill $app 2> /dev/null || true; cat "$data.log"' EXIT
          for _ in $(seq 1 100); do
            curl -fsS "http://127.0.0.1:4792/api/v1/info" > /dev/null 2>&1 && break
            sleep 0.2
          done
          curl -fsS "http://127.0.0.1:4792/api/v1/info"
          echo
          curl -fsS -o /dev/null "http://127.0.0.1:4792/sdk/v1/pinrail-plugin.js"
      # The CLI on its own, for machines without the app, such as a plugin's
      # CI running `pinrail plugins check`. On macOS it is the copy inside
      # the app, which the bundle's signing and notarization cover; on Linux,
      # the sidecar the packages carry; on Windows, the CLI sidecar, in a
      # zip, which Windows opens itself. The name has no version, so that
      # releases/latest/download/<name> stays the same from one release to
      # the next.
      - name: Package the CLI on its own
        env:
          TRIPLE: ${{ matrix.triple }}
          # macOS tar leaves out its ._ metadata files
          COPYFILE_DISABLE: 1
        run: |
          set -eu
          staging=$(mktemp -d)
          mkdir -p cli-dist
          cp LICENSE NOTICE desktop/app/notices/THIRD_PARTY_NOTICES.txt "$staging/"
          if [ "$RUNNER_OS" = Windows ]; then
            cp "desktop/app/src-tauri/binaries/pinrail-cli-$TRIPLE.exe" "$staging/pinrail.exe"
            "$staging/pinrail.exe" --version
            (cd "$staging" && 7z a -tzip "$OLDPWD/cli-dist/pinrail-cli-$TRIPLE.zip" . > /dev/null)
            exit 0
          fi
          if [ "$RUNNER_OS" = macOS ]; then
            app=$(find desktop/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
            binary="$app/Contents/MacOS/pinrail-cli"
          else
            binary="desktop/app/src-tauri/binaries/pinrail-$TRIPLE"
          fi
          cp "$binary" "$staging/pinrail"
          "$staging/pinrail" --version
          tar -czf "cli-dist/pinrail-cli-$TRIPLE.tar.gz" -C "$staging" .
      - name: Upload the CLI
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" cli-dist/* --repo "$GITHUB_REPOSITORY" --clobber
      # Attestations are refused to a private repository on the free plan,
      # so they wait for the repository to be public rather than failing a
      # signed, notarized build over a signature nobody can check yet.
      #
      # Sigstore's transparency log sometimes answers 404 for an entry it
      # has just written. A step that uses an action cannot be retried, so
      # the attestation is tried up to three times, a little apart, before
      # the job fails; a rerun would rebuild the whole platform.
      - name: Attest the build provenance
        id: attest
        if: startsWith(github.ref, 'refs/tags/v') && !github.event.repository.private
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ matrix.bundles }}
            cli-dist/*
      - name: Wait before attesting again
        if: steps.attest.outcome == 'failure'
        run: sleep 30
      - name: Attest the build provenance, second try
        id: attest-again
        if: steps.attest.outcome == 'failure'
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ matrix.bundles }}
            cli-dist/*
      - name: Wait before the last try
        if: steps.attest-again.outcome == 'failure'
        run: sleep 90
      - name: Attest the build provenance, last try
        if: steps.attest-again.outcome == 'failure'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ matrix.bundles }}
            cli-dist/*

  checksums:
    # always(), as for the build: a test job skipped because main's CI ran
    # would otherwise skip this job too
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.draft.result == 'success' && needs.build.result == 'success'
    needs: [draft, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check latest.json, and SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir assets && cd assets
          gh release download "$GITHUB_REF_NAME" --repo "${{ github.repository }}"
          # what the updater reads: every platform, each with an address and
          # a signature. Every build adds to one file, so a lost entry shows here.
          jq -e '. as $j
            | ($j.version | length > 0)
            and ([ "darwin-aarch64", "darwin-x86_64", "linux-x86_64", "linux-aarch64",
                   "windows-x86_64", "windows-aarch64" ]
                 | all(. as $p | ($j.platforms[$p].signature // "" | length > 0)
                                 and ($j.platforms[$p].url // "" | length > 0)))
          ' latest.json > /dev/null || { echo "latest.json is missing a platform or a signature:"; cat latest.json; exit 1; }
          sha256sum -- * > ../SHA256SUMS
          cat ../SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" ../SHA256SUMS --repo "${{ github.repository }}" --clobber
