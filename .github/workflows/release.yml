# A tag v<version> (v0.1.0) releases the desktop app: the full CI runs first,
# then a draft GitHub Release gets a universal macOS build (.dmg, and the
# .app.tar.gz the action adds) and Linux builds (.AppImage, .deb, .rpm), each
# with the pinrail CLI inside (/usr/bin/pinrail in the Linux packages, beside the
# app as pinrail-desktop; pinrail-cli in the macOS bundle) and the third-party
# notices as THIRD_PARTY_NOTICES.txt, a build provenance attestation for each
# installer, and a SHA256SUMS file. The update bundles are signed with the
# updater key, and latest.json lists them for the app's updater, which reads
# it from the latest published release.
# The draft is published by hand after a smoke test. The tag has to name
# the version in desktop/Cargo.toml and tauri.conf.json.
#
# The macOS build is signed with the Developer ID certificate and notarized
# with an App Store Connect key, both from the repository's secrets. A build
# without them is unsigned and still succeeds, so a fork needs nothing, and a
# tag that cannot sign stops rather than shipping. The same holds for the updater
# key: without it a build leaves out the update bundles, and a tag stops.
#
# Run it by hand (Actions › release › Run workflow) to build without
# releasing: the bundles are kept as workflow artifacts.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    # zizmor prefers $/, which actionlint cannot read yet
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]

  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      id: ${{ steps.release.outputs.id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # scripts/set-version.mjs writes these before a release is tagged
      - name: Check the version
        id: version
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          for file in desktop/Cargo.toml cli/Cargo.toml; do
            found=$(sed -n 's/^version = "\(.*\)"/\1/p' "$file" | head -1)
            test "$found" = "$tagged" || { echo "the tag says $tagged, $file says $found"; exit 1; }
          done
          app=$(jq -r .version desktop/app/src-tauri/tauri.conf.json)
          test "$app" = "$tagged" || { echo "the tag says $tagged, tauri.conf.json says $app"; exit 1; }
          echo "version=$tagged" >> "$GITHUB_OUTPUT"
      - name: Create the draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # what the changelog says about this version, and how to check a download
          node scripts/release-notes.mjs "$VERSION" > notes.md
          cat >> notes.md <<'EOF'

          ---

          The macOS build is signed and notarized by Apple, so it opens without a warning.

          Check a download against `SHA256SUMS`, or with `gh attestation verify <file> --repo ${{ github.repository }}`.
          EOF
          # the tag has to exist, or the release is created with no tag at all
          gh api "repos/${{ github.repository }}/git/ref/tags/$GITHUB_REF_NAME" --silent
          # Create it and read the id from the same answer. Listing the
          # releases right after creating one can come back without it, and
          # an empty id makes every build skip its upload without a word.
          id=$(gh api "repos/${{ github.repository }}/releases" \
            -f tag_name="$GITHUB_REF_NAME" \
            -f name="Pinrail $VERSION" \
            -f body="$(cat notes.md)" \
            -F draft=true \
            --jq .id)
          test -n "$id" || { echo "the draft release came back without an id"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: [test, draft]
    # a tag builds into its draft; a manual run builds with nothing to release
    if: always() && needs.test.result == 'success' && (needs.draft.result == 'success' || needs.draft.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            runner: macos-latest
            triple: universal-apple-darwin
            args: --target universal-apple-darwin --config src-tauri/tauri.release.conf.json
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: |
              desktop/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: linux
            # the oldest supported Ubuntu, so the AppImage runs on older glibc
            runner: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            # pinrail-desktop and /usr/bin/pinrail: the command is the CLI's
            args: --config src-tauri/tauri.release.conf.json --config src-tauri/tauri.release.linux.conf.json
            targets: ""
            bundles: |
              desktop/target/release/bundle/appimage/*.AppImage
              desktop/target/release/bundle/deb/*.deb
              desktop/target/release/bundle/rpm/*.rpm
    runs-on: ${{ matrix.runner }}
    # notarization waits on Apple, so a stuck one fails within the hour
    # rather than holding a runner for the default six
    timeout-minutes: 60
    env:
      # a step cannot read a secret in its condition, only an environment
      # value: this says whether this run has what it takes to sign
      SIGNED: ${{ secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_API_KEY_P8 != '' }}
      UPDATER: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Plain apt, refreshed first: a release is worth the half minute. The
      # caching action installs against whatever index the image shipped
      # with, and a superseded version there fails the whole build on a 404.
      # libgtk-3-dev is named because 22.04's webkit package does not bring
      # it, and the build needs gdk-3.0 through pkg-config.
      - name: Install the Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf
      # Both caches are restored on purpose, from what CI saved on main:
      # only a push to main writes them, and npm checks every package
      # against the lock file's hashes.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: # zizmor: ignore[cache-poisoning]
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/app/package-lock.json
      # the version rust-toolchain.toml pins, and the matrix's targets
      - name: Rust toolchain
        run: |
          rustup toolchain install
          if [ -n "$TARGETS" ]; then
            IFS=, read -ra targets <<< "$TARGETS"
            rustup target add "${targets[@]}"
          fi
        env:
          TARGETS: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: # zizmor: ignore[cache-poisoning]
          # The name the CI workflow saves under, keyed by the runner image
          # so a tag starts from what a push to main already compiled. macOS
          # matches and shares; Linux does not, because CI runs on the
          # current Ubuntu and a release on 22.04, and artifacts built
          # against a newer glibc would undo the floor that image is for.
          shared-key: pinrail-${{ matrix.runner }}
          workspaces: |
            desktop
            cli
          cache-on-failure: true
          # a cache written under a tag is visible to that tag alone, so a
          # release restores and does not save
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install the shell's dependencies
        working-directory: desktop/app
        run: npm ci
      # the release build writes the third-party notices it bundles
      - uses: taiki-e/install-action@76c2e6406e52637deed7160d77bded76bd83e06e # v2.87.14
        with:
          tool: cargo-about
      # the CLI ships inside the bundle as the pinrail-cli sidecar
      - name: Build the CLI
        working-directory: desktop/app
        run: npm run cli:build -- ${{ matrix.triple }}
      # a tag that cannot sign is a mistake, not an unsigned release
      - name: Refuse to build a tag with nowhere to upload
        if: startsWith(github.ref, 'refs/tags/v') && needs.draft.outputs.id == ''
        run: |
          echo "the draft release has no id, so the bundles would be built and dropped" >&2
          exit 1
      - name: Refuse to build a tag that cannot be signed
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v') && env.SIGNED != 'true'
        run: |
          echo "the repository has no Apple secrets, so this tag would ship unsigned" >&2
          exit 1
      - name: Refuse to build a tag without the updater key
        if: startsWith(github.ref, 'refs/tags/v') && env.UPDATER != 'true'
        run: |
          echo "the repository has no updater key, so installed copies would never see this release" >&2
          exit 1
      # notarization takes the key as a file; the secret carries it base64
      - name: Write the notarization key (macOS)
        id: notarize
        if: runner.os == 'macOS' && env.SIGNED == 'true'
        env:
          P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          install -m 700 -d "$RUNNER_TEMP/notarize"
          printf %s "$P8" | base64 --decode > "$RUNNER_TEMP/notarize/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/notarize/AuthKey.p8"
          echo "path=$RUNNER_TEMP/notarize/AuthKey.p8" >> "$GITHUB_OUTPUT"
      # the changelog's section for this version, which latest.json carries
      # to the app as the update's notes
      - name: Read the release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ needs.draft.outputs.version }}
        run: |
          {
            echo 'body<<NOTES_END'
            node scripts/release-notes.mjs "$VERSION"
            echo 'NOTES_END'
          } >> "$GITHUB_OUTPUT"
      - name: Build and upload the bundles
        id: build
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # signing: the certificate and its key, into a keychain the action makes
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # notarization: the App Store Connect key, by id, issuer and file
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ steps.notarize.outputs.path }}
          # the updater's key signs the update bundles
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # the AppImage leaves the display stack to the host: Ubuntu
          # 22.04's libwayland, bundled, makes WebKitGTK abort with
          # EGL_BAD_PARAMETER on a newer Mesa (Arch, Fedora 44); every Linux
          # desktop has these (tauri-apps/tauri#15976)
          LINUXDEPLOY_EXCLUDED_LIBRARIES: "libwayland-client.so*;libwayland-cursor.so*;libwayland-egl.so*;libwayland-server.so*;libxkbcommon.so*;libxcb-randr.so*;libxcb-render.so*;libxcb-shm.so*;libXau.so*;libXdmcp.so*"
        with:
          projectPath: desktop/app
          tauriScript: npx tauri
          # no version in the files' names, so the site links to
          # releases/latest/download/<name> and never goes stale; latest.json
          # names them the same: pinrail-app-universal.dmg, pinrail-app-amd64.AppImage,
          # pinrail-app-amd64.deb, pinrail-app-x86_64.rpm
          releaseAssetNamePattern: "pinrail-app-[arch][ext]"
          # a flaky upload or a notarization hiccup costs a retry, not a release
          retryAttempts: 3
          # without the updater key, the build goes without update bundles
          args: ${{ matrix.args }}${{ env.UPDATER != 'true' && ' --config src-tauri/tauri.no-updater.conf.json' || '' }} -- --locked
          releaseId: ${{ needs.draft.outputs.id }}
          releaseBody: ${{ steps.notes.outputs.body }}
          # each build adds its platforms to the release's latest.json
          uploadUpdaterJson: true
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: pinrail-[platform]-[arch]-[bundle]
      # what the person downloading gets: a signature that checks out, and
      # a notarization ticket stapled to the bundle
      - name: Check the signature and the notarization (macOS)
        if: runner.os == 'macOS' && env.SIGNED == 'true'
        run: |
          app=$(find desktop/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          test -n "$app" || { echo "no .app was built"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dvv "$app" 2>&1 | grep -E 'Authority|TeamIdentifier'
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$app"
      # What the person installing gets on the oldest Ubuntu Pinrail
      # supports: the .deb installs with its dependencies, the command runs,
      # and the app and the AppImage each start and serve, the SDK included.
      # --headless needs no display; the window gets one from xvfb and must
      # still be running when the timeout stops it.
      - name: Install and start the Linux packages
        if: runner.os == 'Linux'
        run: |
          set -eu
          serves() {
            for _ in $(seq 1 50); do
              curl -fsS "http://127.0.0.1:$1/api/v1/info" > /dev/null 2>&1 && break
              sleep 0.2
            done
            curl -fsS "http://127.0.0.1:$1/api/v1/info"
            echo
            curl -fsS -o /dev/null "http://127.0.0.1:$1/sdk/v1/pinrail-plugin.js"
          }
          bundle=desktop/target/release/bundle
          sudo apt-get install -y --no-install-recommends "./$(ls $bundle/deb/*.deb)" xvfb
          pinrail --version

          pinrail-desktop --headless --port 4790 --data-dir "$(mktemp -d)" &
          serves 4790
          kill $!

          appimage=$(ls $bundle/appimage/*.AppImage)
          chmod +x "$appimage"
          # the display stack is the host's (see LINUXDEPLOY_EXCLUDED_LIBRARIES)
          extracted=$(mktemp -d)
          (cd "$extracted" && "$OLDPWD/$appimage" --appimage-extract > /dev/null)
          bundled=$(find "$extracted/squashfs-root/usr/lib" -maxdepth 1 \( -name 'libwayland-*' \
            -o -name 'libxkbcommon*' -o -name 'libxcb-randr*' -o -name 'libxcb-render*' \
            -o -name 'libxcb-shm*' -o -name 'libXau*' -o -name 'libXdmcp*' \))
          test -z "$bundled" || { echo "the AppImage bundles what the host must provide: $bundled"; exit 1; }
          APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --headless --port 4791 --data-dir "$(mktemp -d)" &
          serves 4791
          kill $!

          status=0
          timeout 15 xvfb-run -a pinrail-desktop || status=$?
          test "$status" -eq 124 || { echo "the app window exited with $status before the timeout"; exit 1; }
      # Attestations are refused to a private repository on the free plan,
      # so they wait for the repository to be public rather than failing a
      # signed, notarized build over a signature nobody can check yet.
      - name: Attest the build provenance
        if: startsWith(github.ref, 'refs/tags/v') && !github.event.repository.private
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ matrix.bundles }}

  checksums:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [draft, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check latest.json, and SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir assets && cd assets
          gh release download "$GITHUB_REF_NAME" --repo "${{ github.repository }}"
          # what the updater reads: every platform, each with an address and
          # a signature. Both builds add to one file, so a lost entry shows here.
          jq -e '. as $j
            | ($j.version | length > 0)
            and ([ "darwin-aarch64", "darwin-x86_64", "linux-x86_64" ]
                 | all(. as $p | ($j.platforms[$p].signature // "" | length > 0)
                                 and ($j.platforms[$p].url // "" | length > 0)))
          ' latest.json > /dev/null || { echo "latest.json is missing a platform or a signature:"; cat latest.json; exit 1; }
          sha256sum -- * > ../SHA256SUMS
          cat ../SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" ../SHA256SUMS --repo "${{ github.repository }}" --clobber
