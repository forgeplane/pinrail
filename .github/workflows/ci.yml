# Every push to main and every pull request that touches more than the site
# and the prose: formatting, the dependencies' licences and sources, and the shell's type
# check once, then on Linux and macOS clippy, the Rust tests, and the CLI
# and the shell driven end to end against the headless desktop core; the
# plugins and the SDK package tested on their own. No release artifacts:
# that is a workflow of its own.
name: ci

on:
  # Everything but the site and the prose, which the website workflow builds:
  # a later pattern overrides an earlier one, so the docs' example plugins,
  # which this workflow builds and tests, still count
  push:
    branches: [main]
    paths:
      - "**"
      - "!website/**"
      - "!docs/**"
      - "docs/examples/**"
      - "!README.md"
      - "!CONTRIBUTING.md"
      - "!SECURITY.md"
      - "!CHANGELOG.md"
  pull_request:
    paths:
      - "**"
      - "!website/**"
      - "!docs/**"
      - "docs/examples/**"
      - "!README.md"
      - "!CONTRIBUTING.md"
      - "!SECURITY.md"
      - "!CHANGELOG.md"
  # the release workflow runs all of this before it builds, whatever changed
  workflow_call:

# a pull request's newer push cancels its older run; every push to main
# keeps its own, since main's runs save the cache everyone restores
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# read-only, unless a job asks for more
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # no debug info: a far smaller target directory to cache, restore and link
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  # What gives the same answer on any system, once: rustfmt and the
  # shell's type check. Clippy is not here: it only sees the code that
  # compiles for its target, and the app crate has branches per system.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the version rust-toolchain.toml pins, with rustfmt and clippy
      - name: Rust toolchain
        run: rustup toolchain install
      - name: rustfmt
        run: |
          cargo fmt --check --manifest-path cli/Cargo.toml
          cargo fmt --all --check --manifest-path desktop/Cargo.toml
      - uses: taiki-e/install-action@76c2e6406e52637deed7160d77bded76bd83e06e # v2.87.14
        with:
          tool: cargo-deny
      # every Rust dependency under a licence deny.toml allows, from
      # crates.io, with no version wildcards; advisories have a workflow
      # of their own, since a new one needs no change here
      - name: Dependency licences and sources
        run: |
          cargo deny --manifest-path desktop/Cargo.toml --config deny.toml check licenses bans sources
          cargo deny --manifest-path cli/Cargo.toml --config deny.toml check licenses bans sources
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/app/package-lock.json
      # the UI's type check, then its unit tests
      - name: Type check and unit-test the shell
        working-directory: desktop/app
        run: |
          npm ci
          npm test
      # ESLint and Prettier over the JavaScript and TypeScript git tracks,
      # from the root
      - name: ESLint and Prettier
        run: |
          npm ci
          npm run lint
          npm run format:check

  # The core, the app crate and the CLI on each system: clippy, cargo test,
  # then the end-to-end suites, which need the built desktop binary and the CLI.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cached across runs instead of downloaded each time; bump version to refresh
      - name: Linux dependencies
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
          version: "1"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            desktop/app/package-lock.json
            e2e/package-lock.json
            pinrail-plugin/package-lock.json
      # the version rust-toolchain.toml pins, with rustfmt and clippy
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # One name for every job that builds this workspace, here and in
          # the release, so a tag restores what a push to main saved. A
          # cache written under a tag is visible to that tag alone, which
          # is why the release cannot warm itself.
          shared-key: pinrail-${{ matrix.os }}
          # a red run still built its dependencies; keep them
          cache-on-failure: true
          # only main saves: every branch and pull request restores main's
          # cache, and none of them crowd the repository's cache quota
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            desktop
            cli
      # the plugins with a build of their own, whose view/ the core embeds
      - name: Build the plugins
        run: sh scripts/build-plugins.sh
      # the app crate embeds dist/ at compile time
      - name: Build the shell
        working-directory: desktop/app
        run: |
          npm ci
          npm run build
      - name: clippy
        run: |
          cargo clippy --manifest-path cli/Cargo.toml --all-targets --locked
          cargo clippy --manifest-path desktop/Cargo.toml --workspace --all-targets --locked
      - name: Rust tests
        run: |
          cargo test --manifest-path cli/Cargo.toml --locked
          cargo test --manifest-path desktop/Cargo.toml --workspace --locked
          cargo test --manifest-path desktop/Cargo.toml -p pinrail-core --features docs --locked --lib docs::
      # the shell suite checks fixtures with the plugin SDK's harness, which
      # needs the package's own dependencies
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          (cd ../pinrail-plugin && npm ci)
          npx playwright install --with-deps chromium
      - name: CLI end to end
        working-directory: e2e
        run: npx playwright test
      - name: Shell end to end
        working-directory: e2e
        run: npx playwright test -c shell.config.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: e2e-traces-${{ matrix.os }}
          path: e2e/test-results
          if-no-files-found: ignore

  # The plugins alone under the harness, and the pinrail-plugin package:
  # its unit tests, what `pinrail plugins new` writes, and check over the
  # samples.
  plugins:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the release tags, which the plugin version check compares with
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            plugins/package-lock.json
            pinrail-plugin/package-lock.json
            docs/examples/ship-it/*/package-lock.json
      # pinrail-plugin check runs `pinrail plugins check`, so the CLI goes
      # on the PATH before anything checks a plugin
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: pinrail-cli
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: cli
      - name: Build the CLI
        run: |
          cargo build --manifest-path cli/Cargo.toml --locked
          echo "$PWD/cli/target/debug" >> "$GITHUB_PATH"
      # what `pinrail plugins new` writes, in each template, builds where it
      # has a build and passes the check before a line of it is changed
      - name: New plugins
        run: |
          for template in plain vite react; do
            dir="$RUNNER_TEMP/new/$template"
            pinrail plugins new "new_$template" --template "$template" --dir "$dir"
            if [ "$template" != plain ]; then
              (cd "$dir" && npm install --no-audit --no-fund && npm run build)
            fi
            pinrail plugins check "$dir"
          done
      - name: pinrail-plugin tests
        working-directory: pinrail-plugin
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test
      # and with --playwright, its first test passes, against this checkout's
      # SDK package
      - name: New plugins with tests
        run: |
          for template in plain vite react; do
            dir="$RUNNER_TEMP/tested/$template"
            pinrail plugins new "tested_$template" --template "$template" --playwright \
              --sdk "file:$PWD/pinrail-plugin" --dir "$dir"
            (cd "$dir" && npm install --no-audit --no-fund && npm test)
            pinrail plugins check "$dir"
          done
      # the plugins with a build of their own, which the check and their
      # tests read as the app would
      - name: Build the plugins
        run: sh scripts/build-plugins.sh
      - name: Check the sample plugins
        run: |
          for dir in plugins/*/; do
            node pinrail-plugin/bin/pinrail-plugin.mjs check "$dir"
          done
      # an official plugin that changed since the last release has a new
      # version, or the app never offers it to the people who installed it
      - name: Plugin versions
        run: |
          node --test scripts/plugin-versions.test.mjs
          node scripts/plugin-versions.mjs
      - name: Plugin tests
        working-directory: plugins
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test
      # the docs' example plugin, one per framework: built and tested, then
      # checked, since the build writes the view
      - name: Example plugins
        working-directory: docs/examples/ship-it
        run: |
          for dir in vanilla react vue svelte; do
            (cd "$dir" && npm ci && npm test)
            node ../../../pinrail-plugin/bin/pinrail-plugin.mjs check "$dir"
          done
          node --test same.test.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: plugin-traces
          path: |
            plugins/test-results
            pinrail-plugin/test-results
            docs/examples/ship-it/*/test-results
          if-no-files-found: ignore
