# Every push to main and every pull request: formatting and the shell's
# type check once, then on Linux and macOS clippy, the Rust tests, and
# the CLI and the shell driven end to end against the headless desktop
# core; the plugins and the SDK package tested on their own. No release
# artifacts: that is a workflow of its own, once signing is in.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # the release workflow runs all of this before it builds
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # no debug info: a far smaller target directory to cache, restore and link
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  # What gives the same answer on any system, once: rustfmt and the
  # shell's type check. Clippy is not here: it only sees the code that
  # compiles for its target, and the app crate has branches per system.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # the version mise.toml pins: a new stable release does not invalidate the cache
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
          components: rustfmt
      - name: rustfmt
        run: |
          cargo fmt --check --manifest-path cli/Cargo.toml
          cargo fmt --all --check --manifest-path desktop/Cargo.toml
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/app/package-lock.json
      - name: Type check the shell
        working-directory: desktop/app
        run: |
          npm ci
          npm test

  # The core, the app crate and the CLI on each system: clippy, cargo test,
  # then the end-to-end suites, which need the built desktop binary and the CLI.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            desktop/app/package-lock.json
            e2e/package-lock.json
            wicket-plugin/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # a red run still built its dependencies; keep them
          cache-on-failure: true
          workspaces: |
            desktop
            cli
      # the app crate embeds dist/ at compile time
      - name: Build the shell
        working-directory: desktop/app
        run: |
          npm ci
          npm run build
      - name: clippy
        run: |
          cargo clippy --manifest-path cli/Cargo.toml --all-targets
          cargo clippy --manifest-path desktop/Cargo.toml --workspace --all-targets
      # the core's check test runs wicket-plugin check and compares
      - name: Install wicket-plugin
        working-directory: wicket-plugin
        run: npm ci --omit=dev
      - name: Rust tests
        run: |
          cargo test --manifest-path cli/Cargo.toml
          cargo test --manifest-path desktop/Cargo.toml --workspace
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: CLI end to end
        working-directory: e2e
        run: WICKET_E2E_SERVER=desktop npx playwright test tests/cli.spec.ts tests/zz-restart.spec.ts
      - name: Shell end to end
        working-directory: e2e
        run: npx playwright test -c shell.config.ts
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: e2e-traces-${{ matrix.os }}
          path: e2e/test-results
          if-no-files-found: ignore

  # The plugins alone under the harness, and the wicket-plugin package:
  # its unit tests, what create writes, and check over the samples.
  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            plugins/package-lock.json
            wicket-plugin/package-lock.json
            plugins/artifact/package-lock.json
      - name: wicket-plugin tests
        working-directory: wicket-plugin
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test
      - name: Check the sample plugins
        run: |
          for dir in plugins/*/; do
            node wicket-plugin/bin/wicket-plugin.mjs check "$dir"
          done
      - name: Build the artifact plugin
        working-directory: plugins/artifact
        run: |
          npm ci
          npm run build
      - name: Plugin tests
        working-directory: plugins
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: plugin-traces
          path: |
            plugins/test-results
            wicket-plugin/test-results
          if-no-files-found: ignore
