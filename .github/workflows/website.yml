# The website: built on a pull request that touches it, and deployed to the
# `pinrail` Cloudflare Worker on a push to main that touches website/, docs/
# or plugins/. The plugin pages read the official plugins' manifests and
# schemas from plugins/. The reference pages the CLI and the core generate
# before every build reach the site with the next deploy, or one started by
# hand from the Actions tab.
name: website

on:
  push:
    branches: [main]
    paths:
      - website/**
      - docs/**
      - plugins/**
      - .github/workflows/website.yml
  pull_request:
    paths:
      - website/**
      - docs/**
      - plugins/**
      - .github/workflows/website.yml
  workflow_dispatch:

# one deploy at a time, whatever started it, and a newer one waits rather
# than cancelling one halfway through; a pull request's builds queue apart
concurrency:
  group: website-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  # deploys run one after another; a newer push to a pull request cancels
  # the build it replaces
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# read-only, unless a job asks for more
permissions:
  contents: read

# CI's settings, so the cache it saves on Linux serves this build too: the
# cache's key and cargo's fingerprints both depend on them
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      # the version rust-toolchain.toml pins; the build runs the CLI and
      # the core to write docs/reference/
      - name: Rust toolchain
        run: rustup toolchain install
      # CI's Linux cache, read only: the dependencies come built, and only
      # CI's own builds are saved under its name
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: pinrail-ubuntu-latest
          save-if: false
          workspaces: |
            desktop
            cli
      # the plugins with a build of their own, whose view/ the core embeds
      - name: Build the plugins
        run: sh scripts/build-plugins.sh
      - name: Install
        working-directory: website
        run: |
          npm ci
          # the mermaid diagrams are drawn in a headless browser; the shell
          # is all that takes, not the full Chrome
          npx playwright install --with-deps --only-shell chromium
      # the build fails on a broken link between the docs pages
      - name: Build
        working-directory: website
        run: npm run build
      # the download button picks the visitor's build, on the built site
      - name: Test
        working-directory: website
        run: npm test
      # the site's pages and components, type-checked
      - name: Type check
        working-directory: website
        run: npm run check
      - name: Deploy
        if: github.event_name != 'pull_request'
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # the wrangler website/package-lock.json pins
        run: npx wrangler deploy
