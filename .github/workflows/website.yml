# The website, built and tested on a pull request or a push to main that
# touches website/, docs/ or plugins/, so a broken page fails early. Nothing
# here deploys: the docs on main describe what is not released yet, so
# website-deploy.yml deploys the site when an app release is published. The
# plugin pages read the official plugins' manifests and schemas from
# plugins/, and the CLI and the core generate the reference pages before
# every build.
name: website

on:
  push:
    branches: [main]
    paths:
      - website/**
      - docs/**
      - plugins/**
      - .github/workflows/website.yml
  pull_request:
    paths:
      - website/**
      - docs/**
      - plugins/**
      - .github/workflows/website.yml

# a newer push cancels the build it replaces
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

# read-only, unless a job asks for more
permissions:
  contents: read

# CI's settings, so the cache it saves on Linux serves this build too: the
# cache's key and cargo's fingerprints both depend on them
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      # the version rust-toolchain.toml pins; the build runs the CLI and
      # the core to write docs/reference/
      - name: Rust toolchain
        run: rustup toolchain install
      # CI's Linux cache, read only: the dependencies come built, and only
      # CI's own builds are saved under its name
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: pinrail-ubuntu-latest
          save-if: false
          workspaces: |
            desktop
            cli
      # the plugins with a build of their own, whose view/ the core embeds
      - name: Build the plugins
        run: sh scripts/build-plugins.sh
      - name: Install
        working-directory: website
        run: |
          npm ci
          # the mermaid diagrams are drawn in a headless browser; the shell
          # is all that takes, not the full Chrome
          npx playwright install --with-deps --only-shell chromium
      # the build fails on a broken link between the docs pages
      - name: Build
        working-directory: website
        run: npm run build
      # the download button picks the visitor's build, on the built site
      - name: Test
        working-directory: website
        run: npm test
      # the site's pages and components, type-checked
      - name: Type check
        working-directory: website
        run: npm run check
