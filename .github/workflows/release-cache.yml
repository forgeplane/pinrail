# The release's Rust cache, compiled on main. A release builds optimised
# for its targets: on macOS for Apple silicon and Intel, on Linux on
# Ubuntu 22.04. CI's debug builds share none of that, and a tag's run
# cannot save a cache that a later tag can see. So this workflow compiles
# what the release compiles, with the same steps and cache settings, and
# stops before bundling: nothing is signed, notarized or uploaded. A tag
# then restores the dependencies already built.
#
# It runs when the dependencies or the toolchain change, and weekly,
# because GitHub drops a cache that has not been used for seven days.
name: release-cache

on:
  push:
    branches: [main]
    paths:
      - desktop/Cargo.lock
      - cli/Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/release-cache.yml
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-cache
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      # the release's matrix, without the bundles
      matrix:
        include:
          - name: macos
            runner: macos-latest
            triple: universal-apple-darwin
            args: --target universal-apple-darwin --config src-tauri/tauri.release.conf.json
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: linux
            runner: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            args: --config src-tauri/tauri.release.conf.json --config src-tauri/tauri.release.linux.conf.json
            targets: ""
          - name: linux-arm
            runner: ubuntu-22.04-arm
            triple: aarch64-unknown-linux-gnu
            args: --config src-tauri/tauri.release.conf.json --config src-tauri/tauri.release.linux.conf.json
            targets: ""
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: # zizmor: ignore[cache-poisoning]
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/app/package-lock.json
      - name: Rust toolchain
        run: |
          rustup toolchain install
          if [ -n "$TARGETS" ]; then
            IFS=, read -ra targets <<< "$TARGETS"
            rustup target add "${targets[@]}"
          fi
        env:
          TARGETS: ${{ matrix.targets }}
      # the same settings as the release's, so the key is the one a tag looks for
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: # zizmor: ignore[cache-poisoning]
          shared-key: release-${{ matrix.name }}
          workspaces: |
            desktop
            cli
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the plugins
        run: sh scripts/build-plugins.sh
      - name: Install the shell's dependencies
        working-directory: desktop/app
        run: npm ci
      - uses: taiki-e/install-action@76c2e6406e52637deed7160d77bded76bd83e06e # v2.87.14
        with:
          tool: cargo-about
      - name: Build the CLI
        working-directory: desktop/app
        run: npm run cli:build -- ${{ matrix.triple }}
      - name: Build the app, without bundling it
        working-directory: desktop/app
        run: npx tauri build ${{ matrix.args }} --no-bundle -- --locked
