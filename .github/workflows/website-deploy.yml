# The website, deployed to the `pinrail` Cloudflare Worker. The docs on main
# describe what is not released yet, so the site is deployed from an app
# release's tag when the release is published, which is done by hand after a
# smoke test, or by hand from the Actions tab, from the branch or tag chosen
# there. website.yml builds and tests the site on every change. This build
# uses no cache, so nothing another run saved reaches what is published.
name: website-deploy

on:
  release:
    types: [published]
  workflow_dispatch:

# one deploy at a time, and a newer one waits rather than cancelling one
# halfway through
concurrency:
  group: website-deploy
  cancel-in-progress: false

# read-only, unless a job asks for more
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  deploy:
    # an app release, v<version>, and not the SDK's sdk-v<version>
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    # longer than website.yml: the Rust build starts with no cache
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # no cache: what this publishes is built from nothing a cache
          # could have changed
          package-manager-cache: false
      # the version rust-toolchain.toml pins; the build runs the CLI and
      # the core to write docs/reference/
      - name: Rust toolchain
        run: rustup toolchain install
      # the plugins with a build of their own, whose view/ the core embeds
      - name: Build the plugins
        run: sh scripts/build-plugins.sh
      - name: Install
        working-directory: website
        run: |
          npm ci
          # the mermaid diagrams are drawn in a headless browser; the shell
          # is all that takes, not the full Chrome
          npx playwright install --with-deps --only-shell chromium
      # the build fails on a broken link between the docs pages
      - name: Build
        working-directory: website
        run: npm run build
      # the download button picks the visitor's build, on the built site
      - name: Test
        working-directory: website
        run: npm test
      # the site's pages and components, type-checked
      - name: Type check
        working-directory: website
        run: npm run check
      - name: Deploy
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # the wrangler website/package-lock.json pins
        run: npx wrangler deploy
