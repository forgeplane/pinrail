# A tag sdk-v<version> (sdk-v1.0.0) releases the pinrail-sdk package from
# pinrail-plugin/: its tests and the samples' check run, the tag has to name the
# package's version, and the tarball npm pack writes is attached to a GitHub
# release of the same tag. That tarball is what a scaffolded plugin depends
# on until the package is on npm:
#
#   https://github.com/forgeplane/pinrail/releases/download/sdk-v1.0.0/pinrail-sdk-1.0.0.tgz
#
# Publishing to npm is the last job, and runs only once the repository
# variable PUBLISH_PINRAIL_SDK is "npm" (Settings › Variables) and the
# NPM_TOKEN secret is set. Once the package is on npm, the dependency that
# `pinrail plugins new --playwright` writes (cli/src/scaffold.rs) should name
# its version there rather than the release's tarball.
name: sdk release

on:
  push:
    tags: ["sdk-v*"]

# read-only, unless a job asks for more
permissions:
  contents: read

jobs:
  tarball:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # a release builds from nothing a cache could have changed
          package-manager-cache: false
      - name: The version, from the tag and the package
        id: version
        working-directory: pinrail-plugin
        run: |
          tagged="${GITHUB_REF_NAME#sdk-v}"
          declared=$(node -p 'require("./package.json").version')
          test "$declared" = "$tagged" || { echo "package.json says $declared, tag says $tagged"; exit 1; }
          echo "version=$tagged" >> "$GITHUB_OUTPUT"
      # `pinrail plugins check` checks the plugins, so the CLI goes on the
      # PATH before anything checks one
      - name: Rust toolchain
        run: rustup toolchain install
      - name: Build the CLI
        run: |
          cargo build --manifest-path cli/Cargo.toml --locked
          echo "$PWD/cli/target/debug" >> "$GITHUB_PATH"
      - name: The package's tests
        working-directory: pinrail-plugin
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test
      - name: The samples pass check
        run: |
          for dir in plugins/*/; do
            pinrail plugins check "$dir"
          done
      # npm names a scoped package's tarball after its scope too; the
      # scaffolds depend on the name without it
      - name: Pack
        working-directory: pinrail-plugin
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: mv "$(npm pack --json | jq -r '.[0].filename')" "pinrail-sdk-$VERSION.tgz"
      # the app's updater and the download links read this repository's
      # latest release, which must stay the app's
      - name: Release the tarball
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "$GITHUB_REF_NAME" "pinrail-plugin/pinrail-sdk-$VERSION.tgz" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --notes "" --latest=false

  npm:
    needs: tarball
    if: vars.PUBLISH_PINRAIL_SDK == 'npm'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - working-directory: pinrail-plugin
        run: |
          npm ci
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
