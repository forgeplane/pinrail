# A tag sdk-v<version> (sdk-v1.0.0) releases the pinrail-plugin package from
# pinrail-plugin/: its tests and the samples' check run, the tag has to name the
# package's version, and the tarball npm pack writes is attached to a GitHub
# release of the same tag. That tarball is what a scaffolded plugin depends
# on until the package is on npm:
#
#   https://github.com/forgeplane/pinrail/releases/download/sdk-v1.0.0/pinrail-plugin-1.0.0.tgz
#
# Publishing to npm is the last job, and runs only once the repository
# variable PUBLISH_PINRAIL_PLUGIN is "npm" (Settings › Variables) and the
# NPM_TOKEN secret is set; pinrail-plugin/lib/create.mjs then switches the
# scaffold's dependency to a caret range.
name: sdk release

on:
  push:
    tags: ["sdk-v*"]

jobs:
  tarball:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: The version, from the tag and the package
        id: version
        working-directory: pinrail-plugin
        run: |
          tagged="${GITHUB_REF_NAME#sdk-v}"
          declared=$(node -p 'require("./package.json").version')
          test "$declared" = "$tagged" || { echo "package.json says $declared, tag says $tagged"; exit 1; }
          echo "version=$tagged" >> "$GITHUB_OUTPUT"
      - name: The package's tests
        working-directory: pinrail-plugin
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test
      - name: The samples pass check
        run: |
          for dir in plugins/*/; do
            node pinrail-plugin/bin/pinrail-plugin.mjs check "$dir"
          done
      # npm names a scoped package's tarball after its scope too; the
      # scaffolds depend on the name without it
      - name: Pack
        working-directory: pinrail-plugin
        run: mv "$(npm pack --json | jq -r '.[0].filename')" "pinrail-plugin-${{ steps.version.outputs.version }}.tgz"
      # the app's updater and the download links read this repository's
      # latest release, which must stay the app's
      - uses: softprops/action-gh-release@v2
        with:
          files: pinrail-plugin/pinrail-plugin-${{ steps.version.outputs.version }}.tgz
          fail_on_unmatched_files: true
          make_latest: "false"

  npm:
    needs: tarball
    if: vars.PUBLISH_PINRAIL_PLUGIN == 'npm'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - working-directory: pinrail-plugin
        run: |
          npm ci
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
