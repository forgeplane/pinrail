<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ship it?</title>
<link rel="stylesheet" href="/sdk/v1/pinrail-plugin.css">
<style>
  /* The tokens, the base and the pinrail-btn, pinrail-note, pinrail-tone and pinrail-chip classes come
     from the SDK stylesheet; these rules are all this view adds. */
  .ship { max-width: 720px; }
  .ship h1 { display: flex; align-items: baseline; gap: 8px; margin: 2px 0 16px; font-size: 18px; }
  .ship h1 .pinrail-chip { font-size: 12px; }
  .ship section { margin: 14px 0; }
  .ship ul { list-style: none; display: grid; gap: 6px; margin: 6px 0 0; padding: 0; }
  .ship li { display: flex; align-items: center; gap: 8px; }
  .ship li[data-passed="true"] .pinrail-icon { color: var(--pinrail-success); }
  .ship li[data-passed="false"] .pinrail-icon { color: var(--pinrail-danger); }
  .ship .detail { color: var(--pinrail-dim); }
  .ship .choice { display: flex; gap: 8px; margin: 20px 0 10px; }
  .ship .choice .pinrail-btn { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; }
  .ship textarea { display: block; width: 100%; max-width: 520px; min-height: 64px; }
  .ship .pinrail-errors { min-height: 16px; margin-top: 8px; }
  .ship .decided { margin-top: 20px; font-size: 13.5px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="/sdk/v1/pinrail-plugin.js"></script>
<script type="module" src="./main.ts"></script>
</body>
</html>
