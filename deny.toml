# The licences Pinrail's Rust dependencies may carry: the desktop workspace
# and the CLI, which ships inside the app. CI runs
#
#   cargo deny --manifest-path desktop/Cargo.toml --config deny.toml check licenses
#   cargo deny --manifest-path cli/Cargo.toml --config deny.toml check licenses
#
# and a dependency under anything else fails the build until it is reviewed
# and, if it fits, added here. All of these are permissive, or copyleft only
# for the files they cover (MPL-2.0), so the app stays Apache-2.0 as a whole.
# A crate offering a choice ("MIT OR LGPL") passes on any allowed option.

[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.93
# one list serves both workspaces, so a licence only one of them uses is fine
unused-allowed-license = "allow"

# Pinrail's own crates are not published; their licence is ours to set
[licenses.private]
ignore = true
