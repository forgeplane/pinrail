<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pinrail plugin shell</title>
<style>
  :root {
    --bg: #18191b; --panel: #1b1c20; --raised: #202126; --hover: #232428; --line: #2b2d31; --line-strong: #44474e;
    --text: #ededef; --dim: #999ba5; --faint: #7b7d87; --accent: #a1a5ef; --accent-bg: #292a3c; --button: #6873d6; --ok: #7cc79e; --danger: #e48c98;
    --sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    color-scheme: dark;
  }
  [data-theme="light"] {
    --bg: #ffffff; --panel: #ffffff; --raised: #f6f7f9; --hover: #f3f4f7; --line: #e8e9ed; --line-strong: #cdd0d7;
    --text: #24262c; --dim: #72757f; --faint: #888b94; --accent: #5965cb; --accent-bg: #f0f0fa; --button: #5965bc; --ok: #28795c; --danger: #bc4655;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--text); font: 13px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel); flex: none; flex-wrap: wrap; }
  .bar b { font-weight: 600; margin-right: 4px; }
  .bar .v { color: var(--faint); font: 11.5px var(--mono); margin-right: 8px; }
  select, button, input[type=text] { font: inherit; color: var(--text); background: var(--raised); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; }
  button { cursor: pointer; }
  button:hover, select:hover { background: var(--hover); }
  button.primary { background: var(--button); border-color: transparent; color: #fff; font-weight: 600; }
  button:disabled { opacity: 0.5; cursor: default; }
  label.check { display: inline-flex; align-items: center; gap: 5px; color: var(--dim); }
  .spacer { flex: 1; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); display: inline-block; }
  .dot.on { background: var(--ok); }
  .main { flex: 1; display: flex; min-height: 0; }
  .stage { flex: 1; min-width: 0; overflow: auto; padding: 14px; }
  iframe { display: block; width: 100%; height: 400px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  .stage.fill { padding: 0; overflow: hidden; }
  .stage.fill iframe { height: 100%; border: 0; border-radius: 0; }
  .side { width: 360px; flex: none; border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
  .side h2 { margin: 0; padding: 10px 12px 6px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); }
  .state { padding: 0 12px 10px; display: grid; gap: 6px; border-bottom: 1px solid var(--line); }
  .state div { display: grid; grid-template-columns: 60px 1fr; gap: 8px; font-size: 12px; }
  .state span { color: var(--faint); }
  .state code, .log code { font: 11.5px var(--mono); white-space: pre-wrap; word-break: break-word; color: var(--text); }
  .log { flex: 1; overflow-y: auto; padding: 6px 8px; display: flex; flex-direction: column; gap: 4px; }
  .msg { padding: 6px 8px; border-radius: 6px; background: var(--raised); font-size: 12px; }
  .msg .t { display: flex; justify-content: space-between; color: var(--dim); margin-bottom: 2px; }
  .msg .t b { color: var(--accent); font-weight: 600; }
  .msg.out { background: transparent; border: 1px dashed var(--line-strong); }
  .msg.out .t b { color: var(--dim); }
  .send { padding: 8px 12px; border-top: 1px solid var(--line); display: grid; gap: 6px; }
  .send textarea { width: 100%; min-height: 54px; font: 11.5px var(--mono); color: var(--text); background: var(--raised); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; resize: vertical; }
  .send .row { display: flex; gap: 6px; }
  .empty { color: var(--faint); padding: 14px 12px; font-size: 12px; }
  .warn { color: var(--danger); font-size: 12px; }
</style>
</head>
<body>
<div class="bar">
  <b id="name">plugin</b><span class="v" id="version"></span>
  <select id="fixture" title="The review the view is initialised with"></select>
  <select id="previous" title="A decided fixture handed over as the previous round"><option value="">no previous round</option></select>
  <label class="check"><input type="checkbox" id="readonly"> read-only</label>
  <button id="reinit" title="Send init again, with the last draft">Re-init</button>
  <button id="collect" class="primary" title="What the app's hand-over button does">Collect</button>
  <span class="spacer"></span>
  <span class="dot" id="watch" title="reloads the view when a file in the plugin changes"></span>
  <button id="theme" title="Switch theme">Theme</button>
</div>
<div class="main">
  <div class="stage" id="stage"><iframe id="frame" sandbox="allow-scripts" title="plugin"></iframe></div>
  <aside class="side">
    <h2>Settings</h2>
    <div class="state" id="settings"><div class="empty" style="padding:0 0 4px">The manifest declares none.</div></div>
    <h2>Shortcuts</h2>
    <div class="state" id="shortcuts"><div class="empty" style="padding:0 0 4px">The manifest declares none; declared keys reach the view from this page too.</div></div>
    <h2>State</h2>
    <div class="state">
      <div><span>status</span><code id="s-status">—</code></div>
      <div><span>draft</span><code id="s-draft">—</code></div>
      <div><span>submit</span><code id="s-submit">—</code></div>
    </div>
    <h2>Messages</h2>
    <div class="log" id="log"><div class="empty">Nothing yet. The view posts <code>ready</code> when its SDK connects.</div></div>
    <div class="send">
      <textarea id="violations" placeholder='[{"path":"/items/0","message":"is required"}]'></textarea>
      <div class="row">
        <button id="send-violations" title="Reply to the last submit with these violations">Send violations</button>
        <button id="send-submitted" title="Reply to the last submit as accepted">Send submitted</button>
      </div>
    </div>
  </aside>
</div>
<script>
"use strict";
// The shell side of the protocol, as in the app: init on ready, collect on
// demand, violations or submitted in answer to a submit. Everything the view
// posts goes into the log and the state panel.
const $ = (id) => document.getElementById(id);
const frame = $("frame"), stage = $("stage"), log = $("log");
let manifest = {}, fixtures = [], review = null, previous = null, draft = null, lastSubmit = null, ready = false, stamp = null;
const THEME_KEY = "pinrail-shell:theme";
let theme = localStorage.getItem(THEME_KEY) === "light" ? "light" : "dark";
document.documentElement.dataset.theme = theme;

// The envelope as the app hands it to a view, around the fixture's fields.
const reviewFrom = (partial, name) => ({
  id: "g_dev", plugin: name, plugin_version: Number(String(manifest.version ?? 1).split(".")[0]) || 1,
  title: "dev review", origin: { repo: "dev", workflow: "shell" },
  requested_by: "dev", created_at: new Date().toISOString(), expires_at: null, revises: null,
  summary: null, status: partial.decision ? "decided" : "pending", decision: null, agent_note: null, payload: {}, ...partial,
});

function post(msg) { frame.contentWindow.postMessage({ pinrail: 1, ...msg }, "*"); note(msg, "out"); }
function note(msg, dir) {
  if (log.querySelector(".empty")) log.replaceChildren();
  const el = document.createElement("div");
  el.className = "msg " + dir;
  const { pinrail, type, ...rest } = msg;
  el.innerHTML = `<div class="t"><b>${dir === "out" ? "→ " : "← "}${type}</b><span>${new Date().toLocaleTimeString()}</span></div>` +
    (Object.keys(rest).length ? `<code>${escapeHtml(JSON.stringify(rest, null, 1).slice(0, 1200))}</code>` : "");
  log.append(el);
  log.scrollTop = log.scrollHeight;
}
const escapeHtml = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const show = (id, v) => { $(id).textContent = v == null ? "—" : typeof v === "string" ? v : JSON.stringify(v); };

function sendInit() {
  if (!ready || !review) return;
  post({ type: "appearance", theme });
  post({ type: "init", review, previous, readonly: $("readonly").checked || review.status !== "pending", draft, settings: settingsNow(), shell_origin: location.origin, capabilities: ["attachments"] });
}

// The plugin's own settings, from the manifest's settings_schema: the
// defaults under what was set here, kept per plugin in localStorage. A row
// per property, as the app draws them; a change goes to the view as
// `settings`, and a `settings_set` from the view lands here and goes back.
const SETTINGS_KEY = () => "pinrail-shell:settings:" + manifest.name;
let stored = {};
const schemaProps = () => (manifest.settings_schema && manifest.settings_schema.properties) || {};
function settingsNow() {
  const out = {};
  for (const [key, p] of Object.entries(schemaProps())) out[key] = key in stored ? stored[key] : p.default;
  return out;
}
function setStored(patch) {
  stored = { ...stored, ...patch };
  localStorage.setItem(SETTINGS_KEY(), JSON.stringify(stored));
  drawSettings();
  if (ready) post({ type: "settings", settings: settingsNow() });
}
function drawSettings() {
  const box = $("settings");
  const props = Object.entries(schemaProps());
  if (!props.length) return;
  box.replaceChildren();
  const now = settingsNow();
  for (const [key, p] of props) {
    const row = document.createElement("div");
    const label = document.createElement("span");
    label.textContent = p.title || key;
    label.title = key;
    let control;
    const choices = p.oneOf ? p.oneOf.map((c) => [String(c.const), c.title || String(c.const)]) : p.enum ? p.enum.map((v) => [String(v), String(v)]) : null;
    if (p.type === "boolean") {
      control = document.createElement("input");
      control.type = "checkbox";
      control.checked = now[key] === true;
      control.addEventListener("change", () => setStored({ [key]: control.checked }));
    } else if (choices) {
      control = document.createElement("select");
      for (const [value, text] of choices) {
        const o = document.createElement("option");
        o.value = value; o.textContent = text; o.selected = String(now[key]) === value;
        control.append(o);
      }
      control.addEventListener("change", () => setStored({ [key]: control.value }));
    } else {
      control = document.createElement("input");
      control.type = p.type === "string" ? "text" : "number";
      control.value = now[key] == null ? "" : String(now[key]);
      if (p.minimum != null) control.min = p.minimum;
      if (p.maximum != null) control.max = p.maximum;
      control.addEventListener("change", () => setStored({ [key]: p.type === "string" ? control.value : Number(control.value) }));
    }
    control.setAttribute("aria-label", p.title || key);
    row.append(label, control);
    box.append(row);
  }
}

// which fixture each round came from, for the files it carries
let reviewFixture = "", previousFixture = "";

async function answerAttachment(msg) {
  const previousRound = msg.round === "previous";
  const from = previousRound ? previous : review;
  const listed = from && (from.attachments || []).find((a) => a.name === msg.name);
  const fail = (error) => post({ type: "attachment", req: msg.req, ok: false, name: msg.name, error });
  if (!listed) return fail(`no attachment "${msg.name}" on this ${previousRound ? "previous round" : "review"}`);
  const fixture = previousRound ? previousFixture : reviewFixture;
  const response = await fetch("/dev/attachments/" + encodeURIComponent(fixture) + "/" + encodeURIComponent(msg.name));
  if (!response.ok) return fail(`could not fetch ${msg.name}`);
  const bytes = await response.arrayBuffer();
  frame.contentWindow.postMessage({ pinrail: 1, type: "attachment", req: msg.req, ok: true, name: msg.name, media_type: listed.media_type, size: listed.size, bytes }, "*", [bytes]);
  note({ type: "attachment", req: msg.req, ok: true, name: msg.name, size: listed.size }, "out");
}

// A draft is kept per fixture for the browser session, as the app keeps one
// per review: reloading the page brings it back, a hand-over clears it.
const DRAFT_KEY = () => `pinrail-shell:draft:${manifest.name}:${reviewFixture}`;
function keepDraft(data) {
  try {
    if (data == null) sessionStorage.removeItem(DRAFT_KEY());
    else sessionStorage.setItem(DRAFT_KEY(), JSON.stringify(data));
  } catch {
    // no storage: the draft lasts until the page reloads
  }
}
function keptDraft() {
  try {
    return JSON.parse(sessionStorage.getItem(DRAFT_KEY()) ?? "null");
  } catch {
    return null;
  }
}

async function loadFixture(name) {
  reviewFixture = name || "";
  draft = keptDraft(); lastSubmit = null; show("s-draft", draft); show("s-submit", null); show("s-status", null);
  const partial = name ? await (await fetch("/dev/fixtures/" + encodeURIComponent(name))).json() : { title: "empty", payload: {} };
  review = reviewFrom(partial, manifest.name);
  localStorage.setItem("pinrail-shell:fixture:" + manifest.name, name);
  reload();
}

async function loadPrevious(name) {
  previousFixture = name || "";
  previous = name ? reviewFrom(await (await fetch("/dev/fixtures/" + encodeURIComponent(name))).json(), manifest.name) : null;
  sendInit();
}

function reload() {
  ready = false;
  // a frame pointed at the address it already shows does not load again, so
  // every reload is an address of its own
  frame.src = "/plugin/view/index.html?load=" + Date.now() + "#pinrail-theme=" + theme;
}

window.addEventListener("message", (event) => {
  if (event.source !== frame.contentWindow) return;
  const msg = event.data;
  if (!msg || msg.pinrail !== 1) return;
  note(msg, "in");
  switch (msg.type) {
    case "ready": ready = true; sendInit(); break;
    case "resize":
      if (msg.height === "fill") { stage.classList.add("fill"); }
      else { stage.classList.remove("fill"); frame.style.height = Math.max(manifest.min_height || 200, Math.ceil(msg.height)) + "px"; }
      break;
    case "draft": draft = msg.data; keepDraft(draft); show("s-draft", draft); break;
    case "status": show("s-status", msg.label); break;
    // in the app the system browser opens it; here, a tab
    case "open": window.open(msg.url, "_blank", "noreferrer"); break;
    case "settings_set":
      // as the app: a change the settings schema refuses comes back as
      // violations; one it allows is kept, and everyone hears the values
      if (msg.patch && typeof msg.patch === "object" && !Array.isArray(msg.patch)) {
        const patch = msg.patch;
        check("settings", patch).then((errors) => (errors.length ? post({ type: "violations", errors }) : setStored(patch)));
      }
      break;
    case "submit":
      // as the app: a decision the schema refuses comes back as violations,
      // one it accepts as submitted; the buttons below reply otherwise
      lastSubmit = msg.data;
      show("s-submit", lastSubmit);
      check("decision", lastSubmit).then((errors) => (errors.length ? post({ type: "violations", errors }) : submitted()));
      break;
    case "attachment": answerAttachment(msg); break;
  }
});

$("fixture").addEventListener("change", (e) => loadFixture(e.target.value));
$("previous").addEventListener("change", (e) => loadPrevious(e.target.value));
$("readonly").addEventListener("change", sendInit);
$("reinit").addEventListener("click", sendInit);
$("collect").addEventListener("click", () => post({ type: "collect" }));
$("send-violations").addEventListener("click", () => {
  let errors;
  try { errors = JSON.parse($("violations").value || "[]"); } catch { alert("violations must be a JSON array of {path, message}"); return; }
  post({ type: "violations", errors });
});
/** What the app would refuse in a decision or a settings change, from the dev server. */
async function check(kind, data) {
  const answer = await fetch("/dev/check", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ kind, data }) });
  return answer.ok ? (await answer.json()).errors : [];
}
function submitted() {
  draft = null;
  keepDraft(null);
  review = { ...review, status: "decided", decision: { decided_by: "dev", decided_at: new Date().toISOString(), data: lastSubmit } };
  post({ type: "submitted", decision: review.decision });
}
$("send-submitted").addEventListener("click", () => {
  if (lastSubmit == null) { alert("nothing was submitted yet: press Collect first"); return; }
  submitted();
});
$("theme").addEventListener("click", () => {
  theme = theme === "dark" ? "light" : "dark";
  localStorage.setItem(THEME_KEY, theme);
  document.documentElement.dataset.theme = theme;
  post({ type: "appearance", theme });
});

// The manifest's shortcuts, pressed while this page rather than the frame
// has focus, go to the view as the app sends them: a `key` message the SDK
// turns into a keydown on the view's document.
const comboOf = (e) => {
  const names = { Slash: "/", BracketLeft: "[", BracketRight: "]", Comma: ",", Period: ".", Minus: "-", Equal: "=", Semicolon: ";", Quote: "'", Backquote: "`", Backslash: "\\" };
  let name = /^Key(.)$/.test(e.code) ? e.code.slice(3).toLowerCase() : /^Digit(.)$/.test(e.code) ? e.code.slice(5) : names[e.code] || e.code.toLowerCase();
  if (!name || /^(shift|control|alt|meta)(left|right)?$/.test(name)) return null;
  const mods = [e.ctrlKey && "ctrl", e.altKey && "alt", e.shiftKey && "shift", e.metaKey && "cmd"].filter(Boolean);
  return [...mods, name].join("+");
};
window.addEventListener("keydown", (e) => {
  const tag = e.target && e.target.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
  const combo = comboOf(e);
  const declared = (manifest.shortcuts || []).some((s) => s.keys === combo);
  if (!combo || !declared || !ready) return;
  e.preventDefault();
  post({ type: "key", key: e.key, code: e.code, metaKey: e.metaKey, ctrlKey: e.ctrlKey, altKey: e.altKey, shiftKey: e.shiftKey });
});

// files change, the view reloads; the draft comes back with the next init
setInterval(async () => {
  try {
    const { stamp: now } = await (await fetch("/dev/stamp")).json();
    $("watch").classList.add("on");
    if (stamp !== null && now !== stamp) reload();
    stamp = now;
  } catch { $("watch").classList.remove("on"); }
}, 1000);

(async () => {
  manifest = await (await fetch("/dev/manifest")).json();
  try { stored = JSON.parse(localStorage.getItem(SETTINGS_KEY()) || "{}"); } catch { stored = {}; }
  drawSettings();
  if (Array.isArray(manifest.shortcuts) && manifest.shortcuts.length) {
    const box = $("shortcuts");
    box.replaceChildren();
    for (const s of manifest.shortcuts) {
      const row = document.createElement("div");
      const keys = document.createElement("span"); keys.textContent = s.keys;
      const does = document.createElement("code"); does.textContent = s.does;
      row.append(keys, does);
      box.append(row);
    }
  }
  $("name").textContent = manifest.title || manifest.name;
  $("version").textContent = `${manifest.name} v${manifest.version}`;
  document.title = `${manifest.name} · pinrail plugin shell`;
  fixtures = await (await fetch("/dev/fixtures")).json();
  const sel = $("fixture"), prev = $("previous");
  if (fixtures.length === 0) sel.append(new Option("no fixtures/ directory: empty payload", ""));
  // a decided fixture says so, since its title is often the pending one's
  for (const f of fixtures) {
    const label = f.decided ? `${f.title} (decided)` : f.title;
    sel.append(new Option(label, f.name));
    if (f.decided) prev.append(new Option(label, f.name));
  }
  const remembered = localStorage.getItem("pinrail-shell:fixture:" + manifest.name);
  const first = fixtures.find((f) => f.name === remembered) ? remembered : fixtures[0]?.name ?? "";
  sel.value = first;
  await loadFixture(first);
})();
</script>
</body>
</html>
