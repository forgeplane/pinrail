<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>list gate</title>
<link rel="stylesheet" href="/sdk/v1/wicket-plugin.css">
<style>
  /* Tokens, base and the shared pieces (.item, .sev, .btn, .note, .meta,
     .empty, .notice, code.inl) come from the SDK stylesheet. What is left is
     this view's own: the groups, the verdict column and the running tally. */
  .intro { color: var(--dim); max-width: 72ch; margin: 0 0 14px; }
  .intro p:first-child { margin-top: 0; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 8px 0 12px; border-bottom: 1px solid var(--border); margin-bottom: 14px; font-size: 12px; color: var(--dim); }
  h2.group { font: inherit; font-family: var(--mono); font-size: 12px; color: var(--dim); margin: 18px 0 8px; display: flex; align-items: baseline; gap: 10px; }
  h2.group:first-of-type { margin-top: 0; }
  h2.group .count { font-family: var(--sans); font-size: 11px; color: var(--faint); }

  .item.accepted { box-shadow: inset 2px 0 color-mix(in oklab, var(--ok) 70%, transparent); }
  .item.rejected { box-shadow: inset 2px 0 color-mix(in oklab, var(--danger) 70%, transparent); }
  .verdict { margin-left: auto; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
  .verdict.accept { color: var(--ok); } .verdict.reject { color: var(--danger); } .verdict.undecided { color: var(--sev-major); }
  .previous { margin-top: 6px; font-size: 11.5px; color: var(--faint); }
  .previous b { color: var(--dim); font-weight: 600; }

  /* Accept and reject say which they are, so they do not take the shared
     pressed styling. */
  .btn.accept.on { background: color-mix(in oklab, var(--ok) 80%, oklch(0.3 0.06 150)); border-color: transparent; color: white; }
  .btn.reject.on { background: color-mix(in oklab, var(--danger) 18%, transparent); border-color: color-mix(in oklab, var(--danger) 55%, transparent); color: var(--danger); }
  textarea.note { flex: 1 1 260px; min-height: 30px; padding: 5px 9px; }
  .note-ro { flex: 1 1 260px; font-size: 12.5px; padding: 4px 0; white-space: pre-wrap; }
  .note-ro .label { color: var(--faint); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; margin-right: 6px; }

  .additions { margin-top: 20px; }
  .addition { display: flex; gap: 8px; align-items: flex-start; margin-top: 8px; }
  .addition select { background: var(--bg); border: 1px solid var(--border-strong); border-radius: 6px; padding: 5px 8px; font-size: 12px; max-width: 260px; }
  .footer { position: sticky; bottom: 0; margin-top: 18px; padding: 10px 0 0; border-top: 1px solid var(--border); background: var(--bg-panel); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 12.5px; }
  .footer .tally { color: var(--dim); }
  .footer .tally b { color: var(--text); }
  .footer .tally.warn { color: var(--sev-major); }
  .errors { margin-top: 10px; }
  .done { margin-bottom: 14px; }
</style>
</head>
<body>
<div id="app" class="plugin-content empty">waiting for the shell…</div>
<script src="/sdk/v1/wicket-plugin.js"></script>
<script>
"use strict";
/* The built-in list gate: items grouped under headings, accept / reject /
   note per item, free-text additions, and an honest `undecided` list. The
   SDK handles the protocol; this file renders and keeps the decision state. */

const app = document.getElementById("app");
const esc = Wicket.escape, markdown = Wicket.markdown;
let gate = null, previous = null, readonly = false;
const S = { decisions: {}, additions: [], armed: false, errors: null };

const plugin = Wicket.connect({
  resize: "auto",
  onInit(init) {
    gate = init.gate; previous = init.previous; readonly = init.readonly;
    S.errors = null; S.armed = false;
    if (readonly) loadDecision(gate.decision && gate.decision.data);
    else if (init.draft && init.draft.decisions) { S.decisions = init.draft.decisions; S.additions = init.draft.additions || []; }
    else { S.decisions = {}; S.additions = []; }
    render();
  },
  onViolations(errors) { S.errors = errors; S.armed = false; render(); },
  onSubmitted(decision) { readonly = true; loadDecision(decision && decision.data); render(); },
  onCollect() { handOver(); },
});

/* Drafts: a click posts at once, so a reload right after it loses nothing;
   typing is debounced so every keystroke does not cross the bridge. */
const draftData = () => ({ decisions: S.decisions, additions: S.additions });
const postDraft = () => plugin.draft(draftData(), { flush: true });
const draft = () => plugin.draft(draftData());

/* ---------- state ---------- */
const items = () => (gate.payload.groups || []).flatMap((g) => g.items.map((i) => ({ ...i, group: g.title })));
const itemIds = () => items().map((i) => i.id);

function loadDecision(data) {
  S.decisions = {}; S.additions = [];
  if (!data) return;
  for (const d of data.decisions || []) S.decisions[d.id] = { action: d.action, note: d.note || "" };
  S.additions = (data.additions || []).map((a) => ({ group: a.group || "", body: a.body }));
}

function decisionData() {
  const decisions = [], undecided = [];
  for (const id of itemIds()) {
    const d = S.decisions[id];
    if (d && d.action) {
      const out = { id, action: d.action };
      if (d.note && d.note.trim()) out.note = d.note.trim();
      decisions.push(out);
    } else {
      undecided.push(id);
    }
  }
  const data = { decisions, undecided };
  const additions = S.additions.filter((a) => a.body && a.body.trim()).map((a) => (a.group ? { group: a.group, body: a.body.trim() } : { body: a.body.trim() }));
  if (additions.length) data.additions = additions;
  return data;
}

function tally() {
  let accept = 0, reject = 0, undecided = 0;
  for (const id of itemIds()) {
    const d = S.decisions[id];
    if (d && d.action === "accept") accept++; else if (d && d.action === "reject") reject++; else undecided++;
  }
  return { accept, reject, undecided, total: accept + reject + undecided };
}

function setAction(id, action) {
  const cur = S.decisions[id] || { action: null, note: "" };
  S.decisions[id] = { ...cur, action: cur.action === action ? null : action };
  S.armed = false;
  postDraft(); render();
}

function setNote(id, note) {
  S.decisions[id] = { ...(S.decisions[id] || { action: null }), note };
  draft();
}

/* The shell's hand-over button asks for the decision. Items left undecided
   are reported as such, so say so once and let the next press confirm. */
function handOver() {
  if (readonly) return;
  const t = tally();
  if (t.undecided > 0 && !S.armed) { S.armed = true; render(); return; }
  S.errors = null;
  plugin.submit(decisionData());
}

function syncStatus() {
  plugin.status({ label: S.armed ? "Hand over anyway" : "Hand over" });
}

/* ---------- render ---------- */
const sevClass = (s) => ["blocker", "major", "minor", "nit"].includes(s) ? `sev-${s}` : "sev-other";

function previousLine(id) {
  const prev = Wicket.previousVerdict(previous, id);
  if (!prev) return "";
  const text = prev.action + (prev.note ? ": " + prev.note : "");
  return `<div class="previous"><b>previous round:</b> ${esc(text)}</div>`;
}

function renderItem(item) {
  const d = S.decisions[item.id] || { action: null, note: "" };
  const cls = d.action === "accept" ? "accepted" : d.action === "reject" ? "rejected" : "";
  const meta = item.meta && typeof item.meta === "object"
    ? Object.entries(item.meta).map(([k, v]) => `<span class="meta">${esc(k)}: ${esc(typeof v === "object" ? JSON.stringify(v) : v)}</span>`).join("")
    : "";
  const verdict = d.action || "undecided";
  const head = `<div class="head"><span class="id">#${esc(item.id)}</span>
      ${item.severity ? `<span class="sev ${sevClass(item.severity)}">${esc(item.severity)}</span>` : ""}
      <span class="title">${esc(item.title)}</span>${meta}
      <span class="verdict ${verdict}">${verdict}</span></div>
    ${item.body ? `<div class="body">${markdown(item.body)}</div>` : ""}
    ${previousLine(item.id)}`;
  if (readonly) {
    const note = d.note ? `<div class="controls"><div class="note-ro"><span class="label">${d.action === "reject" ? "reason" : "note"}</span>${esc(d.note)}</div></div>` : "";
    return `<div class="item ${cls}" data-id="${item.id}">${head}${note}</div>`;
  }
  const placeholder = d.action === "reject" ? "why (becomes a lesson for the agent)" : d.action === "accept" ? "revise before acting (optional)" : "note (optional)";
  return `<div class="item ${cls}" data-id="${item.id}">${head}
    <div class="controls">
      <button type="button" class="btn accept ${d.action === "accept" ? "on" : ""}" data-act="accept" data-id="${item.id}" aria-pressed="${d.action === "accept"}">Accept</button>
      <button type="button" class="btn reject ${d.action === "reject" ? "on" : ""}" data-act="reject" data-id="${item.id}" aria-pressed="${d.action === "reject"}">Reject</button>
      <textarea class="note" rows="1" data-note="${item.id}" placeholder="${placeholder}" aria-label="note for item ${esc(item.id)}">${esc(d.note || "")}</textarea>
    </div>
  </div>`;
}

function renderAdditions() {
  const groups = (gate.payload.groups || []).map((g) => g.title);
  if (readonly) {
    if (!S.additions.length) return "";
    return `<section class="additions"><div class="eyebrow">your additions</div>
      ${S.additions.map((a) => `<div class="item"><div class="head">${a.group ? `<span class="meta">${esc(a.group)}</span>` : ""}</div><div class="body">${markdown(a.body)}</div></div>`).join("")}
    </section>`;
  }
  if (!gate.payload.allow_additions) return "";
  return `<section class="additions"><div class="eyebrow">your additions</div>
    ${S.additions.map((a, i) => `<div class="addition">
      <select data-add-group="${i}" aria-label="group for addition ${i + 1}"><option value="">(no group)</option>${groups.map((g) => `<option value="${esc(g)}" ${a.group === g ? "selected" : ""}>${esc(g)}</option>`).join("")}</select>
      <textarea class="note" rows="2" data-add-body="${i}" placeholder="markdown" aria-label="addition ${i + 1}">${esc(a.body || "")}</textarea>
      <button type="button" class="btn ghost" data-add-remove="${i}" aria-label="remove addition ${i + 1}">×</button>
    </div>`).join("")}
    <div style="margin-top:8px"><button type="button" class="btn ghost" id="add-addition">+ add a note of your own</button></div>
  </section>`;
}

function render() {
  const groups = gate.payload.groups || [];
  const t = tally();
  let html = "";
  if (readonly) {
    const dec = gate.decision;
    html += dec
      ? `<div class="done notice ok">Decided${dec.decided_by ? ` by <b>${esc(dec.decided_by)}</b>` : ""}: <b>${t.accept}</b> accepted, <b>${t.reject}</b> rejected, <b>${t.undecided}</b> undecided.</div>`
      : `<div class="done notice ok">Closed without a decision (${esc(gate.status)}). Read-only.</div>`;
  }
  if (gate.payload.intro) html += `<div class="intro">${markdown(gate.payload.intro)}</div>`;
  if (!readonly) {
    html += `<div class="bar"><span><b>${t.total}</b> items</span><span class="spacer"></span>
      <button type="button" class="btn ghost" id="accept-rest">accept all undecided</button>
      <button type="button" class="btn ghost" id="clear-all">clear</button></div>`;
  }
  if (!groups.length) html += `<div class="empty">Nothing to decide.</div>`;
  for (const g of groups) {
    html += `<h2 class="group">${esc(g.title)}<span class="count">${g.items.length}</span></h2>`;
    for (const item of g.items) html += renderItem({ ...item, group: g.title });
  }
  html += renderAdditions();
  if (S.errors && S.errors.length) {
    html += `<div class="errors notice danger" id="errors">${S.errors.map((e) => `${esc(e.path || "/")}: ${esc(e.message)}`).join("\n")}</div>`;
  }
  if (!readonly) {
    html += `<div class="footer">
      <span class="tally"><b>${t.accept}</b> accepted · <b>${t.reject}</b> rejected · <b>${t.undecided}</b> undecided</span>
      <span class="spacer" style="flex:1"></span>
      ${S.armed ? `<span class="tally warn">${t.undecided} left undecided — they go back marked undecided. Hand over again to confirm.</span><button type="button" class="btn ghost" id="disarm">keep deciding</button>` : ""}
    </div>`;
  }
  app.className = "plugin-content";
  app.innerHTML = html;
  bind();
  if (!readonly) syncStatus();
}

function bind() {
  if (readonly) return;
  app.querySelectorAll("button[data-act]").forEach((b) => b.onclick = () => setAction(+b.dataset.id, b.dataset.act));
  app.querySelectorAll("textarea[data-note]").forEach((t) => {
    t.oninput = () => setNote(+t.dataset.note, t.value);
    t.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey && !(e.metaKey || e.ctrlKey)) { e.preventDefault(); t.blur(); } };
  });
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  on("disarm", () => { S.armed = false; render(); });
  on("accept-rest", () => { for (const id of itemIds()) if (!(S.decisions[id] && S.decisions[id].action)) S.decisions[id] = { ...(S.decisions[id] || {}), action: "accept" }; S.armed = false; postDraft(); render(); });
  on("clear-all", () => { S.decisions = {}; S.armed = false; postDraft(); render(); });
  on("add-addition", () => { S.additions.push({ group: "", body: "" }); postDraft(); render(); const last = app.querySelector(`textarea[data-add-body="${S.additions.length - 1}"]`); if (last) last.focus(); });
  app.querySelectorAll("[data-add-remove]").forEach((b) => b.onclick = () => { S.additions.splice(+b.dataset.addRemove, 1); postDraft(); render(); });
  app.querySelectorAll("[data-add-body]").forEach((t) => t.oninput = () => { S.additions[+t.dataset.addBody].body = t.value; draft(); });
  app.querySelectorAll("[data-add-group]").forEach((s) => s.onchange = () => { S.additions[+s.dataset.addGroup].group = s.value; postDraft(); });
}
</script>
</body>
</html>
