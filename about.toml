# cargo-about: the Rust half of the third-party notices shipped with the app.
# desktop/app/scripts/build-notices.mjs runs it over the desktop workspace and
# the CLI. The accepted list is deny.toml's, which CI enforces.

accepted = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

# only what ships: the platforms Pinrail is built for, and no crates that run
# only at build time or in tests
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
