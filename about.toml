# cargo-about: the Rust half of the third-party notices shipped with the app.
# desktop/app/scripts/build-notices.mjs runs it over the desktop workspace and
# the CLI, and adds the accepted licences from deny.toml's allow list, which
# CI enforces, so the two cannot drift apart.

# only what ships: the platforms Pinrail is built for, and no crates that run
# only at build time or in tests
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
