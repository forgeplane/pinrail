[tools]
erlang = "29.0.6"
elixir = "1.20.4-otp-29"
rust = "1.98.1"

[tasks."test:server"]
description = "Server unit and LiveView tests"
dir = "{{config_root}}/server"
run = "mix test"

[tasks."test:server:browser"]
description = "Server Playwright tests (shell and bridge)"
dir = "{{config_root}}/server"
run = "mix test.browser"

[tasks."test:cli"]
description = "CLI tests against a scripted HTTP server"
dir = "{{config_root}}/cli"
run = "cargo test"

[tasks."test:shell"]
description = "Shell and bridge JavaScript unit tests"
dir = "{{config_root}}/server/assets"
run = "npm test"

[tasks."test:sdk"]
description = "The wicket-plugin package: unit tests, and what create writes under the harness"
dir = "{{config_root}}/wicket-plugin"
run = "npm test"

[tasks."dev:plugin"]
description = "One plugin in a browser shell, without the app: mise run dev:plugin plugins/artifact"
run = "node {{config_root}}/wicket-plugin/bin/wicket-plugin.mjs dev {{arg(name='plugin')}}"

[tasks."test:plugins"]
description = "Each shipped plugin alone, under the wicket-plugin harness"
dir = "{{config_root}}/plugins"
run = "npm test"

[tasks.e2e]
description = "End to end: real server, real CLI, real browser, shipped plugins"
dir = "{{config_root}}/e2e"
run = "npm test"

[tasks."test:desktop"]
description = "Desktop app: core crate tests and a UI typecheck"
dir = "{{config_root}}/desktop"
run = ["cargo test", "npm --prefix app test"]

[tasks."e2e:desktop"]
description = "The CLI end-to-end specs against the headless desktop server"
dir = "{{config_root}}/e2e"
run = "WICKET_E2E_SERVER=desktop npx playwright test tests/cli.spec.ts tests/zz-restart.spec.ts"

[tasks."e2e:shell"]
description = "The desktop shell in a browser against the headless desktop server: settings, installing"
dir = "{{config_root}}/e2e"
run = "npx playwright test -c shell.config.ts"

[tasks."build:desktop"]
description = "Desktop app: build the UI and the app binary"
dir = "{{config_root}}/desktop"
run = ["npm --prefix app run build", "cargo build -p wicket-desktop"]

[tasks."dev:desktop"]
description = "Desktop app with the UI dev server and live reload"
dir = "{{config_root}}/desktop/app"
run = "npx tauri dev"

[tasks.lint]
description = "What CI enforces: rustfmt, clippy with warnings denied, the shell type-checked"
run = [
  "cargo fmt --check --manifest-path {{config_root}}/cli/Cargo.toml",
  "cargo fmt --all --check --manifest-path {{config_root}}/desktop/Cargo.toml",
  "cargo clippy --manifest-path {{config_root}}/cli/Cargo.toml --all-targets -- -D warnings",
  "cargo clippy --manifest-path {{config_root}}/desktop/Cargo.toml --workspace --all-targets -- -D warnings",
  "npm --prefix {{config_root}}/desktop/app test",
]

[tasks.test]
description = "Server, CLI and end-to-end suites"
depends = ["test:server", "test:shell", "test:cli", "test:sdk", "test:plugins", "e2e"]
