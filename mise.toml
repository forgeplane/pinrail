# Rust comes from rust-toolchain.toml, which rustup reads on its own
[tools]
node = "24"
# builds libghostty-vt for desktop/screen; its minor version must match
# the one desktop/screen/ghostty.lock names
zig = "0.17.1"
# runs the Rust test binaries in parallel
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.152"

[tasks.setup]
description = "Install and build what the tests and linters need, as CI does: run once after cloning, and again when dependencies change"
dir = "{{config_root}}"
run = [
  "npm ci",
  "cd desktop/app && npm ci && npm run build",
  "cd sdk && npm ci",
  "cd plugins && npm ci",
  "node scripts/sh.mjs scripts/build-plugins.sh",
  "cd e2e && npm ci && npx playwright install chromium",
]

[tasks."test:cli"]
description = "CLI tests against a scripted HTTP server"
dir = "{{config_root}}/cli"
run = "cargo test"

[tasks."test:sdk"]
description = "The pinrail-sdk package: unit tests, then the harness and the dev shell in a browser"
dir = "{{config_root}}/sdk"
run = "npm test"

[tasks."dev:plugin"]
description = "One plugin in a browser shell, without the app: mise run dev:plugin plugins/hello"
run = "node {{config_root}}/sdk/bin/pinrail-sdk.mjs dev {{arg(name='plugin')}}"

[tasks."plugins:build"]
description = "Build the plugins in plugins/ that have a build of their own, such as markdown: the app embeds their view/"
dir = "{{config_root}}"
run = "node scripts/sh.mjs scripts/build-plugins.sh"

[tasks."test:plugins"]
description = "The plugins in plugins/ alone, under the pinrail-sdk harness"
dir = "{{config_root}}/plugins"
run = "npm test"

[tasks."test:examples"]
description = "The docs' example plugins, each built and tested under the harness, and the same but for their views"
dir = "{{config_root}}/docs/examples/ship-it"
# a line each, as on Windows mise runs them with cmd
run = [
  "cd vanilla && npm ci && npm test",
  "cd react && npm ci && npm test",
  "cd vue && npm ci && npm test",
  "cd svelte && npm ci && npm test",
  "node --test same.test.mjs",
]

[tasks.e2e]
description = "End to end: the CLI against the desktop app's server, run headless"
dir = "{{config_root}}/e2e"
run = "npm test"

[tasks."test:desktop"]
description = "Desktop app: core crate tests, the UI's type check and unit tests, and the terminal renderers' contract in WebKit"
dir = "{{config_root}}/desktop"
run = ["cargo nextest run --workspace", "npm --prefix app test", "npm --prefix app run test:browser"]

[tasks."e2e:shell"]
description = "The desktop shell in a browser against the headless desktop server: settings, installing"
dir = "{{config_root}}/e2e"
run = "node run-shell.mjs"

[tasks."build:desktop"]
description = "Desktop app: build the UI and the app binary"
dir = "{{config_root}}/desktop"
run = ["npm --prefix app run build", "cargo build -p pinrail-desktop"]

[tasks."bench:host"]
description = "Terminal host: check the performance budgets; --baseline <file> also compares with a baseline"
dir = "{{config_root}}/desktop"
run = "cargo bench -q -p pinrail-host --bench host --"

[tasks."bench:terminal"]
description = "Window terminal renderers: check the performance budgets in WebKit; --cases, --adapters and --repeat narrow or repeat the run"
dir = "{{config_root}}/desktop/app"
# libghostty-vt's WebAssembly, which the libghostty renderer loads
depends = ["ghostty:wasm"]
run = "node ui/bench/terminal/run.mjs"

[tasks."check:terminal"]
description = "Window terminal renderers: the input, selection and accessibility checks in the system WKWebView (macOS); the window takes focus"
dir = "{{config_root}}/desktop/app"
depends = ["ghostty:wasm"]
run = "node ui/bench/terminal/check.mjs"

[tasks."dev:desktop"]
description = "Desktop app with the UI dev server and live reload, and the current terminal host"
dir = "{{config_root}}/desktop/app"
# tauri dev builds the app alone; the host it starts is built here, as
# Pinrail Host.app beside the app's binary on macOS
run = ["node scripts/build-host.mjs --dev", "npx tauri dev"]

[tasks."dev:telemetry"]
description = "Desktop app in dev mode with usage data on, in a data folder of its own; prints each batch, or sends it with --send"
dir = "{{config_root}}/desktop/app"
usage = '''
flag "--send" help="Send the batches to api.pinrail.dev instead of printing them"
flag "--fresh" help="Start from an empty data folder"
'''
run = "node {{config_root}}/scripts/dev-telemetry.mjs"

[tasks."linux-desktop"]
description = "The desktop app on Linux in Docker, shown in a browser at http://localhost:6080; needs Docker"
dir = "{{config_root}}"
run = [
  "docker build -q -t pinrail-linux-desktop docker/linux-desktop",
  "docker run --rm -it --name pinrail-linux -p 6080:6080 -v {{config_root}}:/src:ro -v pinrail-linux-work:/work -v pinrail-linux-cache:/cache --shm-size=1g pinrail-linux-desktop",
]

[tasks."ghostty:wasm"]
description = "Build libghostty-vt as WebAssembly for the window's terminal renderer, from the release desktop/screen pins"
run = "node {{config_root}}/scripts/sh.mjs {{config_root}}/scripts/ghostty-wasm.sh"

[tasks."ghostty:fetch"]
description = "Download and check the libghostty-vt tarballs desktop/screen builds, for a build without network"
run = "node {{config_root}}/scripts/sh.mjs {{config_root}}/scripts/ghostty-fetch.sh"

[tasks.lint]
description = "What CI enforces: rustfmt, clippy with warnings denied, the shell type-checked, ESLint and Prettier, dependency licences and sources"
# libghostty-vt is not built for clippy, so lint needs no Zig
env = { PINRAIL_GHOSTTY_STUB = "1" }
run = [
  "cargo fmt --check --manifest-path {{config_root}}/cli/Cargo.toml",
  "cargo fmt --all --check --manifest-path {{config_root}}/desktop/Cargo.toml",
  "cargo clippy --manifest-path {{config_root}}/cli/Cargo.toml --all-targets -- -D warnings",
  "cargo clippy --manifest-path {{config_root}}/desktop/Cargo.toml --workspace --all-targets -- -D warnings",
  "npm --prefix {{config_root}}/desktop/app test",
  "npm --prefix {{config_root}} run lint",
  "npm --prefix {{config_root}} run format:check",
  "cargo deny --manifest-path {{config_root}}/desktop/Cargo.toml --config {{config_root}}/deny.toml check licenses bans sources",
  "cargo deny --manifest-path {{config_root}}/cli/Cargo.toml --config {{config_root}}/deny.toml check licenses bans sources",
]

[tasks.format]
description = "Format the JavaScript, TypeScript and CSS with Prettier"
run = "npm --prefix {{config_root}} run format"

[tasks.audit]
description = "Known vulnerabilities in the dependencies: RustSec advisories for both Rust workspaces, and npm audit for the packages that ship"
dir = "{{config_root}}"
run = [
  "cargo deny --manifest-path desktop/Cargo.toml --config deny.toml check advisories",
  "cargo deny --manifest-path cli/Cargo.toml --config deny.toml check advisories",
  "cd desktop/app && npm audit --omit=dev --audit-level=high",
  "cd sdk && npm audit --omit=dev --audit-level=high",
]

[tasks.links]
description = "The relative links in the Markdown outside the site; needs lychee"
dir = "{{config_root}}"
run = "node scripts/links.mjs"

[tasks.workflows]
description = "The GitHub workflows: actionlint (with shellcheck) and zizmor; needs all three"
dir = "{{config_root}}"
run = [
  # with no files named, it finds the repository's workflows itself
  "actionlint",
  "zizmor --offline .github/workflows",
]

[tasks.test]
description = "Every suite, one after another: the desktop core and UI, the CLI, the SDK, the plugins, end to end"
# in turn, not side by side: each suite runs its own tests in parallel, and
# suites sharing the CPUs and cargo's lock made the timing tests flaky
run = [
  { task = "test:desktop" },
  { task = "test:cli" },
  { task = "test:sdk" },
  { task = "test:plugins" },
  { task = "test:examples" },
  { task = "e2e" },
  { task = "e2e:shell" },
]

[tasks."docs:generate"]
description = "The docs' generated reference pages: the CLI's from its own definition, the settings and the manifest from the core's tables"
dir = "{{config_root}}"
run = "node scripts/docs-generate.mjs"

[tasks.screenshots]
description = "Screenshots of the app for the docs and the website, light and dark, from fixed fixtures: mise run screenshots -- --only inbox"
dir = "{{config_root}}/e2e"
run = "node screenshots/run.mjs"

[tasks."screenshots:hero"]
description = "The plugin views in the website's hero window, at the pane's width and their whole length: mise run screenshots:hero -- video"
dir = "{{config_root}}/e2e"
run = "node screenshots/hero.mjs"
