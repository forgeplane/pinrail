# Rust comes from rust-toolchain.toml, which rustup reads on its own
[tools]
node = "24"

[tasks.setup]
description = "Install and build what the tests and linters need, as CI does: run once after cloning, and again when dependencies change"
dir = "{{config_root}}"
run = [
  "npm ci",
  "cd desktop/app && npm ci && npm run build",
  "cd pinrail-plugin && npm ci",
  "cd plugins && npm ci",
  "sh scripts/build-plugins.sh",
  "cd e2e && npm ci && npx playwright install chromium",
]

[tasks."test:cli"]
description = "CLI tests against a scripted HTTP server"
dir = "{{config_root}}/cli"
run = "cargo test"

[tasks."test:sdk"]
description = "The pinrail-plugin package: unit tests, and what create writes under the harness"
dir = "{{config_root}}/pinrail-plugin"
run = "npm test"

[tasks."dev:plugin"]
description = "One plugin in a browser shell, without the app: mise run dev:plugin plugins/hello"
run = "node {{config_root}}/pinrail-plugin/bin/pinrail-plugin.mjs dev {{arg(name='plugin')}}"

[tasks."plugins:build"]
description = "Build the plugins in plugins/ that have a build of their own, such as markdown: the app embeds their view/"
dir = "{{config_root}}"
run = "sh scripts/build-plugins.sh"

[tasks."test:plugins"]
description = "The plugins in plugins/ alone, under the pinrail-plugin harness"
dir = "{{config_root}}/plugins"
run = "npm test"

[tasks."test:examples"]
description = "The docs' example plugins, each built and tested under the harness, and the same but for their views"
dir = "{{config_root}}/docs/examples/ship-it"
run = [
  "for dir in vanilla react vue svelte; do (cd $dir && npm ci && npm test) || exit 1; done",
  "node --test same.test.mjs",
]

[tasks.e2e]
description = "End to end: the CLI against the desktop app's server, run headless"
dir = "{{config_root}}/e2e"
run = "npm test"

[tasks."test:desktop"]
description = "Desktop app: core crate tests, and the UI's type check and unit tests"
dir = "{{config_root}}/desktop"
run = ["cargo test", "npm --prefix app test"]

[tasks."e2e:shell"]
description = "The desktop shell in a browser against the headless desktop server: settings, installing"
dir = "{{config_root}}/e2e"
run = "npx playwright test -c shell.config.ts"

[tasks."build:desktop"]
description = "Desktop app: build the UI and the app binary"
dir = "{{config_root}}/desktop"
run = ["npm --prefix app run build", "cargo build -p pinrail-desktop"]

[tasks."dev:desktop"]
description = "Desktop app with the UI dev server and live reload"
dir = "{{config_root}}/desktop/app"
run = "npx tauri dev"

[tasks."linux-desktop"]
description = "The desktop app on Linux in Docker, shown in a browser at http://localhost:6080; needs Docker"
dir = "{{config_root}}"
run = [
  "docker build -q -t pinrail-linux-desktop docker/linux-desktop",
  "docker run --rm -it --name pinrail-linux -p 6080:6080 -v {{config_root}}:/src:ro -v pinrail-linux-work:/work -v pinrail-linux-cache:/cache --shm-size=1g pinrail-linux-desktop",
]

[tasks.lint]
description = "What CI enforces: rustfmt, clippy with warnings denied, the shell type-checked, ESLint and Prettier, dependency licences and sources"
run = [
  "cargo fmt --check --manifest-path {{config_root}}/cli/Cargo.toml",
  "cargo fmt --all --check --manifest-path {{config_root}}/desktop/Cargo.toml",
  "cargo clippy --manifest-path {{config_root}}/cli/Cargo.toml --all-targets -- -D warnings",
  "cargo clippy --manifest-path {{config_root}}/desktop/Cargo.toml --workspace --all-targets -- -D warnings",
  "npm --prefix {{config_root}}/desktop/app test",
  "npm --prefix {{config_root}} run lint",
  "npm --prefix {{config_root}} run format:check",
  "cargo deny --manifest-path {{config_root}}/desktop/Cargo.toml --config {{config_root}}/deny.toml check licenses bans sources",
  "cargo deny --manifest-path {{config_root}}/cli/Cargo.toml --config {{config_root}}/deny.toml check licenses bans sources",
]

[tasks.format]
description = "Format the JavaScript, TypeScript and CSS with Prettier"
run = "npm --prefix {{config_root}} run format"

[tasks.audit]
description = "Known vulnerabilities in the dependencies: RustSec advisories for both Rust workspaces, and npm audit for the packages that ship"
dir = "{{config_root}}"
run = [
  "cargo deny --manifest-path desktop/Cargo.toml --config deny.toml check advisories",
  "cargo deny --manifest-path cli/Cargo.toml --config deny.toml check advisories",
  "for d in desktop/app pinrail-plugin; do (cd $d && npm audit --omit=dev --audit-level=high) || exit 1; done",
]

[tasks.links]
description = "The relative links in the Markdown outside the site; needs lychee"
dir = "{{config_root}}"
run = "git ls-files -z '*.md' ':!docs' ':!website' ':!**/fixtures/**' | xargs -0 lychee --offline --no-progress --include-fragments"

[tasks.workflows]
description = "The GitHub workflows: actionlint (with shellcheck) and zizmor; needs all three"
dir = "{{config_root}}"
run = [
  "actionlint .github/workflows/*.yml pinrail-plugin/templates/common/.github/workflows/*.yml",
  "zizmor --offline .github/workflows pinrail-plugin/templates/common/.github/workflows",
]

[tasks.test]
description = "Every suite: the desktop core and UI, the CLI, the SDK, the plugins, end to end"
depends = ["test:desktop", "test:cli", "test:sdk", "test:plugins", "test:examples", "e2e", "e2e:shell"]

[tasks."docs:generate"]
description = "The docs' generated reference pages: the CLI's from its own definition, the settings and the manifest from the core's tables"
dir = "{{config_root}}"
run = "node scripts/docs-generate.mjs"

[tasks.screenshots]
description = "Screenshots of the app for the docs and the website, light and dark, from fixed fixtures: mise run screenshots -- --only inbox"
dir = "{{config_root}}/e2e"
run = "node screenshots/run.mjs"
