<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>pinrail plugin harness</title></head>
<body style="margin:0;background:#101216">
<iframe id="plugin-frame" sandbox="allow-scripts" style="display:block;width:100%;height:100vh;border:0"></iframe>
<script type="module">
// A stand-in for the app, with the app's side of the protocol from
// ../host/host.js, so a plugin can be exercised alone. It records every
// message the plugin posts and lets a test send any message. A test answers
// a submit itself, with sendSubmitted or sendViolations, or asks handOver()
// to hand over as the app does.
import { connectFrame } from "/_host.js";

const frame = document.getElementById("plugin-frame");
const log = [];
let pending = null; // what init carries, given by the test
let lastDraft = null;
let lastStatus = null;
let lastOpen = null;
let lastSettingsSet = null;
// the test waiting on handOver(): resolved with what became of the request
let waiting = null;
// the test waiting on collect(): resolved once the view has answered
let answered = null;
const heard = () => {
  const resolve = answered;
  answered = null;
  if (resolve) resolve(true);
};
const settle = (outcome) => {
  const resolve = waiting;
  waiting = null;
  if (resolve) resolve(outcome);
};

// "shift+a" -> the fields of the key message the app sends
function keyMessage(combo) {
  const parts = String(combo).toLowerCase().split("+").map((p) => p.trim());
  const name = parts.pop();
  const mods = new Set(parts);
  const shift = mods.has("shift");
  const special = { enter: ["Enter", "Enter"], escape: ["Escape", "Escape"], space: [" ", "Space"], tab: ["Tab", "Tab"], arrowup: ["ArrowUp", "ArrowUp"], arrowdown: ["ArrowDown", "ArrowDown"], arrowleft: ["ArrowLeft", "ArrowLeft"], arrowright: ["ArrowRight", "ArrowRight"], "/": [shift ? "?" : "/", "Slash"], "[": ["[", "BracketLeft"], "]": ["]", "BracketRight"], ",": [",", "Comma"], ".": [".", "Period"] };
  const [key, code] = special[name] || (name.length === 1 && /[a-z]/.test(name) ? [shift ? name.toUpperCase() : name, "Key" + name.toUpperCase()] : name.length === 1 && /[0-9]/.test(name) ? [name, "Digit" + name] : [name, name]);
  return { key, code, metaKey: mods.has("cmd") || mods.has("meta") || mods.has("super") || mods.has("command"), ctrlKey: mods.has("ctrl") || mods.has("control"), altKey: mods.has("alt") || mods.has("option"), shiftKey: shift };
}

const host = connectFrame(frame, {
  origin: location.origin,
  review: () => pending && pending.review,
  previous: () => (pending && pending.previous) || null,
  readonly: () => !!(pending && pending.readonly),
  settings: () => (pending && pending.settings) || {},
  loadDraft: () => (pending ? pending.draft ?? null : null),
  // the files a fixture names, as the app fetches them from the core
  file: async (_review, listed, round) => {
    const response = await fetch(`/_attachments/${round}/${encodeURIComponent(listed.name)}`);
    if (!response.ok) throw new Error(`could not fetch ${listed.name}`);
    return response.arrayBuffer();
  },
  // as the app, when a test asked: the decision checked against the
  // plugin's schema, then accepted or refused; otherwise the test answers
  handOver: async (data) => {
    heard();
    if (!waiting) return null;
    const violations = await window.__pinrailCheckDecision(data);
    if (violations.length) {
      settle({ violations });
      return { ok: false, violations };
    }
    const decision = { data, decided_by: "you", decided_at: new Date().toISOString() };
    settle({ decision });
    return { ok: true, decision };
  },
  // as the app: a change the settings schema refuses is answered with the
  // errors; one it allows is kept for the next init
  setSettings: async (patch) => {
    const errors = await window.__pinrailCheckSettings(patch);
    if (!errors.length && pending) pending = Object.assign({}, pending, { settings: Object.assign({}, pending.settings, patch) });
    return errors;
  },
  onDefer: () => {
    heard();
    settle({ deferred: true });
  },
  // the app opens it; here it is only recorded
  open: (url) => (lastOpen = url),
  observe: (direction, msg) => {
    if (direction !== "in") return;
    log.push(msg);
    if (msg.type === "draft") lastDraft = msg.data;
    if (msg.type === "status") lastStatus = msg.label;
    if (msg.type === "settings_set") lastSettingsSet = msg.patch;
  },
});

window.__shell = {
  init(next) { pending = next; host.init(); },
  reinit(overrides) { pending = Object.assign({}, pending, { draft: lastDraft }, overrides || {}); host.init(); },
  send: (msg) => host.send(msg),
  /* the hand-over button: a request for the decision, numbered as the app numbers it */
  collect: () =>
    new Promise((resolve) => {
      answered = resolve;
      if (!host.collect()) {
        answered = null;
        resolve(false);
      }
    }),
  handOver: () =>
    new Promise((resolve) => {
      waiting = resolve;
      if (!host.collect()) settle({ asked: false });
    }),
  messages: () => log.slice(),
  lastDraft: () => lastDraft,
  lastStatus: () => lastStatus,
  lastOpen: () => lastOpen,
  lastSettingsSet: () => lastSettingsSet,
  /* the plugin's settings changed in the app: the values as they stand */
  settings(values) { host.send({ type: "settings", settings: values }); },
  /* a declared shortcut pressed while the shell had focus, as "shift+a" or "j" */
  sendKey(combo) { host.send(Object.assign({ type: "key" }, keyMessage(combo))); },
  // The frame is the panel's height, as in the app; a test can change it,
  // to make a view scroll.
  setFrameHeight(px) { frame.style.height = px + "px"; },
  reload() { host.reload(); frame.src = frame.src; },
};

// The real shell puts its theme on the frame's URL; mirror that, so a test can
// mount a plugin in either theme and see what it paints before any message.
const theme = new URLSearchParams(location.search).get("theme") === "light" ? "light" : "dark";
document.body.style.background = theme === "light" ? "#ffffff" : "#101216";
// the view's page, index.html in the view/ of the bundle the harness serves
const entry = new URLSearchParams(location.search).get("entry") || "index.html";
frame.src = entry + "#pinrail-theme=" + theme;
</script>
</body>
</html>
